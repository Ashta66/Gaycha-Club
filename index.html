<style>
:root{color-scheme:dark;--bg:#101010;--ch:#1D1D20;--gold:#D6B46A;--cream:#F4EBDD;--mut:#a9a39a;--rb:linear-gradient(90deg,#FF477E,#FF8A00,#FFDA45,#8CCF35,#00A9A5,#3867FF,#C9A7FF)}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 85% -10%,#D6B46A22,transparent 60%),radial-gradient(700px 500px at -10% 35%,#FF477E14,transparent 60%),radial-gradient(600px 400px at 60% 110%,#00A9A514,transparent 60%),var(--bg);background-attachment:fixed;color:var(--cream);font:16px/1.5 Fraunces,Georgia,serif}
h1,h2,.logo{font-family:Anton,Impact,sans-serif;font-weight:400;margin:0;letter-spacing:.02em}
h1{font-size:clamp(36px,6vw,60px);line-height:1.05}h2{font-size:30px;margin:26px 0 8px}
main>h1::after,.rbar{content:"";display:block;height:4px;width:110px;margin-top:8px;border-radius:2px;background:var(--rb)}
button{font:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:10;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 20px 15px;background:#1D1D20ee;backdrop-filter:blur(8px)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rb);background-size:200% 100%;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:200% 0}}
.logo{font-size:28px;color:var(--gold);line-height:1;text-shadow:0 0 18px #D6B46A44}.logo small{font:600 10px Fraunces;letter-spacing:.5em;display:block;color:var(--cream)}
header nav{display:flex;gap:6px;flex-wrap:wrap}header nav .btn{padding:8px 14px;min-height:40px;font-size:14px}
header .me{margin-left:auto;color:var(--mut);font-size:14px}
main{max-width:1100px;margin:0 auto;padding:30px 20px 60px}
.hero{padding:14px 0 10px}.hero p{color:var(--mut);margin:8px 0 12px}
.btn{background:linear-gradient(180deg,#e8cb86,#D6B46A);color:#101010;border:0;border-radius:8px;padding:12px 20px;font-weight:600;min-height:46px;transition:transform .15s,box-shadow .15s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 20px #D6B46A44}
.btn.alt{background:#ffffff08;color:var(--cream);border:1px solid #D6B46A99}
.btn.alt:hover:not(:disabled){border:1px solid transparent;background:linear-gradient(#1D1D20,#1D1D20) padding-box,var(--rb) border-box;box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
input,select,textarea{background:#101010;color:var(--cream);border:1px solid #4a4233;border-radius:8px;padding:10px 12px;min-height:44px;font:inherit;width:100%;margin:6px 0}
.box{position:relative;overflow:hidden;max-width:420px;background:#1D1D20;border:1px solid #3a3326;border-radius:12px;padding:22px;margin:20px auto}
.box::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--rb);opacity:.9}
.note{background:var(--ch);border-left:4px solid #FF477E;padding:12px 16px;border-radius:0 8px 8px 0;color:var(--mut);margin:14px 0}
.err{border-color:#ff5555;color:#ffb4b4}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #333;text-align:left;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px;margin-top:18px}
/* ===== Cartes ===== */
.card{--s1:#FF477E;--s2:#c4204f;--r:#8a95a3;position:relative;aspect-ratio:5/7;border-radius:14px;background:#0b0b0c;border:3px solid var(--r);padding:6px;display:flex;flex-direction:column;overflow:hidden;color:#fff;width:100%;container-type:inline-size;cursor:pointer;text-align:left;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px) scale(1.02)}
.band{background:linear-gradient(90deg,var(--s1),var(--s2));color:#101010;font-family:Anton,sans-serif;font-size:max(9px,6.2cqw);letter-spacing:.12em;padding:.8cqw 2.6cqw;border-radius:4px;display:flex;justify-content:space-between}
.art{position:relative;overflow:hidden;flex:1;margin:6px 0;border-radius:6px;background:radial-gradient(circle at 50% 35%,var(--s1) 0,transparent 58%),linear-gradient(160deg,#26262b,#0b0b0c);display:grid;place-items:center}
.art::before{content:"";position:absolute;inset:0;background:radial-gradient(#ffffff26 1px,transparent 1.6px) 0 0/8px 8px;mix-blend-mode:overlay}
.art b{font-family:Anton,sans-serif;font-weight:400;font-size:40cqw;line-height:1;background:linear-gradient(180deg,#fff,#ffffffaa);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #0009)}
.art i{position:absolute;bottom:4px;left:6px;font-style:normal;font-size:max(7px,4cqw);opacity:.55}
.nm{font-family:Anton,sans-serif;font-size:max(11px,9cqw);letter-spacing:.03em}
.spec{font-size:max(8.5px,5.4cqw);line-height:1.25;color:#d8d2c8}
.meta{display:flex;justify-content:space-between;font-size:max(8.5px,5.2cqw);margin-top:2px}.rar{color:var(--r);font-weight:600}
.x{position:absolute;top:8.5cqw;right:2cqw;background:var(--gold);color:#101010;border-radius:10px;font:600 max(10px,5cqw) Fraunces;padding:1px 8px;z-index:2}
.r-peu_commun{--r:#2fa57a;background-image:repeating-linear-gradient(45deg,#ffffff06 0 6px,transparent 6px 12px)}
.r-rare{--r:#3867FF;box-shadow:0 0 16px #3867FF66,inset 0 0 0 1px #9bb0ff}
.r-epique{--r:#e03bd0;box-shadow:0 0 20px #e03bd088}
.r-legendaire{--r:#D6B46A;box-shadow:0 0 24px #D6B46A99,inset 0 0 0 2px #7a5f22}
.r-secrete{--r:#fff;border-color:transparent;background:linear-gradient(#0b0b0c,#0b0b0c) padding-box,conic-gradient(from var(--a),#ff477e,#ffda45,#8ccf35,#00a9a5,#3867ff,#c9a7ff,#ff477e) border-box;animation:spin 6s linear infinite;box-shadow:0 0 22px #c9a7ff55}
@keyframes spin{to{--a:360deg}}
.r-epique::after,.r-legendaire::after,.r-secrete::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,#ffffff40 48%,transparent 60%);background-size:250% 100%;background-position:150% 0;animation:sh 3.5s infinite}
.r-secrete::after{background-image:linear-gradient(115deg,#ff477e44,#ffda4444,#00a9a544,#3867ff44,#c9a7ff44,transparent);animation-direction:alternate;animation-duration:2.5s}
@keyframes sh{to{background-position:-50% 0}}
/* Ouverture de booster */
.fl{aspect-ratio:5/7;perspective:900px}.fi{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s}.fl.on .fi{transform:rotateY(180deg)}
.fb,.ff{position:absolute;inset:0;backface-visibility:hidden}.ff{transform:rotateY(180deg)}.ff .card{height:100%}.fl .card:hover{transform:none}
.fl.hi.on{animation:pop .9s}@keyframes pop{30%{filter:brightness(2) drop-shadow(0 0 26px #FFDA45);transform:scale(1.08)}}
.back{display:grid;place-items:center;border:3px solid var(--gold);background:repeating-conic-gradient(#ff477e18 0 15deg,#3867ff18 0 30deg),#0b0b0c}
.sealed{width:200px;aspect-ratio:5/8;margin:20px auto;background:linear-gradient(160deg,#2a2418,#0b0b0c);border:3px solid var(--gold);border-radius:10px;display:grid;place-content:center;text-align:center;animation:shk .5s 2;box-shadow:0 0 30px #D6B46A55}
@keyframes shk{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
/* Vue en grand */
dialog{position:relative;background:var(--ch);color:var(--cream);border:0;border-radius:16px;padding:26px;max-width:860px;width:94vw}
dialog::backdrop{background:#000d;backdrop-filter:blur(4px)}
dialog::before{content:"";position:absolute;inset:0;border-radius:16px;padding:2px;background:var(--rb);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.zw{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:28px;align-items:center}
@media(max-width:640px){.zw{grid-template-columns:1fr}.zc{max-width:300px;margin:0 auto}}
.zc{position:relative;transition:transform .12s;will-change:transform}.zc .card:hover{transform:none}
.glare{position:absolute;inset:0;border-radius:14px;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,25%),#ffffff55,transparent 45%);mix-blend-mode:overlay}
.zx{position:absolute;top:12px;right:12px;z-index:2;min-height:40px;padding:6px 14px}
.zi h2{margin-top:0}
@media(prefers-reduced-motion:reduce){header::after,.r-secrete,.r-epique::after,.r-legendaire::after,.r-secrete::after,.sealed,.fl.hi.on{animation:none}.fi,.card,.btn,.zc{transition:none}.card:hover{transform:none}}

/* ===== GAYCHA CLUB — matière, papier et fabrication humaine ===== */
:root{color-scheme:dark;--bg:#171414;--ch:#24201f;--gold:#d8b779;--cream:#f2e8d8;--mut:#b9aaa0;--rb:linear-gradient(90deg,#e66c79,#d8b779,#7eaa8d)}
body{background-color:var(--bg);background-image:radial-gradient(ellipse at 12% 0%,#743d4020,transparent 34%),radial-gradient(ellipse at 100% 42%,#b99a6b0e,transparent 30%),repeating-linear-gradient(0deg,#ffffff02 0 1px,transparent 1px 4px);color:var(--cream);font-family:'DM Sans',sans-serif;letter-spacing:.005em}
h1,h2,.logo{font-family:'DM Serif Display',Georgia,serif;letter-spacing:0;font-weight:400}

.logo{color:#e4c38b;text-shadow:none;font-size:30px}
.logo small{font-family:'DM Sans',sans-serif;letter-spacing:.28em;font-size:9px}
header nav .btn{font-size:13px;border-radius:4px;min-height:38px}
.btn{border-radius:5px;background:#d8b779;color:#211b19;box-shadow:none;font-family:'DM Sans',sans-serif;font-weight:700;transition:transform .18s,background .18s,border-color .18s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 14px #0003;background:#e7cb96}

input,select,textarea{background:#171414;color:var(--cream);border:1px solid #554a40;border-radius:5px;font-family:'DM Sans',sans-serif}
.box{background:#24201f;border:1px solid #55473b;border-radius:5px;box-shadow:0 10px 26px #00000012}
.box::before{height:2px;opacity:.7;background:linear-gradient(90deg,#d8b779,#e66c79,#7eaa8d)}
.note{background:#2a2422;border-left:3px solid #d8b779;border-radius:0 4px 4px 0;color:#d0c1b3}
.grid{gap:24px}
.card{border-radius:5px;box-shadow:0 5px 12px #0005, inset 0 0 0 1px #ffffff12}

.band{letter-spacing:.08em;border-radius:2px}
.art{border-radius:2px}
.r-rare{box-shadow:0 0 0 1px #3867FF,inset 0 0 0 1px #9bb0ff}
.r-epique{box-shadow:0 0 0 1px #e03bd0}
.r-legendaire{box-shadow:0 0 0 1px #D6B46A,inset 0 0 0 1px #7a5f22}

.hero{padding:12px 0 18px}
.section-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:#d8b779;font-weight:700;margin:0 0 8px}
.lead{max-width:690px;color:#c5b8ac;font-size:16px}
.panel-heading{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin:28px 0 12px}
.panel-heading h2{margin:0}
.small-muted{font-size:13px;color:#b9aaa0}
.booster-intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,.8fr);gap:24px;align-items:center;padding:18px 0 28px}
.booster-copy{max-width:560px}
.booster-shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:center;perspective:1000px}
.booster-choice{border:0;background:transparent;color:var(--cream);padding:8px;display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.pack-3d{--pack-a:#743f47;--pack-b:#d4a46f;position:relative;display:block;width:min(100%,190px);aspect-ratio: .63;isolation:isolate;transform-style:preserve-3d;transform:rotateY(-13deg) rotateX(3deg) rotateZ(-2deg);transition:transform .35s,filter .35s;filter:drop-shadow(10px 16px 10px #0008)}
.pack-3d::before{content:"";position:absolute;z-index:-1;top:3%;bottom:3%;right:-7px;width:10px;background:linear-gradient(90deg,#5a3034,#c18b68,#43262b);transform:skewY(-2deg) translateZ(-3px);border-radius:1px 4px 4px 1px}
.pack-3d::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(112deg,transparent 0 19%,#ffffff22 22%,transparent 28% 55%,#ffffff17 58%,transparent 66%),repeating-linear-gradient(176deg,#ffffff0a 0 2px,transparent 2px 7px);mix-blend-mode:screen}
.pack-face{position:absolute;inset:0;overflow:hidden;border:1px solid #f5d5a080;border-radius:4px;background:radial-gradient(ellipse at 50% 33%,color-mix(in srgb,var(--pack-b),transparent 15%),transparent 35%),linear-gradient(145deg,var(--pack-a),#1b1517 65%,var(--pack-b));box-shadow:inset 0 0 0 3px #17141455,inset 0 0 25px #0008;display:flex;flex-direction:column;align-items:center;text-align:center;padding:8% 7%}

.pack-brand{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(14px,2vw,22px);line-height:1.05;margin-top:12%;color:#f6e8d5;text-shadow:0 2px 2px #0008}
.pack-stamp{margin-top:auto;width:78%;aspect-ratio:1;border:1px solid #e6c48b99;border-radius:50%;display:grid;place-items:center;font-family:'DM Serif Display',Georgia,serif;font-size:clamp(32px,6vw,58px);color:#f6e8d5;background:radial-gradient(circle,#e7c58a25,transparent 67%);box-shadow:inset 0 0 0 5px #ffffff08}
.pack-sub{font-size:9px;letter-spacing:.18em;text-transform:uppercase;margin-top:12%;color:#f1d7ad}
.pack-bottom{font-size:9px;letter-spacing:.12em;margin-top:auto;color:#f2e3d2}
.pack-label{font-size:14px;font-weight:700}
.pack-price{font-size:12px;color:#c9b9a9}
.booster-choice:hover .pack-3d,.booster-choice:focus-visible .pack-3d{transform:rotateY(0deg) rotateX(-2deg) rotateZ(2deg) translateY(-7px) scale(1.025);filter:drop-shadow(14px 22px 14px #0009) brightness(1.08)}

.pack-red{--pack-a:#6d263b;--pack-b:#df897b}
.pack-gold{--pack-a:#665034;--pack-b:#e5c58b}

.booster-opening{grid-column:1/-1;min-height:180px;display:grid;place-items:center;position:relative}
.sealed{width:210px;aspect-ratio:.63;margin:20px auto;background:linear-gradient(145deg,#6d263b,#1a1416 56%,#d4a46f);border:1px solid #e6c48b;border-radius:4px;display:grid;place-content:center;text-align:center;box-shadow:0 22px 38px #0008;animation:packTear .9s ease-in-out 1;position:relative;overflow:hidden}
.sealed::before{content:"";position:absolute;inset:5px;border:1px solid #e6c48b77}

@keyframes packTear{0%{transform:rotate(-5deg) scale(.85);clip-path:inset(0 0 0 0)}30%{transform:rotate(5deg) scale(1.04)}65%{transform:rotate(-2deg) scale(1.08);filter:brightness(1.8)}100%{transform:rotate(0) scale(1);clip-path:inset(0 0 0 0)}}

</style></head><body>
<header><div class="logo">GAYCHA<small>CLUB</small></div>
<nav><button class="btn alt" data-v="catalog">Catalogue</button><button class="btn alt" data-v="collection">Ma collection</button><button class="btn alt" data-v="booster">Boosters</button><button class="btn alt" data-v="missions">Missions</button><button class="btn alt" data-v="market">Marché</button><button class="btn alt" data-v="leaderboard">Classement</button><button class="btn alt" data-v="trades">Échanges</button><button class="btn alt" data-v="messages">Messages</button><button class="btn alt" data-v="admin" id="nadm" hidden>Admin</button></nav>

<main id="app" aria-live="polite"></main>
<script>
// ===== CONFIG : URL et clé PUBLIQUE uniquement. Jamais la clé service_role. =====
const SUPABASE_URL='https://tgnembausaanuazoelxw.supabase.co';
const SUPABASE_KEY='sb_publishable_xPvkIsb6dO0DVHXrf6Gs-g_wGrdewIx';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id),app=$('app');
const RN={commun:['Commun','●'],peu_commun:['Peu commun','⬢'],rare:['Rare','◆'],epique:['Épique','★'],legendaire:['Légendaire','♛'],secrete:['Secrète','◈']};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null,profile=null,cards=[],busy=false;
const msg=(t,e)=>`<div class="note ${e?'err':''}">${esc(t)}</div>`;
function card(c,n){const r=RN[c.rarity],s=c.series||{};
return `<div class="card r-${c.rarity}" data-cid="${esc(c.id)}" tabindex="0" role="button" aria-label="Agrandir ${esc(c.name)}" style="--s1:${esc(s.color_a)};--s2:${esc(s.color_b)}"><div class="band"><span>${esc((s.name||'').toUpperCase())}</span><span>${r[1]} ${r[0].toUpperCase()}</span></div>${n>1?`<span class="x">×${n}</span>`:''}<div class="art"><b>${esc(c.name.replace(/^(Le |La |L’|Madame |Diva du )/,'').charAt(0).toUpperCase())}</b><i>Illustration à venir</i></div><div class="nm">${esc(c.name)}</div><div class="spec">${esc(c.spec)}</div><div class="meta"><span class="rar">${r[1]} ${r[0]}</span><span>N° ${String(c.number).padStart(3,'0')}</span></div></div>`}
async function loadCards(){const {data,error}=await sb.from('cards').select('id,name,rarity,number,spec,anecdote,bio,series(name,color_a,color_b)').order('number');if(error)throw error;cards=data}
async function refresh(){const {data:{session}}=await sb.auth.getSession();user=session?.user||null;profile=null;
if(user){const {data}=await sb.from('profiles').select('username,balance,age_confirmed_at,role').eq('id',user.id).maybeSingle();profile=data}
$('nadm').hidden=!['admin','moderator','catalog_manager'].includes(profile?.role);
$('me').innerHTML=user?`${esc(profile?.username||user.email)} · ${profile?.balance??0} 💰 <button class="btn alt" id="out">Déconnexion</button>`:'';
if(user)$('out').onclick=async()=>{await sb.auth.signOut();go('catalog')}}
async function go(v){await refresh();try{if(!cards.length)await loadCards()}catch(e){app.innerHTML=msg('Impossible de charger le catalogue : '+e.message,1);return}
if(v!=='catalog'&&!user)return auth();
({catalog,collection,booster,missions,market,leaderboard,trades,messages,admin})[v]()}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
function catalog(){app.innerHTML=`<div class="hero"><p class="section-kicker">L’encyclopédie des séries</p><h1>Les cartes connues.</h1><p class="lead">Explore les séries et admire les cartes en grand. Pour garder le plaisir de la découverte, cette encyclopédie peut évoluer vers des silhouettes pour les cartes que tu n’as pas encore trouvées.</p><div class="rbar"></div></div>${cards.length?'':msg('Aucune carte publiée. Vérifiez que phase2_seed.sql a été exécuté.')}<div class="grid cards-grid">${cards.map(c=>card(c)).join('')}</div>`}
function auth(){app.innerHTML=`<div class="box"><h2>Connexion</h2><input id="em" type="email" placeholder="E-mail" autocomplete="email"><input id="pw" type="password" placeholder="Mot de passe (8 caractères min.)" autocomplete="current-password"><input id="un" placeholder="Pseudo (inscription : 3 à 20 lettres, chiffres, _)"><button class="btn" id="li">Se connecter</button> <button class="btn alt" id="su">Créer un compte</button><div id="am"></div></div>`;
const v=()=>[$('em').value.trim(),$('pw').value];
$('li').onclick=async()=>{const[e,p]=v();const {error}=await sb.auth.signInWithPassword({email:e,password:p});error?$('am').innerHTML=msg(error.message,1):go('collection')};
$('su').onclick=async()=>{const[e,p]=v();const {error}=await sb.auth.signUp({email:e,password:p,options:{data:{username:$('un').value.trim()}}});$('am').innerHTML=error?msg(error.message,1):msg('Compte créé. Confirmez votre adresse via l’e-mail reçu, puis connectez-vous.')}}
async function ageGate(){app.innerHTML=`<div class="box"><h2>Réservé aux 18 ans et plus</h2><p>Ce site contient de l’humour adulte. Confirmez que vous avez 18 ans ou plus. Il s’agit d’une déclaration, pas d’une vérification d’identité.</p><button class="btn" id="ok">J’ai 18 ans ou plus</button><div id="am"></div></div>`;
$('ok').onclick=async()=>{const {error}=await sb.rpc('confirm_age');error?$('am').innerHTML=msg(error.message,1):go('booster')}}
async function collection(){app.innerHTML='<h1>Ma collection</h1><p>Chargement…</p>';
const {data,error}=await sb.from('card_instances').select('card_id,acquired_at').order('acquired_at',{ascending:false});
if(error)return app.innerHTML=msg(error.message,1);
const cnt={};data.forEach(d=>cnt[d.card_id]=(cnt[d.card_id]||0)+1);
const own=cards.filter(c=>cnt[c.id]);
app.innerHTML=`<h1>Ma collection</h1><p>${own.length} / ${cards.length} cartes découvertes</p>${own.length?'':msg('Votre album est vide. Ouvrez un booster.')}<div class="grid">${own.map(c=>`<div>${card(c,cnt[c.id])}${cnt[c.id]>1?`<button class="btn alt" style="width:100%;margin-top:6px" data-conv="${c.id}" data-n="${cnt[c.id]-1}">Convertir ${cnt[c.id]-1} doublon(s)</button>`:''}<button class="btn alt" style="width:100%;margin-top:6px" data-sell="${c.id}">Vendre</button></div>`).join('')}</div><div id="cm"></div>`;
app.querySelectorAll('[data-conv]').forEach(b=>b.onclick=async()=>{b.disabled=true;const {data:g,error:e}=await sb.rpc('convert_duplicates',{p_card:b.dataset.conv,p_qty:+b.dataset.n,p_key:crypto.randomUUID()});if(e){$('cm').innerHTML=msg(e.message,1);b.disabled=false;return}await refresh();collection();$('cm').innerHTML=msg('+'+g+' 💰 ajoutés à votre solde.')});
app.querySelectorAll('[data-sell]').forEach(b=>b.onclick=async()=>{const pr=prompt('Prix de vente en 💰 (1 à 1 000 000) ?');if(!pr)return;const {data:ins}=await sb.from('card_instances').select('id').eq('card_id',b.dataset.sell).eq('locked',false).order('acquired_at',{ascending:false}).limit(1);if(!ins?.length){$('cm').innerHTML=msg('Aucun exemplaire disponible (déjà en vente ?).',1);return}const {error:e}=await sb.rpc('list_card',{p_instance:ins[0].id,p_price:parseInt(pr,10)});$('cm').innerHTML=e?msg(e.message,1):msg('Carte mise en vente. Retrouvez-la dans le Marché.')})}
function booster(){if(profile&&!profile.age_confirmed_at)return ageGate();
app.innerHTML=`<div class="booster-intro"><div class="booster-copy"><p class="section-kicker">Séries scellées · tirage serveur</p><h1>Le plaisir d’ouvrir.</h1><p class="lead">Choisis un paquet, regarde-le prendre la lumière, puis découvre tes cinq cartes une à une. Chaque paquet a son caractère ; les tirages, eux, restent décidés par le serveur.</p><div class="note">Les probabilités et les garanties sont affichées ici en toute transparence. Une animation peut être passée à tout moment.</div></div><div class="booster-shelf"><button class="booster-choice" data-b="petit-malaise" aria-label="Ouvrir Le Petit Malaise"><span class="pack-3d pack-red"><span class="pack-face"><span class="pack-crimp"></span><span class="pack-brand">GAYCHA<br>CLUB</span><span class="pack-stamp">!</span><span class="pack-sub">Le Petit Malaise</span><span class="pack-bottom">SÉRIE COLLECTOR · 05 CARTES</span><span class="pack-crimp"></span></span><span class="pack-spark"></span></span><span class="pack-label">Le Petit Malaise</span><span class="pack-price">Gratuit · 1 par jour</span></button><button class="booster-choice" data-b="red-flag" aria-label="Ouvrir Le Red Flag"><span class="pack-3d pack-gold"><span class="pack-face"><span class="pack-crimp"></span><span class="pack-brand">GAYCHA<br>CLUB</span><span class="pack-stamp">⚑</span><span class="pack-sub">Le Red Flag</span><span class="pack-bottom">SÉRIE COLLECTOR · 05 CARTES</span><span class="pack-crimp"></span></span><span class="pack-spark"></span></span><span class="pack-label">Le Red Flag</span><span class="pack-price">100 💰</span></button></div></div><div class="panel-heading"><h2>Ouverture</h2><span class="small-muted">5 cartes · une à une</span></div><div id="odds" class="note">Chargement des probabilités…</div><div id="pk" class="grid cards-grid"></div>`;
app.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>open5(b.dataset.b));
sb.from('booster_types').select('name,odds,pity_threshold').eq('active',true).then(({data,error})=>{$('odds').innerHTML=error?'Les probabilités sont momentanément indisponibles.':(data||[]).map(t=>'<b>'+esc(t.name)+'</b> : '+Object.entries(t.odds).map(([k,v])=>(RN[k]?.[0]||k)+' '+v+' %').join(' · ')+'. Garantie : une Rare ou mieux après '+t.pity_threshold+' cartes sans.').join('<br>')})}
async function open5(slug){if(busy)return;busy=true;document.querySelectorAll('[data-b]').forEach(b=>b.disabled=true);const pk=$('pk');
pk.innerHTML='<div class="booster-opening"><div class="sealed"><div class="logo">GAYCHA<small>CLUB</small></div></div></div>';
const {data,error}=await sb.rpc('open_booster',{p_booster:slug,p_key:crypto.randomUUID()});
busy=false;document.querySelectorAll('[data-b]').forEach(b=>b.disabled=false);
if(error){pk.innerHTML=msg('Ouverture impossible : '+error.message,1);return}
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
pk.innerHTML=data.map(d=>{const c=cards.find(x=>x.id===d.card_id);return `<div class="fl ${['epique','legendaire','secrete'].includes(c?.rarity)?'hi':''}"><div class="fi"><div class="card back fb"><div class="logo">G</div></div><div class="ff">${c?card(c):msg('Carte inconnue')}</div></div></div>`}).join('');
[...pk.children].forEach((e,i)=>setTimeout(()=>e.classList.add('on'),rm?0:500+i*750));refresh()}
async function missions(){if(profile&&!profile.age_confirmed_at)return ageGate();
const {data,error}=await sb.rpc('my_missions');if(error)return app.innerHTML=msg(error.message,1);
const st=m=>m.claimed?['✔ Déjà réclamée',0]:m.progress>=m.goal?['Disponible : à réclamer !',1]:['Pas encore réclamable ('+m.progress+' / '+m.goal+')',0];
app.innerHTML=`<h1>Missions</h1><div id="mm"></div>${data.map(m=>{const [t,ok]=st(m);return `<div class="box" style="margin:12px 0;max-width:none"><b>${esc(m.title)}</b> · ${m.kind==='daily'?'quotidienne':'hebdomadaire'}<br>Récompense : ${m.reward} 💰 + ${m.xp_reward} XP<br><b>${t}</b><br><button class="btn" data-m="${esc(m.slug)}" ${ok?'':'disabled'}>${m.claimed?'Réclamée':'Réclamer'}</button></div>`}).join('')}`;
app.querySelectorAll('[data-m]').forEach(b=>b.onclick=async()=>{b.disabled=true;const {error:e}=await sb.rpc('claim_mission',{p_slug:b.dataset.m});if(e){$('mm').innerHTML=msg(e.message,1);b.disabled=false;return}await refresh();missions()})}
async function market(){const {data,error}=await sb.from('market_view').select('*').order('created_at',{ascending:false});
if(error)return app.innerHTML=msg(error.message,1);
app.innerHTML=`<h1>Marché</h1><p>Prix en monnaie virtuelle uniquement, non convertible en argent réel. Une commission est prélevée sur chaque vente.</p><div id="mk"></div>${data.length?'':msg('Aucune annonce. Mettez une carte en vente depuis votre collection.')}<div class="grid">${data.map(l=>{const own=l.seller_id===user.id;return `<div>${card({id:l.card_id,name:l.name,rarity:l.rarity,number:l.number,spec:l.spec,series:{name:l.series_name,color_a:l.color_a,color_b:l.color_b}})}<div style="margin:6px 0">${l.price} 💰 · ${esc(l.seller)}</div><button class="btn${own?' alt':''}" style="width:100%" data-l="${l.id}" data-own="${own?1:0}" data-p="${l.price}">${own?'Retirer':'Acheter'}</button></div>`}).join('')}</div>`;
app.querySelectorAll('[data-l]').forEach(b=>b.onclick=async()=>{const own=b.dataset.own==='1';if(!own&&!confirm('Acheter cette carte pour '+b.dataset.p+' 💰 ?'))return;b.disabled=true;const {error:e}=own?await sb.rpc('cancel_listing',{p_listing:b.dataset.l}):await sb.rpc('buy_listing',{p_listing:b.dataset.l,p_key:crypto.randomUUID()});await refresh();if(e){b.disabled=false;$('mk').innerHTML=msg(e.message,1)}else market()})}
async function leaderboard(){const {data,error}=await sb.from('leaderboard').select('*');
if(error)return app.innerHTML=msg(error.message,1);
app.innerHTML=`<h1>Classement</h1><div class="box" style="max-width:none">${data.map((r,i)=>`<div>${i+1}. <b>${esc(r.username)}</b> · ${r.xp} XP · ${r.cards_found} cartes</div>`).join('')}</div>`}
async function trades(){if(profile&&!profile.age_confirmed_at)return ageGate();await sb.rpc('expire_offers');
const [a,b,d]=await Promise.all([sb.from('trades_view').select('*').order('created_at',{ascending:false}),sb.from('trade_items_view').select('*'),sb.from('card_instances').select('id,card_id').eq('locked',false)]);
if(a.error)return app.innerHTML=msg(a.error.message,1);
const T=a.data||[],I=b.data||[],by={};(d.data||[]).forEach(m=>{(by[m.card_id]=by[m.card_id]||[]).push(m.id)});
const opt=(v,c)=>`<option value="${v}">${esc(c.name)} · ${RN[c.rarity][0]}</option>`;
const its=(id,s)=>I.filter(i=>i.offer_id===id&&i.side===s).map(i=>esc(i.name)).join(', ')||'Aucune carte';
const SL={pending:'En attente',accepted:'Acceptée',declined:'Refusée',cancelled:'Annulée',expired:'Expirée'};
const countSelected=id=>$(id)?[...$(id).selectedOptions].length:0;
app.innerHTML=`<div class="hero"><p class="section-kicker">Échanges entre collectionneurs</p><h1>À toi, à moi.</h1><p class="lead">Compose une offre claire, compare les deux côtés et confirme uniquement quand tout te convient.</p></div><div class="trade-layout"><section class="trade-panel"><p class="section-kicker">Nouvelle proposition</p><h2>Composer un échange</h2><div class="trade-field"><label for="tu">Pseudo du destinataire</label><input id="tu" placeholder="Ex. : DivaDu66" autocomplete="off"></div><div class="trade-field"><label for="tg">Tes cartes à proposer</label><select id="tg" multiple size="6" aria-describedby="give-help">${cards.filter(x=>by[x.id]).map(x=>opt(by[x.id][0],x)).join('')}</select><span id="give-help" class="small-muted">Sélection multiple : Ctrl (Windows) ou Cmd (Mac).</span></div><div class="trade-field"><label for="tw">Cartes que tu souhaites recevoir</label><select id="tw" multiple size="6">${cards.map(x=>opt(x.id,x)).join('')}</select><span class="small-muted">Choisis les cartes que tu recherches.</span></div><div class="trade-layout" style="grid-template-columns:1fr 1fr;gap:12px"><div class="trade-field"><label for="t1">Monnaie offerte 💰</label><input id="t1" type="number" min="0" max="1000000" value="0"></div><div class="trade-field"><label for="t2">Monnaie demandée 💰</label><input id="t2" type="number" min="0" max="1000000" value="0"></div></div><div class="trade-summary" id="trade-summary">0 carte(s) offertes · 0 carte(s) demandées</div><button class="btn" id="tp" style="width:100%">Envoyer la proposition</button><div id="tm" aria-live="polite"></div></section><aside><div class="trade-panel"><p class="section-kicker">Bon à savoir</p><h2>Un échange net</h2><p>Vérifie les deux listes avant d’envoyer ton offre. Une proposition en attente peut être refusée ou annulée ; un échange accepté est définitif.</p><div class="trade-summary">Tes cartes sont sélectionnées parmi tes exemplaires disponibles. Les vérifications finales sont faites côté serveur.</div></div><div class="panel-heading"><h2>Mes offres</h2><span class="small-muted">${T.length} au total</span></div><p class="small-muted">Les offres reçues et envoyées restent accessibles ici, avec leur état et leur date d’expiration.</p></aside></div><div class="panel-heading"><h2>Historique des échanges</h2><span class="small-muted">Récentes en premier</span></div>${T.length?'':msg('Aucun échange pour le moment.')}<div>${T.map(t=>{const mine=t.proposer_id===user.id;return `<article class="offer-row"><div class="offer-top"><b>${mine?'Vous → '+esc(t.recipient):esc(t.proposer)+' → vous'}</b><span class="status-pill">${SL[t.status]||esc(t.status)}</span></div><div class="offer-columns"><div class="offer-side"><b>${mine?'Vous donnez':'Ça donne'}</b>${its(t.id,'give')}${t.offer_coins?' + '+t.offer_coins+' 💰':''}</div><div class="offer-side"><b>${mine?'Vous recevez':'Ça demande'}</b>${its(t.id,'get')}${t.request_coins?' + '+t.request_coins+' 💰':''}</div></div><small class="small-muted">Expire le ${new Date(t.expires_at).toLocaleString('fr-FR')}</small>${t.status==='pending'?'<div class="offer-actions">'+(mine?`<button class="btn alt" data-x="cancel" data-t="${t.id}">Annuler l’offre</button>`:`<button class="btn" data-x="accept" data-t="${t.id}">Accepter l’échange</button> <button class="btn alt" data-x="decline" data-t="${t.id}">Refuser</button>`)+'</div>':''}</article>`}).join('')}</div>`;
const updateSummary=()=>{const give=countSelected('tg'),get=countSelected('tw');$('trade-summary').textContent=give+' carte(s) offertes · '+get+' carte(s) demandées';};
$('tg').onchange=updateSummary;$('tw').onchange=updateSummary;
$('tp').onclick=async()=>{const btn=$('tp');btn.disabled=true;const sel=id=>[...$(id).selectedOptions].map(o=>o.value);const recipient=$('tu').value.trim();
if(!recipient){$('tm').innerHTML=msg('Indique le pseudo du destinataire.',1);btn.disabled=false;return}
if(!sel('tg').length&&!sel('tw').length&&!(+$('t1').value)&&!(+$('t2').value)){$('tm').innerHTML=msg('Ajoute au moins une carte ou de la monnaie à la proposition.',1);btn.disabled=false;return}
const {error}=await sb.rpc('propose_trade',{p_recipient:recipient,p_give:sel('tg'),p_get:sel('tw'),p_offer_coins:+$('t1').value||0,p_request_coins:+$('t2').value||0});
if(error){$('tm').innerHTML=msg(error.message,1);btn.disabled=false}else trades()};
app.querySelectorAll('[data-x]').forEach(bt=>bt.onclick=async()=>{const k=bt.dataset.x,id=bt.dataset.t;if(k==='accept'&&!confirm('Confirmer cet échange ? Le transfert sera définitif.'))return;bt.disabled=true;
const {error}=k==='accept'?await sb.rpc('accept_trade',{p_offer:id,p_key:crypto.randomUUID()}):await sb.rpc('close_trade',{p_offer:id,p_as:k});
if(error){bt.disabled=false;const target=$('tm');if(target)target.innerHTML=msg(error.message,1)}else trades()})}
async function messages(openId){if(profile&&!profile.age_confirmed_at)return ageGate();
const [a,b]=await Promise.all([sb.from('conversations_view').select('*').order('last_at',{ascending:false,nullsFirst:false}),sb.from('blocked_view').select('*')]);
if(a.error)return app.innerHTML=msg(a.error.message,1);
const cv=a.data||[],bl=b.data||[];let active=cv.find(x=>x.id===openId);if(!active&&openId)active=null;
let ms=[];if(active){const {data}=await sb.from('messages').select('id,sender_id,body,created_at').eq('conversation_id',openId).order('created_at');ms=data||[];await sb.rpc('mark_read',{p_conversation:openId})}
const ask=active&&active.status==='pending'&&active.requested_by!==user.id;
const chat=active?`<section class="chat-panel"><div class="chat-header"><div><p class="section-kicker" style="margin:0">Conversation</p><b>${esc(active.other)}</b><div class="small-muted">${active.status==='pending'?(ask?'Demande de contact reçue':'Demande en attente'):'Discussion privée'}</div></div><button class="btn alt" data-blk="${esc(active.other)}">Bloquer</button></div>${ask?`<div class="note" style="margin:12px">Cette personne souhaite vous écrire. <button class="btn" data-rsp="1" data-cv="${active.id}">Accepter</button> <button class="btn alt" data-rsp="0" data-cv="${active.id}">Refuser</button></div>`:''}${active.status==='pending'&&!ask?'<div class="note" style="margin:12px">Ton message est envoyé. La conversation s’activera quand la demande sera acceptée.</div>':''}<div class="chat-stream" id="chat-stream">${ms.length?ms.map(m=>`<div class="chat-bubble ${m.sender_id===user.id?'mine':''}"><p>${esc(m.body)}</p><small>${new Date(m.created_at).toLocaleString('fr-FR')}${m.sender_id!==user.id?` · <a href="#" data-rep="${m.id}" style="color:#e4c38b">Signaler</a>`:''}</small></div>`).join(''):'<div class="chat-empty">Pas encore de message. À toi de lancer la conversation.</div>'}</div><form class="chat-compose" id="message-form"><input id="mb" maxlength="1000" placeholder="Écrire un message…" aria-label="Écrire un message" ${active.status==='pending'&&!ask?'disabled':''}><button class="btn" id="ms" data-to="${esc(active.other)}" ${active.status==='pending'&&!ask?'disabled':''}>Envoyer</button></form></section>`:'<section class="chat-panel"><div class="chat-empty"><p class="section-kicker">Ta messagerie</p><h2>Choisis une conversation</h2><p>Ou démarre une discussion avec un collectionneur à droite.</p></div></section>';
app.innerHTML=`<div class="hero"><p class="section-kicker">Communauté Gaycha</p><h1>On se parle ?</h1><p class="lead">Tes conversations au même endroit. Les demandes de contact restent sous ton contrôle.</p></div><div class="messenger-layout"><aside class="conversation-list"><h2>Conversations <span class="small-muted">(${cv.length})</span></h2>${cv.length?cv.map(c=>`<button class="conversation-item ${c.id===openId?'active':''}" data-c="${c.id}"><strong>${c.unread?'<span class="unread-dot"></span>':''}${esc(c.other)}</strong><small>${c.status==='pending'?(c.requested_by===user.id?'Demande envoyée':'Nouvelle demande'):'Ouvrir la conversation'} · ${c.last_at?new Date(c.last_at).toLocaleDateString('fr-FR'):''}</small></button>`).join(''):'<p class="chat-empty">Pas encore de conversation.</p>'}</aside><div><div id="mq" aria-live="polite"></div>${chat}<form class="message-new" id="new-message-form"><span class="section-kicker" style="margin:0">Nouveau message</span><input id="nu" placeholder="Pseudo du collectionneur" autocomplete="off" aria-label="Pseudo du destinataire"><input id="nb" maxlength="1000" placeholder="Ton premier message…" aria-label="Premier message"><button class="btn" id="ns">Envoyer</button></form></div></div>${bl.length?`<div class="panel-heading"><h2>Utilisateurs bloqués</h2></div>${bl.map(x=>`<div class="offer-row"><b>${esc(x.username)}</b> <button class="btn alt" data-unb="${x.blocked_id}">Débloquer</button></div>`).join('')}`:''}`;
const fail=e=>{const q=$('mq');if(q)q.innerHTML=msg(e.message,1)};
$('new-message-form').onsubmit=async ev=>{ev.preventDefault();const btn=$('ns');if(!$('nu').value.trim()||!$('nb').value.trim()){fail({message:'Indique un pseudo et écris un premier message.'});return}btn.disabled=true;const {error}=await sb.rpc('send_message',{p_recipient:$('nu').value.trim(),p_body:$('nb').value.trim()});if(error){fail(error);btn.disabled=false}else messages()};
if($('message-form'))$('message-form').onsubmit=async ev=>{ev.preventDefault();const body=$('mb').value.trim();if(!body)return;const btn=$('ms');btn.disabled=true;const {error}=await sb.rpc('send_message',{p_recipient:btn.dataset.to,p_body:body});if(error){fail(error);btn.disabled=false}else messages(openId)};
app.querySelectorAll('[data-c]').forEach(l=>l.onclick=()=>messages(l.dataset.c));
app.querySelectorAll('[data-rsp]').forEach(x=>x.onclick=async()=>{const {error}=await sb.rpc('respond_request',{p_conversation:x.dataset.cv,p_accept:x.dataset.rsp==='1'});error?fail(error):messages(openId)});
app.querySelectorAll('[data-blk]').forEach(x=>x.onclick=async()=>{if(!confirm('Bloquer '+x.dataset.blk+' ? Cette personne ne pourra plus vous écrire ni vous proposer d’échange.'))return;const {error}=await sb.rpc('block_user',{p_username:x.dataset.blk});error?fail(error):messages()});
app.querySelectorAll('[data-unb]').forEach(x=>x.onclick=async()=>{const {error}=await sb.rpc('unblock_user',{p_blocked:x.dataset.unb});error?fail(error):messages(openId)});
app.querySelectorAll('[data-rep]').forEach(x=>x.onclick=async ev=>{ev.preventDefault();const r=prompt('Pourquoi signalez-vous ce message ? (3 à 500 caractères)');if(!r)return;const {error}=await sb.rpc('report_message',{p_message:x.dataset.rep,p_reason:r});$('mq').innerHTML=error?msg(error.message,1):msg('Signalement envoyé à la modération.')})}
/* ===== Vue en grand ===== */
const zoom=document.createElement('dialog');zoom.setAttribute('aria-label','Carte en grand');document.body.appendChild(zoom);
function openZoom(id){const c=cards.find(x=>x.id===id);if(!c)return;const r=RN[c.rarity];
zoom.innerHTML=`<button class="btn alt zx" id="zc">Fermer</button><div class="zw"><div class="zc" id="zt">${card(c)}<div class="glare"></div></div><div class="zi"><h2>${esc(c.name)}</h2><p><b>${esc(c.series?.name)}</b> · ${r[1]} ${r[0]} · N° ${String(c.number).padStart(3,'0')}</p>${c.spec?`<p><b>Spécialité :</b> ${esc(c.spec)}</p>`:''}${c.anecdote?`<p><b>Anecdote :</b> ${esc(c.anecdote)}</p>`:''}${c.bio?`<p>${esc(c.bio)}</p>`:''}<p class="note">Personnage fictif ou commentaire satirique : ce n’est pas une déclaration réelle.</p></div></div>`;
zoom.showModal();const t=$('zt');
if(!matchMedia('(prefers-reduced-motion:reduce)').matches){t.onpointermove=e=>{const b=t.getBoundingClientRect(),x=(e.clientX-b.left)/b.width,y=(e.clientY-b.top)/b.height;t.style.transform=`perspective(800px) rotateY(${(x-.5)*16}deg) rotateX(${(.5-y)*16}deg)`;t.style.setProperty('--mx',x*100+'%');t.style.setProperty('--my',y*100+'%')};t.onpointerleave=()=>{t.style.transform=''}}
$('zc').onclick=()=>zoom.close()}
zoom.addEventListener('click',e=>{if(e.target===zoom)zoom.close()});
document.addEventListener('click',e=>{const c=e.target.closest('.card[data-cid]');if(c&&!c.closest('dialog'))openZoom(c.dataset.cid)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const c=document.activeElement;if(c&&c.matches&&c.matches('.card[data-cid]')&&!c.closest('dialog'))openZoom(c.dataset.cid)}});

/* ===== Administration (les droits sont vérifiés par le serveur) ===== */
async function admin(tab){const R=profile?.role;if(!['admin','moderator','catalog_manager'].includes(R))return app.innerHTML=msg('Accès réservé au staff.',1);
tab=tab||'stats';const T={stats:'Stats',reports:'Signalements',users:'Comptes',cards:'Cartes',boosters:'Boosters',audit:'Audit'};
const ok={stats:1,reports:R!=='catalog_manager',users:R!=='catalog_manager',cards:R!=='moderator',boosters:R==='admin',audit:R==='admin'};
const bar=`<div class="tabs">${Object.keys(T).filter(k=>ok[k]).map(k=>`<button class="btn${k===tab?'':' alt'}" data-t="${k}">${T[k]}</button>`).join('')}</div><div id="am"></div>`;
const fail=e=>msg(e.message,1);let body='';
if(tab==='stats'){const {data,error}=await sb.rpc('admin_stats');body=error?fail(error):`<div class="box" style="max-width:none">${Object.entries(data).map(([k,v])=>`<div>${esc(k.replace(/_/g,' '))} : <b>${esc(v)}</b></div>`).join('')}</div>`}
if(tab==='reports'){const {data,error}=await sb.rpc('admin_reports');body=error?fail(error):(data.length?'':msg('Aucun signalement.'))+data.map(r=>`<div class="box" style="max-width:none;margin:10px 0"><b>${esc(r.reported)}</b> signalé par ${esc(r.reporter)} · ${esc(r.status)}<br><i>« ${esc(r.body)} »</i><br>Motif : ${esc(r.reason)}<br>${r.status==='open'?`<button class="btn" data-rs="reviewed" data-r="${r.id}">Traité</button> <button class="btn alt" data-rs="dismissed" data-r="${r.id}">Rejeter</button> <button class="btn alt" data-su="${esc(r.reported)}">Suspendre l’auteur</button>`:''}</div>`).join('')}
if(tab==='users'){body=`<div class="box" style="max-width:none"><b>Suspendre / rétablir un compte</b><input id="au" placeholder="Pseudo"><input id="ar" placeholder="Motif (obligatoire)"><button class="btn" id="asu">Suspendre</button> <button class="btn alt" id="arl">Rétablir</button></div>${R==='admin'?`<div class="box" style="max-width:none"><b>Récompense administrative (1 à 1000 💰)</b><input id="gu" placeholder="Pseudo"><input id="ga" type="number" min="1" max="1000" placeholder="Montant"><input id="gr" placeholder="Motif (5 caractères min.)"><button class="btn" id="gb">Créditer</button></div>`:''}`}
let list=[];
if(tab==='cards'){const [s,c]=await Promise.all([sb.from('series').select('id,name').order('name'),sb.from('cards').select('id,series_id,number,name,rarity,spec,anecdote,bio,status,is_fictional,rights_checked').order('name')]);list=c.data||[];
const so=(s.data||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join(''),ro=Object.entries(RN).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join(''),st=['brouillon','revision','publie','archive'].map(x=>`<option>${x}</option>`).join('');
body=`<div class="box" style="max-width:none"><b id="cft">Nouvelle carte</b><input type="hidden" id="cid"><select id="cs">${so}</select><input id="cn" type="number" placeholder="Numéro dans la série"><input id="cname" placeholder="Nom"><select id="cr">${ro}</select><input id="csp" placeholder="Spécialité humoristique"><input id="can" placeholder="Anecdote"><textarea id="cb" placeholder="Bio satirique"></textarea><select id="cst">${st}</select><label><input type="checkbox" id="cf" checked style="width:auto"> Personnage fictif</label><br><label><input type="checkbox" id="crc" style="width:auto"> Droits vérifiés (obligatoire pour publier une personne réelle)</label><br><button class="btn" id="csv">Enregistrer</button> <button class="btn alt" id="cnew">Nouvelle</button></div><table><tr><th>Nom</th><th>Rareté</th><th>Statut</th><th></th></tr>${list.map(c=>`<tr><td>${esc(c.name)}</td><td>${RN[c.rarity][0]}</td><td>${esc(c.status)}</td><td><button class="btn alt" style="min-height:34px;padding:4px 10px" data-ed="${c.id}">Modifier</button></td></tr>`).join('')}</table>`}
let bs=[];
if(tab==='boosters'){const {data,error}=await sb.from('booster_types').select('*').order('price');bs=data||[];body=error?fail(error):bs.map(b=>`<div class="box" style="max-width:none;margin:12px 0"><b>${esc(b.name)}</b> (${esc(b.slug)})<br>${Object.keys(RN).map(k=>`<label>${RN[k][0]} %<input class="o-${b.slug}" data-k="${k}" type="number" step="0.1" min="0" value="${b.odds[k]??0}"></label>`).join('')}<label>Prix 💰<input id="p-${b.slug}" type="number" min="0" value="${b.price}"></label><label>Garantie : Rare+ après N cartes<input id="g-${b.slug}" type="number" min="1" value="${b.pity_threshold}"></label><label>Délai (heures)<input id="d-${b.slug}" type="number" min="0" value="${b.cooldown_hours}"></label><label><input type="checkbox" id="a-${b.slug}" ${b.active?'checked':''} style="width:auto"> Actif</label><br><button class="btn" data-sb="${b.slug}">Enregistrer</button></div>`).join('')}
if(tab==='audit'){const {data,error}=await sb.from('audit_log').select('*').order('id',{ascending:false}).limit(100);body=error?fail(error):`<table><tr><th>Date</th><th>Action</th><th>Détails</th></tr>${(data||[]).map(a=>`<tr><td>${new Date(a.created_at).toLocaleString('fr-FR')}</td><td>${esc(a.action)}</td><td><small>${esc(JSON.stringify(a.details))}</small></td></tr>`).join('')}</table>`}
app.innerHTML=`<h1>Administration</h1>${bar}${body}`;
const say=(e,t)=>{$('am').innerHTML=e?msg(e.message,1):msg(t)};
app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>admin(b.dataset.t));
app.querySelectorAll('[data-rs]').forEach(b=>b.onclick=async()=>{const {error}=await sb.rpc('admin_resolve_report',{p_report:b.dataset.r,p_status:b.dataset.rs});error?say(error):admin('reports')});
app.querySelectorAll('[data-su]').forEach(b=>b.onclick=async()=>{const r=prompt('Motif de la suspension de '+b.dataset.su+' ?');if(!r)return;const {error}=await sb.rpc('admin_set_suspension',{p_username:b.dataset.su,p_suspend:true,p_reason:r});say(error,'Compte suspendu.')});
const susp=v=>async()=>{const {error}=await sb.rpc('admin_set_suspension',{p_username:$('au').value.trim(),p_suspend:v,p_reason:$('ar').value});say(error,v?'Compte suspendu.':'Compte rétabli.')};
if($('asu')){$('asu').onclick=susp(true);$('arl').onclick=susp(false)}
if($('gb'))$('gb').onclick=async()=>{const {error}=await sb.rpc('admin_grant_coins',{p_username:$('gu').value.trim(),p_amount:+$('ga').value,p_reason:$('gr').value});say(error,'Monnaie créditée.')};
if($('csv')){$('csv').onclick=async()=>{const d={series_id:$('cs').value,number:+$('cn').value,name:$('cname').value,rarity:$('cr').value,spec:$('csp').value,anecdote:$('can').value,bio:$('cb').value,status:$('cst').value,is_fictional:$('cf').checked,rights_checked:$('crc').checked};
const {error}=await sb.rpc('admin_upsert_card',{p_id:$('cid').value||null,p_data:d});if(error)say(error);else{cards=[];await loadCards();admin('cards')}};
$('cnew').onclick=()=>admin('cards');
app.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{const c=list.find(x=>x.id===b.dataset.ed);$('cft').textContent='Modifier : '+c.name;$('cid').value=c.id;$('cs').value=c.series_id;$('cn').value=c.number;$('cname').value=c.name;$('cr').value=c.rarity;$('csp').value=c.spec||'';$('can').value=c.anecdote||'';$('cb').value=c.bio||'';$('cst').value=c.status;$('cf').checked=c.is_fictional;$('crc').checked=c.rights_checked;scrollTo(0,0)})}
app.querySelectorAll('[data-sb]').forEach(b=>b.onclick=async()=>{const s=b.dataset.sb,o={};document.querySelectorAll('.o-'+s).forEach(i=>o[i.dataset.k]=+i.value);
const {error}=await sb.rpc('admin_set_booster',{p_slug:s,p_odds:o,p_price:+$('p-'+s).value,p_pity:+$('g-'+s).value,p_cooldown:+$('d-'+s).value,p_active:$('a-'+s).checked});say(error,'Booster mis à jour.')})}
go('catalog');
</script></body></html>
