<style>
:root{color-scheme:dark;--bg:#101010;--ch:#1D1D20;--gold:#D6B46A;--cream:#F4EBDD;--mut:#a9a39a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.5 Fraunces,Georgia,serif}
h1,h2,.logo{font-family:Anton,Impact,sans-serif;font-weight:400;margin:0}
button{font:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:var(--ch);border-bottom:1px solid #3a3326}
.logo{font-size:26px;color:var(--gold);line-height:1}.logo small{font:600 10px Fraunces;letter-spacing:.5em;display:block;color:var(--cream)}
header nav{display:flex;gap:6px}header .me{margin-left:auto;color:var(--mut);font-size:14px}
main{max-width:1100px;margin:0 auto;padding:30px 20px}
.btn{background:var(--gold);color:#101010;border:0;border-radius:6px;padding:12px 20px;font-weight:600;min-height:46px}
.btn.alt{background:none;color:var(--cream);border:1px solid var(--gold)}.btn:disabled{opacity:.5;cursor:default}
input{background:var(--ch);color:var(--cream);border:1px solid #4a4233;border-radius:6px;padding:10px 12px;min-height:44px;font:inherit;width:100%;margin:6px 0}
.box{max-width:420px;background:var(--ch);border-radius:12px;padding:22px;margin:20px auto}
.note{background:var(--ch);border-left:4px solid #FF477E;padding:12px 16px;border-radius:0 8px 8px 0;color:var(--mut);margin:14px 0}
.err{border-color:#ff5555;color:#ffb4b4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;margin-top:18px}
.card{--s1:#FF477E;--s2:#c4204f;--r:#8a95a3;position:relative;aspect-ratio:5/7;border-radius:12px;background:#0b0b0c;border:3px solid var(--r);padding:6px;display:flex;flex-direction:column;overflow:hidden;color:#fff;width:100%}
.band{background:linear-gradient(90deg,var(--s1),var(--s2));color:#101010;font:11px Anton;letter-spacing:.12em;padding:4px 8px;border-radius:4px;display:flex;justify-content:space-between}
.art{flex:1;margin:6px 0;border-radius:6px;background:radial-gradient(circle at 50% 35%,var(--s1) 0,transparent 55%),linear-gradient(160deg,#26262b,#0b0b0c);display:grid;place-items:center}
.art b{font:clamp(34px,7vw,60px) Anton}.nm{font:15px Anton}.spec{font-size:10px;line-height:1.25;color:#d8d2c8}
.meta{display:flex;justify-content:space-between;font-size:10px;margin-top:2px}.rar{color:var(--r);font-weight:600}
.x{position:absolute;top:30px;right:6px;background:var(--gold);color:#101010;border-radius:10px;font:600 11px Fraunces;padding:1px 8px}
.r-peu_commun{--r:#2fa57a}.r-rare{--r:#3867FF;box-shadow:0 0 14px #3867FF66}.r-epique{--r:#e03bd0;box-shadow:0 0 18px #e03bd088}
.r-legendaire{--r:#D6B46A;box-shadow:0 0 22px #D6B46A88}
.r-secrete{border-color:transparent;background:linear-gradient(#0b0b0c,#0b0b0c) padding-box,conic-gradient(#ff477e,#ffda45,#8ccf35,#00a9a5,#3867ff,#c9a7ff,#ff477e) border-box}
.fl{aspect-ratio:5/7;perspective:900px}.fi{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s}.fl.on .fi{transform:rotateY(180deg)}
.fb,.ff{position:absolute;inset:0;backface-visibility:hidden}.ff{transform:rotateY(180deg)}.ff .card{height:100%}
.back{display:grid;place-items:center;border:3px solid var(--gold);background:#0b0b0c}
.sealed{width:200px;aspect-ratio:5/8;margin:20px auto;background:linear-gradient(160deg,#2a2418,#0b0b0c);border:3px solid var(--gold);border-radius:10px;display:grid;place-content:center;text-align:center;animation:shk .5s 2}
@keyframes shk{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@media(prefers-reduced-motion:reduce){.sealed{animation:none}.fi{transition:none}}

/* === GAYCHA CLUB PREMIUM REDESIGN === */
:root{--bg:#090910;--ch:#171722;--gold:#f6c86d;--cream:#fff5f7;--mut:#b6b1c5;--pink:#ff4fa3;--blue:#6b7cff;--cyan:#54e7df;--rainbow:linear-gradient(115deg,#ff477e,#ffb84d,#f8ed66,#5ee58c,#54d9e9,#8c7bff,#ff477e)}
html{scroll-behavior:smooth}body{background:radial-gradient(ellipse at 12% -10%,#42204c 0,transparent 38%),radial-gradient(ellipse at 100% 15%,#17234a 0,transparent 34%),var(--bg);min-height:100vh}
header{position:sticky;top:0;z-index:20;background:#11111beF;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff1b;box-shadow:0 12px 40px #0004}
.logo{font-size:30px;text-shadow:0 0 22px #ff4fa355;letter-spacing:.03em}
header nav{gap:7px;flex-wrap:wrap}header nav .btn{font-size:13px;padding:9px 13px;min-height:38px;border-radius:999px;transition:transform .2s,border-color .2s}header nav .btn:hover{transform:translateY(-2px);border-color:var(--pink)}header nav .btn.active{background:var(--rainbow);border-color:transparent;color:#15121b}
main{max-width:1440px;padding:34px clamp(14px,3vw,42px) 70px}main h1{font-size:clamp(32px,4vw,52px);background:var(--rainbow);background-size:250% 100%;background-clip:text;-webkit-background-clip:text;color:transparent;animation:gaychaRainbow 9s linear infinite}main h2{font-size:clamp(23px,2.5vw,31px)}
.btn{background:var(--rainbow);background-size:220% 100%;color:#16121b;border:0;border-radius:10px;font-weight:700;box-shadow:0 5px 18px #ff4fa322;transition:transform .2s,box-shadow .2s}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px #ff4fa344}.btn.alt{background:#ffffff08;color:var(--cream);border:1px solid #ffffff2b;box-shadow:none}.btn.alt:hover{border-color:var(--pink);background:#ff4fa311}
.box{background:linear-gradient(145deg,#ffffff0d,#ffffff04);border:1px solid #ffffff17;border-radius:18px;box-shadow:0 16px 45px #0003}
.grid{grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:clamp(12px,1.7vw,24px)}.cards-grid{grid-template-columns:repeat(4,minmax(0,1fr));align-items:start}
.card{isolation:isolate;border:2px solid var(--r);border-radius:16px;padding:8px;box-shadow:0 12px 30px #0007;cursor:zoom-in;transition:transform .28s,box-shadow .28s,filter .28s}
.card:before{content:"";position:absolute;inset:-50%;z-index:3;pointer-events:none;background:linear-gradient(115deg,transparent 34%,#ffffff08 42%,#ffffff65 49%,#ffffff12 55%,transparent 64%);transform:translateX(-90%) rotate(12deg);transition:transform .8s;mix-blend-mode:screen}
.card:hover{transform:translateY(-7px) scale(1.018);box-shadow:0 18px 42px #0009,0 0 24px color-mix(in srgb,var(--r) 45%,transparent);filter:saturate(1.1)}.card:hover:before{transform:translateX(90%) rotate(12deg)}
.card .nm{font-size:clamp(15px,1.25vw,20px);line-height:1.12;margin:3px 0 4px}.card .spec{font-size:12px}.card .meta{font-size:11px}
.r-peu_commun{--r:#36e2a0}.r-rare{--r:#7187ff;box-shadow:0 0 18px #3867FF66}.r-epique{--r:#ff52dc;box-shadow:0 0 24px #e03bd088;animation:epicGlow 3.5s ease-in-out infinite}.r-legendaire{--r:#ffd56e;box-shadow:0 0 30px #D6B46A88;animation:legendGlow 3s ease-in-out infinite}.r-secrete{box-shadow:0 0 28px #ff4fa355;animation:secretGlow 2.8s ease-in-out infinite}
.hero-panel{position:relative;overflow:hidden;padding:clamp(22px,4vw,46px);margin:0 0 28px;border:1px solid #ffffff20;border-radius:24px;background:radial-gradient(circle at 90% 15%,#ff4fa333,transparent 28%),radial-gradient(circle at 10% 100%,#6b7cff30,transparent 34%),linear-gradient(135deg,#20172d,#10101b 65%);box-shadow:0 24px 70px #0004}.hero-panel h1{max-width:780px}.hero-panel p{max-width:700px;color:#d2c9dc}
.eyebrow{font:12px Anton;letter-spacing:.18em;color:var(--cyan);text-transform:uppercase}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0;padding:14px;border:1px solid #ffffff19;border-radius:16px;background:#ffffff07}.toolbar input,.toolbar select{flex:1;min-width:145px;width:auto;margin:0}.toolbar select{background:#171722;color:var(--cream);border:1px solid #ffffff2b;border-radius:9px;padding:11px;min-height:44px;font:inherit}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.stat{padding:18px;border:1px solid #ffffff1c;border-radius:15px;background:linear-gradient(145deg,#ffffff0d,#ffffff03)}.stat strong{display:block;font:30px Anton;color:var(--gold)}.progress-track{height:9px;background:#ffffff16;border-radius:99px;overflow:hidden}.progress-track span{display:block;height:100%;border-radius:99px;background:var(--rainbow);transition:width .5s}
.card-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:22px;background:#05050bdc;backdrop-filter:blur(14px)}.card-modal.open{display:flex;animation:gaychaFade .2s ease}.modal-content{display:grid;grid-template-columns:minmax(220px,340px) minmax(220px,360px);gap:26px;align-items:center;max-width:800px;width:100%;max-height:90vh;overflow:auto;padding:24px;border:1px solid #ffffff25;border-radius:24px;background:linear-gradient(145deg,#211a2c,#101019);box-shadow:0 30px 100px #0009}.modal-card .card{cursor:default;width:100%}.modal-info p{color:var(--mut)}.modal-close{position:absolute;top:18px;right:20px;border-radius:50%;width:46px;height:46px;font-size:26px}.rarity-pill{display:inline-block;padding:5px 12px;border:1px solid var(--gold);border-radius:99px;color:var(--gold);margin:8px 0}
.card .art img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.card .art.has-image{background:#15151c}.card .art.has-image b{display:none}
@keyframes gaychaRainbow{to{background-position:250% 0}}@keyframes epicGlow{50%{box-shadow:0 0 34px #e03bd0aa}}@keyframes legendGlow{50%{box-shadow:0 0 42px #ffd56ecc}}@keyframes secretGlow{50%{box-shadow:0 0 42px #ff4fa388,0 0 68px #6b7cff44}}@keyframes gaychaFade{from{opacity:0}to{opacity:1}}
@media(max-width:1000px){.cards-grid{grid-template-columns:repeat(3,minmax(0,1fr))}header{position:relative}}
@media(max-width:680px){.cards-grid,.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}header{padding:12px;gap:12px}header nav{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:5px}header nav .btn{flex:0 0 auto}.logo{font-size:25px}main{padding:22px 12px 50px}.modal-content{grid-template-columns:minmax(0,1fr);max-width:390px;padding:16px;gap:14px}.modal-card{max-width:220px;margin:auto}.hero-panel{padding:22px}.toolbar{padding:10px}.toolbar input,.toolbar select{min-width:100%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
/* Booster reveal polish */.fl{filter:drop-shadow(0 12px 24px #0007)}.fl.on .card{animation:gaychaReveal .65s cubic-bezier(.15,.9,.25,1) both}.sealed{box-shadow:0 0 35px #ffd56e33,0 0 0 8px #ffffff05;position:relative}.sealed:before{content:"";position:absolute;inset:-5px;border-radius:14px;background:var(--rainbow);z-index:-1;opacity:.7;filter:blur(10px)}@keyframes gaychaReveal{0%{transform:translateY(22px) scale(.78);opacity:0}70%{transform:translateY(-5px) scale(1.03);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}</style></head><body>
<header><div class="logo">GAYCHA<small>CLUB</small></div>
<nav><button class="btn alt" data-v="catalog">Catalogue</button><button class="btn alt" data-v="collection">Ma collection</button><button class="btn alt" data-v="booster">Boosters</button><button class="btn alt" data-v="missions">Missions</button><button class="btn alt" data-v="market">Marché</button><button class="btn alt" data-v="leaderboard">Classement</button><button class="btn alt" data-v="trades">Échanges</button><button class="btn alt" data-v="messages">Messages</button><button class="btn alt" data-v="profile">Profil</button></nav>
<div class="me" id="me"></div></header>
<main id="app" aria-live="polite"></main>
<script>
// ===== CONFIG : URL et clé PUBLIQUE uniquement. Jamais la clé service_role. =====
const SUPABASE_URL='https://tgnembausaanuazoelxw.supabase.co';
const SUPABASE_KEY='sb_publishable_xPvkIsb6dO0DVHXrf6Gs-g_wGrdewIx';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id),app=$('app');
const RN={commun:['Commun','●'],peu_commun:['Peu commun','⬢'],rare:['Rare','◆'],epique:['Épique','★'],legendaire:['Légendaire','♛'],secrete:['Secrète','◈']};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null,profile=null,cards=[],busy=false;
const msg=(t,e)=>`<div class="note ${e?'err':''}">${esc(t)}</div>`;
function card(c,n){const r=RN[c.rarity],s=c.series||{};
return `<div class="card r-${c.rarity}" style="--s1:${esc(s.color_a)};--s2:${esc(s.color_b)}"><div class="band"><span>${esc((s.name||'').toUpperCase())}</span><span>${r[1]} ${r[0].toUpperCase()}</span></div>${n>1?`<span class="x">×${n}</span>`:''}<div class="art"><b>${esc(c.name.replace(/^(Le |La |L’|Madame |Diva du )/,'').charAt(0).toUpperCase())}</b></div><div class="nm">${esc(c.name)}</div><div class="spec">${esc(c.spec)}</div><div class="meta"><span class="rar">${r[1]} ${r[0]}</span><span>N° ${String(c.number).padStart(3,'0')}</span></div></div>`}
async function loadCards(){const {data,error}=await sb.from('cards').select('id,name,rarity,number,spec,series(name,color_a,color_b)').order('number');if(error)throw error;cards=data}
async function refresh(){const {data:{session}}=await sb.auth.getSession();user=session?.user||null;profile=null;
if(user){const {data}=await sb.from('profiles').select('username,balance,age_confirmed_at').eq('id',user.id).maybeSingle();profile=data}
$('me').innerHTML=user?`${esc(profile?.username||user.email)} · ${profile?.balance??0} 💰 <button class="btn alt" id="out">Déconnexion</button>`:'';
if(user)$('out').onclick=async()=>{await sb.auth.signOut();go('catalog')}}
async function go(v){await refresh();try{if(!cards.length)await loadCards()}catch(e){app.innerHTML=msg('Impossible de charger le catalogue : '+e.message,1);return}
if(v!=='catalog'&&!user)return auth();
({catalog,collection,booster,missions,market,leaderboard,trades,messages})[v]()}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
function catalog(){app.innerHTML=`<h1>Catalogue</h1>${cards.length?'':msg('Aucune carte publiée. Vérifiez que phase2_seed.sql a été exécuté.')}<div class="grid">${cards.map(c=>card(c)).join('')}</div>`}
function auth(){app.innerHTML=`<div class="box"><h2>Connexion</h2><input id="em" type="email" placeholder="E-mail" autocomplete="email"><input id="pw" type="password" placeholder="Mot de passe (8 caractères min.)" autocomplete="current-password"><input id="un" placeholder="Pseudo (inscription : 3 à 20 lettres, chiffres, _)"><button class="btn" id="li">Se connecter</button> <button class="btn alt" id="su">Créer un compte</button><div id="am"></div></div>`;
const v=()=>[$('em').value.trim(),$('pw').value];
$('li').onclick=async()=>{const[e,p]=v();const {error}=await sb.auth.signInWithPassword({email:e,password:p});error?$('am').innerHTML=msg(error.message,1):go('collection')};
$('su').onclick=async()=>{const[e,p]=v();const {error}=await sb.auth.signUp({email:e,password:p,options:{data:{username:$('un').value.trim()}}});$('am').innerHTML=error?msg(error.message,1):msg('Compte créé. Confirmez votre adresse via l’e-mail reçu, puis connectez-vous.')}}
async function ageGate(){app.innerHTML=`<div class="box"><h2>Réservé aux 18 ans et plus</h2><p>Ce site contient de l’humour adulte. Confirmez que vous avez 18 ans ou plus. Il s’agit d’une déclaration, pas d’une vérification d’identité.</p><button class="btn" id="ok">J’ai 18 ans ou plus</button><div id="am"></div></div>`;
$('ok').onclick=async()=>{const {error}=await sb.rpc('confirm_age');error?$('am').innerHTML=msg(error.message,1):go('booster')}}
async function collection(){app.innerHTML='<h1>Ma collection</h1><p>Chargement…</p>';
const {data,error}=await sb.from('card_instances').select('card_id,acquired_at').order('acquired_at',{ascending:false});
if(error)return app.innerHTML=msg(error.message,1);
const cnt={};data.forEach(d=>cnt[d.card_id]=(cnt[d.card_id]||0)+1);
const own=cards.filter(c=>cnt[c.id]);
app.innerHTML=`<h1>Ma collection</h1><p>${own.length} / ${cards.length} cartes découvertes</p>${own.length?'':msg('Votre album est vide. Ouvrez un booster.')}<div class="grid">${own.map(c=>`<div>${card(c,cnt[c.id])}${cnt[c.id]>1?`<button class="btn alt" style="width:100%;margin-top:6px" data-conv="${c.id}" data-n="${cnt[c.id]-1}">Convertir ${cnt[c.id]-1} doublon(s)</button>`:''}<button class="btn alt" style="width:100%;margin-top:6px" data-sell="${c.id}">Vendre</button></div>`).join('')}</div><div id="cm"></div>`;
app.querySelectorAll('[data-conv]').forEach(b=>b.onclick=async()=>{b.disabled=true;const {data:g,error:e}=await sb.rpc('convert_duplicates',{p_card:b.dataset.conv,p_qty:+b.dataset.n,p_key:crypto.randomUUID()});if(e){$('cm').innerHTML=msg(e.message,1);b.disabled=false;return}await refresh();collection();$('cm').innerHTML=msg('+'+g+' 💰 ajoutés à votre solde.')});
app.querySelectorAll('[data-sell]').forEach(b=>b.onclick=async()=>{const pr=prompt('Prix de vente en 💰 (1 à 1 000 000) ?');if(!pr)return;const {data:ins}=await sb.from('card_instances').select('id').eq('card_id',b.dataset.sell).eq('locked',false).order('acquired_at',{ascending:false}).limit(1);if(!ins?.length){$('cm').innerHTML=msg('Aucun exemplaire disponible (déjà en vente ?).',1);return}const {error:e}=await sb.rpc('list_card',{p_instance:ins[0].id,p_price:parseInt(pr,10)});$('cm').innerHTML=e?msg(e.message,1):msg('Carte mise en vente. Retrouvez-la dans le Marché.')})}
function booster(){if(profile&&!profile.age_confirmed_at)return ageGate();
app.innerHTML=`<h1>Boosters</h1><p>5 cartes par booster. Le tirage est fait par le serveur.</p><button class="btn" data-b="petit-malaise">Le Petit Malaise (gratuit, 1 par jour)</button> <button class="btn alt" data-b="red-flag">Le Red Flag (100 💰)</button><div id="odds" class="note">Chargement des probabilités…</div><div id="pk" class="grid"></div>`;
app.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>open5(b.dataset.b));
sb.from('booster_types').select('name,odds,pity_threshold').eq('active',true).then(({data})=>{$('odds').innerHTML=(data||[]).map(t=>esc(t.name)+' : '+Object.entries(t.odds).map(([k,v])=>(RN[k]?.[0]||k)+' '+v+' %').join(' · ')+'. Garantie : une Rare ou mieux après '+t.pity_threshold+' cartes sans.').join('<br>')})}
async function open5(slug){if(busy)return;busy=true;document.querySelectorAll('[data-b]').forEach(b=>b.disabled=true);const pk=$('pk');
pk.innerHTML='<div class="sealed" style="grid-column:1/-1;justify-self:center"><div class="logo">GAYCHA<small>CLUB</small></div></div>';
const {data,error}=await sb.rpc('open_booster',{p_booster:slug,p_key:crypto.randomUUID()});
busy=false;document.querySelectorAll('[data-b]').forEach(b=>b.disabled=false);
if(error){pk.innerHTML=msg('Ouverture impossible : '+error.message,1);return}
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
pk.innerHTML=data.map(d=>{const c=cards.find(x=>x.id===d.card_id);return `<div class="fl"><div class="fi"><div class="card back fb"><div class="logo">G</div></div><div class="ff">${c?card(c):msg('Carte inconnue')}</div></div></div>`}).join('');
[...pk.children].forEach((e,i)=>setTimeout(()=>e.classList.add('on'),rm?0:500+i*750));refresh()}
async function missions(){if(profile&&!profile.age_confirmed_at)return ageGate();
const {data,error}=await sb.rpc('my_missions');if(error)return app.innerHTML=msg(error.message,1);
const st=m=>m.claimed?['✔ Déjà réclamée',0]:m.progress>=m.goal?['Disponible : à réclamer !',1]:['Pas encore réclamable ('+m.progress+' / '+m.goal+')',0];
app.innerHTML=`<h1>Missions</h1><div id="mm"></div>${data.map(m=>{const [t,ok]=st(m);return `<div class="box" style="margin:12px 0;max-width:none"><b>${esc(m.title)}</b> · ${m.kind==='daily'?'quotidienne':'hebdomadaire'}<br>Récompense : ${m.reward} 💰 + ${m.xp_reward} XP<br><b>${t}</b><br><button class="btn" data-m="${esc(m.slug)}" ${ok?'':'disabled'}>${m.claimed?'Réclamée':'Réclamer'}</button></div>`}).join('')}`;
app.querySelectorAll('[data-m]').forEach(b=>b.onclick=async()=>{b.disabled=true;const {error:e}=await sb.rpc('claim_mission',{p_slug:b.dataset.m});if(e){$('mm').innerHTML=msg(e.message,1);b.disabled=false;return}await refresh();missions()})}
async function market(){const {data,error}=await sb.from('market_view').select('*').order('created_at',{ascending:false});
if(error)return app.innerHTML=msg(error.message,1);
app.innerHTML=`<h1>Marché</h1><p>Prix en monnaie virtuelle uniquement, non convertible en argent réel. Une commission est prélevée sur chaque vente.</p><div id="mk"></div>${data.length?'':msg('Aucune annonce. Mettez une carte en vente depuis votre collection.')}<div class="grid">${data.map(l=>{const own=l.seller_id===user.id;return `<div>${card({id:l.card_id,name:l.name,rarity:l.rarity,number:l.number,spec:l.spec,series:{name:l.series_name,color_a:l.color_a,color_b:l.color_b}})}<div style="margin:6px 0">${l.price} 💰 · ${esc(l.seller)}</div><button class="btn${own?' alt':''}" style="width:100%" data-l="${l.id}" data-own="${own?1:0}" data-p="${l.price}">${own?'Retirer':'Acheter'}</button></div>`}).join('')}</div>`;
app.querySelectorAll('[data-l]').forEach(b=>b.onclick=async()=>{const own=b.dataset.own==='1';if(!own&&!confirm('Acheter cette carte pour '+b.dataset.p+' 💰 ?'))return;b.disabled=true;const {error:e}=own?await sb.rpc('cancel_listing',{p_listing:b.dataset.l}):await sb.rpc('buy_listing',{p_listing:b.dataset.l,p_key:crypto.randomUUID()});await refresh();if(e){b.disabled=false;$('mk').innerHTML=msg(e.message,1)}else market()})}
async function leaderboard(){const {data,error}=await sb.from('leaderboard').select('*');
if(error)return app.innerHTML=msg(error.message,1);
app.innerHTML=`<h1>Classement</h1><div class="box" style="max-width:none">${data.map((r,i)=>`<div>${i+1}. <b>${esc(r.username)}</b> · ${r.xp} XP · ${r.cards_found} cartes</div>`).join('')}</div>`}
async function trades(){if(profile&&!profile.age_confirmed_at)return ageGate();await sb.rpc('expire_offers');
const [a,b,c]=await Promise.all([sb.from('trades_view').select('*').order('created_at',{ascending:false}),sb.from('trade_items_view').select('*'),sb.from('card_instances').select('id,card_id').eq('locked',false)]);
if(a.error)return app.innerHTML=msg(a.error.message,1);
const T=a.data||[],I=b.data||[],by={};(c.data||[]).forEach(m=>{(by[m.card_id]=by[m.card_id]||[]).push(m.id)});
const opt=(v,c)=>`<option value="${v}">${esc(c.name)} (${RN[c.rarity][0]})</option>`;
const its=(id,s)=>I.filter(i=>i.offer_id===id&&i.side===s).map(i=>esc(i.name)).join(', ')||'aucune carte';
const SL={pending:'en attente',accepted:'acceptée',declined:'refusée',cancelled:'annulée',expired:'expirée'};
app.innerHTML=`<h1>Échanges</h1><div class="box" style="max-width:none"><b>Nouvelle proposition</b><input id="tu" placeholder="Pseudo du destinataire"><label>Je donne (Ctrl/Cmd pour plusieurs)</label><select id="tg" multiple size="5" style="width:100%;background:#101010;color:#F4EBDD">${cards.filter(x=>by[x.id]).map(x=>opt(by[x.id][0],x)).join('')}</select><label>Je demande</label><select id="tw" multiple size="5" style="width:100%;background:#101010;color:#F4EBDD">${cards.map(x=>opt(x.id,x)).join('')}</select><input id="t1" type="number" min="0" placeholder="💰 que je donne (0)"><input id="t2" type="number" min="0" placeholder="💰 que je demande (0)"><button class="btn" id="tp">Proposer</button><div id="tm"></div></div>
<h2 style="margin-top:24px">Historique et offres</h2>${T.length?'':msg('Aucun échange pour le moment.')}${T.map(t=>{const mine=t.proposer_id===user.id;return `<div class="box" style="max-width:none;margin:12px 0"><b>${mine?'Vous → '+esc(t.recipient):esc(t.proposer)+' → vous'}</b> · ${SL[t.status]}<br>${mine?'Vous donnez':esc(t.proposer)+' donne'} : ${its(t.id,'give')}${t.offer_coins?' + '+t.offer_coins+' 💰':''}<br>${mine?'Vous demandez':esc(t.proposer)+' demande'} : ${its(t.id,'get')}${t.request_coins?' + '+t.request_coins+' 💰':''}<br><small>Expire le ${new Date(t.expires_at).toLocaleString('fr-FR')}</small><br>${t.status==='pending'?(mine?`<button class="btn alt" data-x="cancel" data-t="${t.id}">Annuler</button>`:`<button class="btn" data-x="accept" data-t="${t.id}">Accepter</button> <button class="btn alt" data-x="decline" data-t="${t.id}">Refuser</button>`):''}</div>`}).join('')}`;
$('tp').onclick=async()=>{$('tp').disabled=true;const sel=id=>[...$(id).selectedOptions].map(o=>o.value);
const {error}=await sb.rpc('propose_trade',{p_recipient:$('tu').value.trim(),p_give:sel('tg'),p_get:sel('tw'),p_offer_coins:+$('t1').value||0,p_request_coins:+$('t2').value||0});
if(error){$('tm').innerHTML=msg(error.message,1);$('tp').disabled=false}else trades()};
app.querySelectorAll('[data-x]').forEach(bt=>bt.onclick=async()=>{const k=bt.dataset.x,id=bt.dataset.t;
if(k==='accept'&&!confirm('Confirmer cet échange ? Il sera définitif.'))return;bt.disabled=true;
const {error}=k==='accept'?await sb.rpc('accept_trade',{p_offer:id,p_key:crypto.randomUUID()}):await sb.rpc('close_trade',{p_offer:id,p_as:k});
await refresh();if(error){bt.disabled=false;$('tm').innerHTML=msg(error.message,1)}else trades()})}
async function messages(openId){if(profile&&!profile.age_confirmed_at)return ageGate();
const [a,b]=await Promise.all([sb.from('conversations_view').select('*').order('last_at',{ascending:false,nullsFirst:false}),sb.from('blocked_view').select('*')]);
if(a.error)return app.innerHTML=msg(a.error.message,1);
const cv=a.data||[],bl=b.data||[];let th='';
if(openId){const c=cv.find(x=>x.id===openId);
if(c){const {data:ms}=await sb.from('messages').select('id,sender_id,body,created_at').eq('conversation_id',openId).order('created_at');
await sb.rpc('mark_read',{p_conversation:openId});
const ask=c.status==='pending'&&c.requested_by!==user.id;
th=`<div class="box" style="max-width:none"><b>${esc(c.other)}</b> <button class="btn alt" data-blk="${esc(c.other)}">Bloquer</button>
${ask?`<div class="note">${esc(c.other)} souhaite vous écrire. <button class="btn" data-rsp="1" data-cv="${c.id}">Accepter</button> <button class="btn alt" data-rsp="0" data-cv="${c.id}">Refuser</button></div>`:''}
${c.status==='pending'&&!ask?'<div class="note">En attente de l’acceptation du destinataire.</div>':''}
<div>${(ms||[]).map(m=>`<p style="${m.sender_id===user.id?'text-align:right':''}">${esc(m.body)}<br><small>${new Date(m.created_at).toLocaleString('fr-FR')}${m.sender_id!==user.id?` · <a href="#" data-rep="${m.id}" style="color:#D6B46A">Signaler</a>`:''}</small></p>`).join('')}</div>
<input id="mb" maxlength="1000" placeholder="Votre message"><button class="btn" id="ms" data-to="${esc(c.other)}">Envoyer</button></div>`}}
app.innerHTML=`<h1>Messages</h1><div id="mq"></div>${th}<div class="box" style="max-width:none"><b>Nouveau message</b><input id="nu" placeholder="Pseudo du destinataire"><input id="nb" maxlength="1000" placeholder="Premier message (une demande de contact sera envoyée)"><button class="btn" id="ns">Envoyer</button></div>
<h2>Conversations</h2>${cv.length?'':msg('Aucune conversation.')}${cv.map(c=>`<div class="box" style="max-width:none;margin:10px 0"><a href="#" data-c="${c.id}" style="color:#D6B46A"><b>${esc(c.other)}</b></a> ${c.status==='pending'?'(demande en attente)':c.status==='declined'?'(refusée)':''}${c.unread?` · ${c.unread} non lu(s)`:''}</div>`).join('')}
${bl.length?`<h2>Utilisateurs bloqués</h2>${bl.map(x=>`<div>${esc(x.username)} <button class="btn alt" data-unb="${x.blocked_id}">Débloquer</button></div>`).join('')}`:''}`;
const fail=e=>{$('mq').innerHTML=msg(e.message,1)};
$('ns').onclick=async()=>{const {error:e}=await sb.rpc('send_message',{p_recipient:$('nu').value.trim(),p_body:$('nb').value});e?fail(e):messages()};
if($('ms'))$('ms').onclick=async()=>{const {error:e}=await sb.rpc('send_message',{p_recipient:$('ms').dataset.to,p_body:$('mb').value});e?fail(e):messages(openId)};
app.querySelectorAll('[data-c]').forEach(l=>l.onclick=ev=>{ev.preventDefault();messages(l.dataset.c)});
app.querySelectorAll('[data-rsp]').forEach(x=>x.onclick=async()=>{const {error:e}=await sb.rpc('respond_request',{p_conversation:x.dataset.cv,p_accept:x.dataset.rsp==='1'});e?fail(e):messages(openId)});
app.querySelectorAll('[data-blk]').forEach(x=>x.onclick=async()=>{if(!confirm('Bloquer '+x.dataset.blk+' ? Cette personne ne pourra plus vous écrire ni vous proposer d’échange.'))return;const {error:e}=await sb.rpc('block_user',{p_username:x.dataset.blk});e?fail(e):messages()});
app.querySelectorAll('[data-unb]').forEach(x=>x.onclick=async()=>{const {error:e}=await sb.rpc('unblock_user',{p_blocked:x.dataset.unb});e?fail(e):messages(openId)});
app.querySelectorAll('[data-rep]').forEach(x=>x.onclick=async ev=>{ev.preventDefault();const r=prompt('Pourquoi signalez-vous ce message ? (3 à 500 caractères)');if(!r)return;const {error:e}=await sb.rpc('report_message',{p_message:x.dataset.rep,p_reason:r});$('mq').innerHTML=e?msg(e.message,1):msg('Signalement envoyé à la modération.')})}

/* === GAYCHA CLUB: catalogue enrichi, album et profil === */
const CARD_ART = {}; // Ajouter ici les illustrations : CARD_ART["ID_DE_CARTE"] = "https://.../image.webp"
function card(c,n){const r=RN[c.rarity]||RN.commun,s=c.series||{},title=String(c.name||'Carte'),img=c.image_url||CARD_ART[c.id]||CARD_ART[title]||'';return `<div class="card r-${c.rarity||'commun'}" data-card-id="${esc(c.id||'')}" data-card-name="${esc(title)}" style="--s1:${esc(s.color_a||'#ff477e')};--s2:${esc(s.color_b||'#6b7cff')}"><div class="band"><span>${esc((s.name||'GAYCHA CLUB').toUpperCase())}</span><span>${r[1]} ${r[0].toUpperCase()}</span></div>${n>1?`<span class="x">×${n}</span>`:''}<div class="art ${img?'has-image':''}">${img?`<img src="${esc(img)}" alt="Illustration de ${esc(title)}" loading="lazy" onerror="this.remove();this.parentElement.classList.remove('has-image')">`:''}<b>${esc(title.replace(/^(Le |La |L’|Madame |Diva du )/,'').charAt(0).toUpperCase())}</b></div><div class="nm">${esc(title)}</div><div class="spec">${esc(c.spec||'Carte de collection')}</div><div class="meta"><span class="rar">${r[1]} ${r[0]}</span><span>N° ${String(c.number??'—').padStart(3,'0')}</span></div></div>`}
async function go(v){await refresh();try{if(!cards.length)await loadCards()}catch(e){app.innerHTML=msg('Impossible de charger le catalogue : '+e.message,1);return}document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===v));if(v!=='catalog'&&!user)return auth();({catalog,collection,booster,missions,market,leaderboard,trades,messages,profile:profilePage})[v]()}
function attachCardModal(){app.querySelectorAll('.cards-grid .card').forEach(el=>{if(el.dataset.modalReady)return;el.dataset.modalReady='1';el.addEventListener('click',ev=>{if(ev.target.closest('button,a,select,input'))return;const c=cards.find(x=>x.id===el.dataset.cardId)||cards.find(x=>x.name===el.dataset.cardName);if(c)showCardModal(c)})})}
function showCardModal(c){let modal=document.getElementById('cardModal');if(!modal){modal=document.createElement('div');modal.id='cardModal';modal.className='card-modal';modal.innerHTML='<button class="btn alt modal-close" aria-label="Fermer">×</button><div class="modal-content"><div class="modal-card"></div><div class="modal-info"></div></div>';document.body.appendChild(modal);modal.addEventListener('click',e=>{if(e.target===modal||e.target.closest('.modal-close'))modal.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')})}const r=RN[c.rarity]||RN.commun,s=c.series||{};modal.querySelector('.modal-card').innerHTML=card(c);modal.querySelector('.modal-info').innerHTML='<div class="eyebrow">Carte de collection · N° '+String(c.number??'—').padStart(3,'0')+'</div><h2>'+esc(c.name)+'</h2><span class="rarity-pill">'+r[1]+' '+r[0]+'</span><p>'+esc(c.spec||'Une carte de la collection GAYCHA CLUB.')+'</p><p><b>Série :</b> '+esc(s.name||'GAYCHA CLUB')+'</p><p class="eyebrow">Collectionne-les toutes</p><p>Chaque carte peut recevoir sa propre illustration. Clique en dehors de la carte ou sur × pour fermer.</p>';modal.classList.add('open')}
function cardTools(){return '<div class="toolbar"><input id="cardSearch" type="search" placeholder="Rechercher une carte…"><select id="rarityFilter" aria-label="Filtrer par rareté"><option value="">Toutes les raretés</option>'+Object.entries(RN).map(([k,v])=>'<option value="'+k+'">'+v[0]+'</option>').join('')+'</select><select id="seriesFilter" aria-label="Filtrer par série"><option value="">Toutes les séries</option>'+[...new Set(cards.map(c=>c.series?.name).filter(Boolean))].sort().map(s=>'<option value="'+esc(s)+'">'+esc(s)+'</option>').join('')+'</select><select id="sortCards" aria-label="Trier les cartes"><option value="number">Trier : numéro</option><option value="name">Nom A → Z</option><option value="rarity">Rareté</option></select><select id="ownedFilter" aria-label="Filtrer les cartes"><option value="all">Toutes les cartes</option><option value="owned">Possédées</option><option value="missing">Manquantes</option></select><button class="btn alt" id="resetFilters" type="button">Réinitialiser</button></div><p id="filterCount" class="eyebrow" aria-live="polite"></p>'}
function bindCardFilters(mode,counts={}){const grid=app.querySelector('.cards-grid');if(!grid)return;const apply=()=>{const q=($('cardSearch').value||'').trim().toLocaleLowerCase('fr'),rarity=$('rarityFilter').value,series=$('seriesFilter').value,sort=$('sortCards').value,owned=$('ownedFilter').value;let list=cards.filter(c=>(!q||c.name.toLocaleLowerCase('fr').includes(q)||String(c.spec||'').toLocaleLowerCase('fr').includes(q))&&(!rarity||c.rarity===rarity)&&(!series||c.series?.name===series)&&(owned==='all'||(owned==='owned'?!!counts[c.id]:!counts[c.id])));if(sort==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'fr'));else if(sort==='rarity')list.sort((a,b)=>Object.keys(RN).indexOf(b.rarity)-Object.keys(RN).indexOf(a.rarity));else list.sort((a,b)=>(a.number||0)-(b.number||0));grid.innerHTML=list.map(c=>mode==='collection'?'<div>'+card(c,counts[c.id]||1)+(counts[c.id]?((counts[c.id]>1?'<button class="btn alt" style="width:100%;margin-top:6px" data-conv="'+c.id+'" data-n="'+(counts[c.id]-1)+'">Convertir '+(counts[c.id]-1)+' doublon(s)</button>':'')+'<button class="btn alt" style="width:100%;margin-top:6px" data-sell="'+c.id+'">Vendre</button>'):'<div class="eyebrow" style="text-align:center;margin-top:8px">À découvrir</div>')+'</div>':card(c)).join('')||msg('Aucune carte ne correspond à ces filtres.');$('filterCount').textContent=list.length+' carte(s) affichée(s)';attachCardModal();if(mode==='collection')bindCollectionActions()};['cardSearch','rarityFilter','seriesFilter','sortCards','ownedFilter'].forEach(id=>$(id).addEventListener(id==='cardSearch'?'input':'change',apply));$('resetFilters').onclick=()=>{['cardSearch','rarityFilter','seriesFilter'].forEach(id=>$(id).value='');$('sortCards').value='number';$('ownedFilter').value='all';apply()};apply()}
function bindCollectionActions(){app.querySelectorAll('[data-conv]').forEach(b=>{if(b.dataset.bound)return;b.dataset.bound='1';b.onclick=async()=>{b.disabled=true;const {data:g,error:e}=await sb.rpc('convert_duplicates',{p_card:b.dataset.conv,p_qty:+b.dataset.n,p_key:crypto.randomUUID()});if(e){if($('cm'))$('cm').innerHTML=msg(e.message,1);b.disabled=false;return}await refresh();collection()}});app.querySelectorAll('[data-sell]').forEach(b=>{if(b.dataset.bound)return;b.dataset.bound='1';b.onclick=async()=>{const pr=prompt('Prix de vente en 💰 (1 à 1 000 000) ?');if(!pr)return;const {data:ins}=await sb.from('card_instances').select('id').eq('card_id',b.dataset.sell).eq('locked',false).order('acquired_at',{ascending:false}).limit(1);if(!ins?.length){if($('cm'))$('cm').innerHTML=msg('Aucun exemplaire disponible (déjà en vente ?).',1);return}const {error:e}=await sb.rpc('list_card',{p_instance:ins[0].id,p_price:parseInt(pr,10)});if(e){if($('cm'))$('cm').innerHTML=msg(e.message,1)}else market()}})}
function catalog(){app.innerHTML='<div class="hero-panel"><div class="eyebrow">Collection de cartes · édition premium</div><h1>Bienvenue au GAYCHA CLUB</h1><p>Des cartes à découvrir, des raretés à chasser et un album à compléter. Chaque tirage peut cacher une pépite.</p><button class="btn" id="catalogBoost">Ouvrir un booster</button></div><h2>Le catalogue</h2><p>Explore les cartes et clique sur l’une d’elles pour la voir en grand.</p>'+cardTools()+'<div class="grid cards-grid"></div>';bindCardFilters('catalog');$('catalogBoost').onclick=()=>go('booster')}
async function collection(){app.innerHTML='<h1>Mon album</h1><p>Chargement de tes cartes…</p>';const {data,error}=await sb.from('card_instances').select('card_id,acquired_at').order('acquired_at',{ascending:false});if(error)return app.innerHTML=msg(error.message,1);const cnt={};(data||[]).forEach(d=>cnt[d.card_id]=(cnt[d.card_id]||0)+1);const unique=Object.keys(cnt).length,pct=cards.length?Math.round(unique/cards.length*100):0;app.innerHTML='<div class="hero-panel"><div class="eyebrow">Ton album personnel</div><h1>Chaque carte compte.</h1><p>Retrouve tes découvertes, repère les manquantes et échange tes doublons pour faire grandir ta collection.</p><div class="stat-grid"><div class="stat"><span class="eyebrow">Complété</span><strong>'+pct+' %</strong></div><div class="stat"><span class="eyebrow">Cartes uniques</span><strong>'+unique+' / '+cards.length+'</strong></div><div class="stat"><span class="eyebrow">Doublons</span><strong>'+Object.values(cnt).reduce((a,n)=>a+Math.max(0,n-1),0)+'</strong></div></div><div class="progress-track" style="margin-top:18px"><span style="width:'+pct+'%"></span></div></div><h2>Mon album de cartes</h2><p>Filtre les cartes possédées ou celles qu’il te reste à trouver.</p>'+cardTools()+'<div class="grid cards-grid"></div><div id="cm"></div>';bindCardFilters('collection',cnt);bindCollectionActions()}
function profilePage(){if(!user)return auth();const balance=Number(profile?.balance||0),username=profile?.username||user.email?.split('@')[0]||'Membre';app.innerHTML='<div class="hero-panel"><div class="eyebrow">Espace membre</div><h1>Ton univers GAYCHA</h1><p>Ta collection, ton style et tes prochaines cartes à découvrir.</p></div><div class="stat-grid"><div class="stat"><span class="eyebrow">Pseudo</span><strong style="font-size:22px">'+esc(username)+'</strong></div><div class="stat"><span class="eyebrow">Solde</span><strong>'+balance.toLocaleString('fr-FR')+' 💰</strong></div><div class="stat"><span class="eyebrow">Cartes découvertes</span><strong id="profileOwned">…</strong></div><div class="stat"><span class="eyebrow">Compte</span><strong style="font-size:22px">Actif</strong></div></div><div class="box" style="max-width:none"><h2>Progression de l’album</h2><p id="profileProgress">Calcul de la progression…</p><div class="progress-track"><span id="profileBar" style="width:0%"></span></div><p style="margin-top:18px"><button class="btn" id="goAlbum">Ouvrir mon album</button> <button class="btn alt" id="goBoosters">Découvrir des boosters</button></p></div>';sb.from('card_instances').select('card_id').then(({data,error})=>{if(error)return;const n=new Set((data||[]).map(x=>x.card_id)).size,pct=cards.length?Math.round(n/cards.length*100):0;if($('profileOwned'))$('profileOwned').textContent=n+' / '+cards.length;if($('profileProgress'))$('profileProgress').textContent=pct+' % de la collection complétée';if($('profileBar'))$('profileBar').style.width=pct+'%'});$('goAlbum').onclick=()=>go('collection');$('goBoosters').onclick=()=>go('booster')}

function booster(){
 if(profile&&!profile.age_confirmed_at)return ageGate();
 app.innerHTML=`<div class="hero-panel"><div class="eyebrow">Le moment du tirage</div><h1>Choisis ton booster.</h1><p>Cinq cartes à chaque ouverture. Le tirage est vérifié côté serveur : laisse la chance décider.</p><div class="stat-grid"><div class="stat"><span class="eyebrow">Cartes par paquet</span><strong>05</strong></div><div class="stat"><span class="eyebrow">Raretés</span><strong>06</strong></div><div class="stat"><span class="eyebrow">Collection</span><strong>${cards.length}</strong></div></div></div>
 <div class="booster-stage">
 <article class="booster-pack" style="--pack-a:#55e7df;--pack-b:#7187ff"><div class="eyebrow">Édition quotidienne</div><div class="pack-seal">G</div><div><div class="pack-title">LE PETIT<br>MALAISE</div><p class="pack-sub">Un petit frisson, cinq nouvelles occasions de compléter ton album.</p></div><div style="width:100%"><div class="pack-price">GRATUIT</div><button class="btn" data-b="petit-malaise">Ouvrir le paquet</button></div></article>
 <article class="booster-pack" style="--pack-a:#ff4fa3;--pack-b:#ffd56e"><div class="eyebrow">Édition premium</div><div class="pack-seal">✦</div><div><div class="pack-title">LE RED FLAG</div><p class="pack-sub">Le paquet qui sent le drama. Cinq cartes, et peut-être une rareté explosive.</p></div><div style="width:100%"><div class="pack-price">100 💰</div><button class="btn alt" data-b="red-flag">Ouvrir le paquet</button></div></article>
 </div><div id="odds" class="note booster-notice">Chargement des probabilités…</div><div id="pk" class="grid cards-grid"></div>`;
 app.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>open5(b.dataset.b));
 sb.from('booster_types').select('name,odds,pity_threshold').eq('active',true).then(({data,error})=>{
  if(error){$('odds').innerHTML=msg('Probabilités indisponibles pour le moment.',1);return}
  $('odds').innerHTML=(data||[]).map(t=>'<b>'+esc(t.name)+'</b> : '+Object.entries(t.odds||{}).map(([k,v])=>(RN[k]?.[0]||k)+' '+v+' %').join(' · ')+'. Garantie : une Rare ou mieux après '+t.pity_threshold+' cartes sans.').join('<br>')||'Les probabilités seront affichées ici.';
 });
}
go('catalog');
</script></body></html>
