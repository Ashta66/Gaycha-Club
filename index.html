<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAYCHA CLUB — Phase 2</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:dark;--bg:#101010;--ch:#1D1D20;--gold:#D6B46A;--cream:#F4EBDD;--mut:#a9a39a;--rb:linear-gradient(90deg,#FF477E,#FF8A00,#FFDA45,#8CCF35,#00A9A5,#3867FF,#C9A7FF)}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 85% -10%,#D6B46A22,transparent 60%),radial-gradient(700px 500px at -10% 35%,#FF477E14,transparent 60%),radial-gradient(600px 400px at 60% 110%,#00A9A514,transparent 60%),var(--bg);background-attachment:fixed;color:var(--cream);font:16px/1.5 Fraunces,Georgia,serif}
h1,h2,.logo{font-family:Anton,Impact,sans-serif;font-weight:400;margin:0;letter-spacing:.02em}
h1{font-size:clamp(36px,6vw,60px);line-height:1.05}h2{font-size:30px;margin:26px 0 8px}
main>h1::after,.rbar{content:"";display:block;height:4px;width:110px;margin-top:8px;border-radius:2px;background:var(--rb)}
button{font:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:10;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 20px 15px;background:#1D1D20ee;backdrop-filter:blur(8px)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rb);background-size:200% 100%;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:200% 0}}
.logo{font-size:28px;color:var(--gold);line-height:1;text-shadow:0 0 18px #D6B46A44}.logo small{font:600 10px Fraunces;letter-spacing:.5em;display:block;color:var(--cream)}
header nav{display:flex;gap:6px;flex-wrap:wrap}header nav .btn{padding:8px 14px;min-height:40px;font-size:14px}
header .me{margin-left:auto;color:var(--mut);font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
main{max-width:1100px;margin:0 auto;padding:30px 20px 60px}
.hero{padding:14px 0 10px}.hero p{color:var(--mut);margin:8px 0 12px}
.btn{background:linear-gradient(180deg,#e8cb86,#D6B46A);color:#101010;border:0;border-radius:8px;padding:12px 20px;font-weight:600;min-height:46px;transition:transform .15s,box-shadow .15s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 20px #D6B46A44}
.btn.alt{background:#ffffff08;color:var(--cream);border:1px solid #D6B46A99}
.btn.alt:hover:not(:disabled){border:1px solid transparent;background:linear-gradient(#1D1D20,#1D1D20) padding-box,var(--rb) border-box;box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
input,select,textarea{background:#101010;color:var(--cream);border:1px solid #4a4233;border-radius:8px;padding:10px 12px;min-height:44px;font:inherit;width:100%;margin:6px 0}
.box{position:relative;overflow:hidden;max-width:420px;background:#1D1D20;border:1px solid #3a3326;border-radius:12px;padding:22px;margin:20px auto}
.box::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--rb);opacity:.9}
.note{background:var(--ch);border-left:4px solid #FF477E;padding:12px 16px;border-radius:0 8px 8px 0;color:var(--mut);margin:14px 0}
.err{border-color:#ff5555;color:#ffb4b4}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #333;text-align:left;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px;margin-top:18px}
/* ===== Cartes ===== */
.card{--s1:#FF477E;--s2:#c4204f;--r:#8a95a3;position:relative;aspect-ratio:5/7;border-radius:14px;background:#0b0b0c;border:3px solid var(--r);padding:6px;display:flex;flex-direction:column;overflow:hidden;color:#fff;width:100%;container-type:inline-size;cursor:pointer;text-align:left;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px) scale(1.02)}
.band{background:linear-gradient(90deg,var(--s1),var(--s2));color:#101010;font-family:Anton,sans-serif;font-size:max(9px,6.2cqw);letter-spacing:.12em;padding:.8cqw 2.6cqw;border-radius:4px;display:flex;justify-content:space-between}
.art{position:relative;overflow:hidden;flex:1;margin:6px 0;border-radius:6px;background:radial-gradient(circle at 50% 35%,var(--s1) 0,transparent 58%),linear-gradient(160deg,#26262b,#0b0b0c);display:grid;place-items:center}
.art::before{content:"";position:absolute;inset:0;background:radial-gradient(#ffffff26 1px,transparent 1.6px) 0 0/8px 8px;mix-blend-mode:overlay}
.art b{font-family:Anton,sans-serif;font-weight:400;font-size:40cqw;line-height:1;background:linear-gradient(180deg,#fff,#ffffffaa);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #0009)}
.art i{position:absolute;bottom:4px;left:6px;font-style:normal;font-size:max(7px,4cqw);opacity:.55}
.nm{font-family:Anton,sans-serif;font-size:max(11px,9cqw);letter-spacing:.03em}
.spec{font-size:max(8.5px,5.4cqw);line-height:1.25;color:#d8d2c8}
.meta{display:flex;justify-content:space-between;font-size:max(8.5px,5.2cqw);margin-top:2px}.rar{color:var(--r);font-weight:600}
.x{position:absolute;top:8.5cqw;right:2cqw;background:var(--gold);color:#101010;border-radius:10px;font:600 max(10px,5cqw) Fraunces;padding:1px 8px;z-index:2}
.r-peu_commun{--r:#2fa57a;background-image:repeating-linear-gradient(45deg,#ffffff06 0 6px,transparent 6px 12px)}
.r-rare{--r:#3867FF;box-shadow:0 0 16px #3867FF66,inset 0 0 0 1px #9bb0ff}
.r-epique{--r:#e03bd0;box-shadow:0 0 20px #e03bd088}
.r-legendaire{--r:#D6B46A;box-shadow:0 0 24px #D6B46A99,inset 0 0 0 2px #7a5f22}
.r-secrete{--r:#fff;border-color:transparent;background:linear-gradient(#0b0b0c,#0b0b0c) padding-box,conic-gradient(from var(--a),#ff477e,#ffda45,#8ccf35,#00a9a5,#3867ff,#c9a7ff,#ff477e) border-box;animation:spin 6s linear infinite;box-shadow:0 0 22px #c9a7ff55}
@keyframes spin{to{--a:360deg}}
.r-epique::after,.r-legendaire::after,.r-secrete::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,#ffffff40 48%,transparent 60%);background-size:250% 100%;background-position:150% 0;animation:sh 3.5s infinite}
.r-secrete::after{background-image:linear-gradient(115deg,#ff477e44,#ffda4444,#00a9a544,#3867ff44,#c9a7ff44,transparent);animation-direction:alternate;animation-duration:2.5s}
@keyframes sh{to{background-position:-50% 0}}
/* Ouverture de booster */
.fl{aspect-ratio:5/7;perspective:900px}.fi{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s}.fl.on .fi{transform:rotateY(180deg)}
.fb,.ff{position:absolute;inset:0;backface-visibility:hidden}.ff{transform:rotateY(180deg)}.ff .card{height:100%}.fl .card:hover{transform:none}
.fl.hi.on{animation:pop .9s}@keyframes pop{30%{filter:brightness(2) drop-shadow(0 0 26px #FFDA45);transform:scale(1.08)}}
.back{display:grid;place-items:center;border:3px solid var(--gold);background:repeating-conic-gradient(#ff477e18 0 15deg,#3867ff18 0 30deg),#0b0b0c}
.sealed{width:200px;aspect-ratio:5/8;margin:20px auto;background:linear-gradient(160deg,#2a2418,#0b0b0c);border:3px solid var(--gold);border-radius:10px;display:grid;place-content:center;text-align:center;animation:shk .5s 2;box-shadow:0 0 30px #D6B46A55}
@keyframes shk{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
/* Vue en grand */
dialog{position:relative;background:var(--ch);color:var(--cream);border:0;border-radius:16px;padding:26px;max-width:860px;width:94vw}
dialog::backdrop{background:#000d;backdrop-filter:blur(4px)}
dialog::before{content:"";position:absolute;inset:0;border-radius:16px;padding:2px;background:var(--rb);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.zw{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:28px;align-items:center}
@media(max-width:640px){.zw{grid-template-columns:1fr}.zc{max-width:300px;margin:0 auto}}
.zc{position:relative;transition:transform .12s;will-change:transform}.zc .card:hover{transform:none}
.glare{position:absolute;inset:0;border-radius:14px;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,25%),#ffffff55,transparent 45%);mix-blend-mode:overlay}
.zx{position:absolute;top:12px;right:12px;z-index:2;min-height:40px;padding:6px 14px}
.zi h2{margin-top:0}
@media(prefers-reduced-motion:reduce){header::after,.r-secrete,.r-epique::after,.r-legendaire::after,.r-secrete::after,.sealed,.fl.hi.on{animation:none}.fi,.card,.btn,.zc{transition:none}.card:hover{transform:none}}

.cards-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px}
@media(max-width:560px){.cards-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
body::before{content:"";position:fixed;z-index:-1;inset:0;pointer-events:none;background:linear-gradient(125deg,#ff477e08,#ff8a0005,#ffda4508,#8ccf3505,#00a9a508,#3867ff08,#c9a7ff08);background-size:250% 250%;animation:pride-drift 22s ease infinite}
@keyframes pride-drift{50%{background-position:100% 100%}}
.rainbow-line{height:4px;border-radius:99px;background:var(--rb);margin:12px 0 18px;box-shadow:0 0 18px #c9a7ff25}
.trade-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.trade-side{padding:14px;border:1px solid #ffffff20;border-radius:14px;background:linear-gradient(145deg,#ffffff08,#ffffff02);min-width:0}
.trade-side.give{border-top:3px solid #00a9a5}.trade-side.get{border-top:3px solid #ff477e}
.trade-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:10px}
.trade-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin:12px 0}
.trade-tools{display:grid;grid-template-columns:minmax(130px,2fr) repeat(2,minmax(110px,1fr));gap:8px;margin:12px 0}.trade-tools input,.trade-tools select{width:100%;min-width:0;background:#101010;color:#F4EBDD;border:1px solid #ffffff2a;border-radius:8px;padding:9px}.trade-pagination{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0}.trade-pagination button{padding:7px 12px}.trade-count{font-size:12px;color:var(--mut);text-align:center}.trade-empty{padding:16px;border:1px dashed #ffffff2a;border-radius:10px;color:var(--mut);text-align:center}@media(max-width:650px){.trade-tools{grid-template-columns:1fr 1fr}.trade-tools input{grid-column:1/-1}.trade-picker{grid-template-columns:repeat(2,minmax(0,1fr))}}.trade-card-option{background:transparent;border:1px solid #ffffff1c;border-radius:10px;padding:5px;cursor:pointer;text-align:left;min-width:0}.trade-card-option .card{width:100%;margin:0}.trade-card-option.selected{border:2px solid #00a9a5;box-shadow:0 0 16px #00a9a544}.trade-side.get .trade-card-option.selected{border-color:#ff477e;box-shadow:0 0 16px #ff477e44}.trade-card-option:not(.selected){opacity:.82}.trade-card-option:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.booster-choice.cooldown{filter:grayscale(1);opacity:.48;border-color:#555;cursor:not-allowed;box-shadow:none}.booster-choice.cooldown:hover{transform:none;box-shadow:none}
.mission-card{max-width:none;margin:12px 0;border:1px solid #ffffff1c;background:linear-gradient(135deg,#1d1d20,#211923);transition:border-color .2s,transform .2s}
.mission-card.done{border-color:#35d39a88;background:linear-gradient(120deg,#102e27,#1d1d20 70%);box-shadow:inset 4px 0 #35d39a,0 0 20px #35d39a12}
.mission-card.ready{border-color:#d6b46a99;box-shadow:inset 4px 0 #d6b46a}
.mission-top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.mission-status{font:600 12px Fraunces;border-radius:999px;padding:5px 9px;background:#ffffff12;color:var(--mut)}
.done .mission-status{background:#35d39a20;color:#6ef0b9}.ready .mission-status{background:#d6b46a20;color:#f0d28d}
.progress-track{height:9px;background:#ffffff12;border-radius:99px;overflow:hidden;margin:12px 0 5px}
.progress-fill{height:100%;width:var(--progress);background:var(--rb);border-radius:99px;transition:width .5s}
.done .progress-fill{background:linear-gradient(90deg,#168b63,#4be3a9)}
.leaderboard-list{display:grid;gap:10px;margin-top:20px}
.leader-row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:14px 16px;border:1px solid #ffffff18;border-radius:14px;background:#ffffff06}
.leader-row.top-1{background:linear-gradient(100deg,#d6b46a24,#ff477e10,#ffffff05);border-color:#d6b46a88}
.leader-row.top-2{border-color:#c6d4e688}.leader-row.top-3{border-color:#c58c6588}
.leader-rank{font:30px Anton,sans-serif;text-align:center;color:#d6b46a}
.leader-avatar{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--rb);color:#101010;font:20px Anton,sans-serif;margin-right:10px;vertical-align:middle}
.leader-metrics{display:flex;gap:8px;flex-wrap:wrap;color:var(--mut);font-size:13px}
.profile-trigger{border:1px solid #ffffff22;background:#ffffff08;color:var(--cream);border-radius:999px;padding:8px 12px;cursor:pointer}
.profile-trigger:hover{border-color:#ff477e;box-shadow:0 0 16px #ff477e33}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.setting-item{padding:12px;border:1px solid #ffffff18;border-radius:10px;background:#ffffff05}
.setting-item label{display:block;color:var(--mut);font-size:13px}
body[data-pride="soft"]::before{opacity:.25}body[data-pride="max"]::before{opacity:1;animation-duration:7s}
body.reduced-motion *,body.reduced-motion *::before,body.reduced-motion *::after{animation:none!important;transition:none!important}
@media(max-width:650px){.trade-layout,.settings-grid{grid-template-columns:1fr}.leader-row{grid-template-columns:40px 1fr}.leader-score{grid-column:2}}


.chat-window{padding:18px;border:1px solid #ffffff1c;border-radius:18px;background:linear-gradient(145deg,#1b1b20,#131316);box-shadow:0 18px 50px #0004}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid #ffffff18}
.chat-feed{display:flex;flex-direction:column;gap:10px;max-height:440px;overflow:auto;padding:18px 4px}
.chat-bubble{max-width:min(78%,560px);padding:12px 16px;border-radius:18px;background:#29282f;border:1px solid #ffffff1b;overflow-wrap:anywhere;box-shadow:0 5px 14px #0002;white-space:pre-wrap}
.chat-bubble.mine{align-self:flex-end;background:linear-gradient(135deg,#49355a,#273e50);border-color:#c9a7ff66;border-bottom-right-radius:5px}
.chat-bubble.theirs{align-self:flex-start;background:#242429;border-color:#ffffff20;border-bottom-left-radius:5px}
.chat-bubble small{display:block;color:#c8c1d0;font-size:11px;margin-top:7px;opacity:.85}
.chat-window{border-color:#d6b46a55;background:linear-gradient(145deg,#202026,#121214);padding:20px}
.chat-feed{background:#10101280;border-radius:14px;min-height:180px}
.google-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;margin-top:12px;background:#fff;color:#3c4043;border:1px solid #dadce0;border-radius:8px;padding:12px 16px;font:600 15px Arial,sans-serif;min-height:48px;transition:background .15s,box-shadow .15s}
.google-btn:hover{background:#f8faff;box-shadow:0 2px 8px #0004}
.booster-detail{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);gap:22px;align-items:start;margin:18px 0;padding:22px;border:1px solid #d6b46a66;border-radius:18px;background:linear-gradient(135deg,#252129,#111113);box-shadow:0 16px 38px #0004}
.booster-detail .booster-pack{width:min(100%,180px);height:auto;aspect-ratio:5/7;transform:none}
.odds-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.odds-item{padding:9px 11px;border-radius:10px;background:#ffffff08;border:1px solid #ffffff12;display:flex;justify-content:space-between;gap:10px}
.booster-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
@media(max-width:560px){.booster-detail{grid-template-columns:1fr}.booster-detail .booster-pack{width:130px}.chat-bubble{max-width:90%}}
.chat-compose{display:flex;gap:10px;align-items:center}.chat-compose input{flex:1;min-width:0}
.conversation-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.conversation-tile{display:block;width:100%;text-align:left;padding:15px;border:1px solid #ffffff18;border-radius:13px;background:#ffffff05;color:var(--cream);cursor:pointer}
.conversation-tile:hover{border-color:#ff477e88;background:#ff477e0b}
.booster-choices{display:flex;gap:16px;flex-wrap:wrap;margin:18px 0}
.booster-choice{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:190px;min-height:245px;padding:16px;border-radius:18px;border:1px solid #d6b46a88;background:radial-gradient(ellipse at 50% 10%,#ff477e38,transparent 50%),linear-gradient(145deg,#31213b,#101014 68%);color:var(--cream);cursor:pointer;perspective:700px;box-shadow:0 10px 28px #0005;transition:transform .25s,box-shadow .25s}
.booster-choice:hover{transform:translateY(-6px) rotateY(-5deg) rotateX(3deg);box-shadow:0 18px 35px #ff477e24,0 0 0 1px #d6b46a66}
.booster-pack{width:110px;height:145px;display:grid;place-items:center;border-radius:12px;border:2px solid #d6b46a;background:linear-gradient(135deg,#ff477e,#8d3f9e 36%,#263f82 68%,#12121a);box-shadow:inset 0 0 0 4px #ffffff16,0 8px 18px #0007;transform:rotate(-4deg);position:relative;overflow:hidden}
.booster-pack::before{content:"";position:absolute;inset:-60% -20%;background:linear-gradient(110deg,transparent 40%,#ffffff55 48%,transparent 56%);transform:translateX(-80%);animation:pack-shine 3s infinite}
.booster-pack strong{font:28px Anton,sans-serif;text-shadow:0 2px 9px #0009;z-index:1}
@keyframes pack-shine{to{transform:translateX(80%)}}
.profile-avatar{width:42px;height:42px;object-fit:cover;border-radius:50%;border:2px solid #c9a7ff;vertical-align:middle}
.nav-badge{display:inline-grid;place-items:center;min-width:19px;height:19px;margin-left:5px;padding:0 5px;border-radius:99px;background:#ff477e;color:#101010;font:700 11px Arial,sans-serif;vertical-align:middle}
.collection-tools{display:grid;grid-template-columns:minmax(0,2fr) minmax(150px,1fr);gap:10px;max-width:650px;margin:16px 0}
.collection-tools input,.collection-tools select{margin:0}
.trade-review{margin-top:16px;padding:16px;border:1px solid #d6b46a88;border-radius:14px;background:linear-gradient(135deg,#d6b46a12,#ff477e08)}
.trade-review-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.trade-review-side{min-width:0;padding:12px;border:1px solid #ffffff1a;border-radius:10px;background:#0002}
.trade-review-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(75px,1fr));gap:8px;margin:8px 0}
.trade-review-cards .card{pointer-events:none}
@media(max-width:560px){.collection-tools{grid-template-columns:1fr}.trade-review-grid{grid-template-columns:1fr}}
@media(max-width:560px){.booster-choice{width:calc(50% - 8px);min-width:135px}.chat-bubble{max-width:90%}.chat-compose{align-items:stretch}.chat-compose input{width:100%}}
/* ===== Finition premium, confort et accessibilité ===== */
.skip-link{position:fixed;left:12px;top:-80px;z-index:1000;background:#fff;color:#111;padding:12px 16px;border-radius:8px;font:700 16px Arial,sans-serif}.skip-link:focus{top:12px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px #3867ff99}
main{min-height:65vh}
.card{isolation:isolate;box-shadow:0 10px 24px #0005}
.card::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;background:linear-gradient(115deg,transparent 20%,#fff5 45%,transparent 58%);transform:translateX(-130%);transition:transform .55s,opacity .2s}
.card:hover::before,.card:focus-visible::before{opacity:.75;transform:translateX(130%)}
.r-commun{--r:#c5c5c5}.r-peu_commun{--r:#45d4a3}.r-rare{--r:#5f8cff}.r-epique{--r:#ff6be7}.r-legendaire{--r:#f3cf72}
.player-card-wrap{max-width:900px;margin:22px auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);gap:24px;align-items:start}
.player-card-preview{position:relative;overflow:hidden;min-height:420px;padding:24px;border:2px solid transparent;border-radius:22px;background:linear-gradient(#17151d,#17151d) padding-box,conic-gradient(from var(--a),#ff477e,#ff8a00,#ffda45,#8ccf35,#00a9a5,#3867ff,#c9a7ff,#ff477e) border-box;box-shadow:0 20px 55px #0008;isolation:isolate}
.player-card-preview:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 80% 20%,var(--pc-accent,#ff477e)55,transparent 40%),radial-gradient(circle at 10% 90%,#3867ff66,transparent 42%);opacity:.45}
.player-card-brand{font:12px Arial,sans-serif;letter-spacing:.3em;color:#f4ebdd99}.player-card-avatar{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;margin:24px 0 12px;background:var(--rb);color:#101010;font:48px Anton,sans-serif;border:3px solid #fff8;box-shadow:0 0 35px #ff477e66}
.player-card-name{font:clamp(28px,5vw,42px)/1 Anton,sans-serif;overflow-wrap:anywhere}.player-card-title{display:inline-block;margin:10px 0;padding:7px 11px;border:1px solid var(--pc-accent,#ff477e);border-radius:999px;color:#fff;background:#ffffff0d;font:700 12px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.player-card-motto{color:#f4ebddcc;font-style:italic;margin:8px 0 22px;overflow-wrap:anywhere}
.player-card-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.player-card-stat{padding:12px 8px;border:1px solid #ffffff24;border-radius:12px;background:#09090b66;text-align:center}.player-card-stat b{display:block;font:25px Anton,sans-serif}.player-card-stat small{font:10px Arial,sans-serif;color:#f4ebddad;text-transform:uppercase;letter-spacing:.06em}
.player-card-form{padding:18px;border:1px solid #ffffff20;border-radius:16px;background:#ffffff06}.player-card-form label{display:block;font-size:13px;color:var(--mut);margin-top:8px}.player-card-form .btn{width:100%;margin-top:10px}
@media(max-width:700px){.player-card-wrap{grid-template-columns:1fr}.player-card-preview{min-height:390px}.player-card-form{order:-1}}

async function ageGate(){app.innerHTML=`<div class="box"><h2>Réservé aux 18 ans et plus</h2><p>Ce site contient de l’humour adulte. Confirmez que vous avez 18 ans ou plus. Il s’agit d’une déclaration, pas d’une vérification d’identité.</p><button class="btn" id="ok">J’ai 18 ans ou plus</button><div id="am"></div></div>`;

async function collection(){app.innerHTML='<h1>Ma collection</h1><p>Chargement…</p>';

app.querySelectorAll('[data-conv]').forEach(b=>b.onclick=async()=>{b.disabled=true;const {data:g,error:e}=await sb.rpc('convert_duplicates',{p_card:b.dataset.conv,p_qty:+b.dataset.n,p_key:crypto.randomUUID()});if(e){$('cm').innerHTML=msg(e.message,1);b.disabled=false;return}await refresh();collection();$('cm').innerHTML=msg('+'+g+' 💰 ajoutés à votre solde.')});

function booster(){if(profile&&!profile.age_confirmed_at)return ageGate();
app.innerHTML=`<h1>Boosters</h1><p>Choisis un booster pour consulter ses probabilités, l’acheter fermé ou ouvrir un exemplaire déjà en réserve.</p><div class="rainbow-line"></div><div id="booster-notice"></div><div id="booster-list" class="booster-choices"><div class="note">Chargement des boosters…</div></div><div id="booster-detail"></div><h2>Mes boosters en réserve</h2><p>Les boosters achetés et offerts restent fermés jusqu’à leur ouverture.</p><div id="gifted" class="booster-choices"><div class="note">Chargement de l’inventaire…</div></div><div id="pk" class="grid"></div>`;

async function loadBoosterTypes(){const host=$('booster-list');if(!host)return;const {data,error}=await sb.from('booster_types').select('slug,name,price,cards_per_pack,odds,pity_threshold,cooldown_hours,active').eq('active',true).order('price');if(error){host.innerHTML=msg(error.message,1);return}boosterTypes=data||[];await loadBoosterCooldowns();host.innerHTML=boosterTypes.map(t=>{const left=boosterCooldownRemaining(t.slug,t.cooldown_hours);return `<button class="booster-choice ${left>0?'cooldown':''}" data-b="${esc(t.slug)}" ><span class="booster-pack"><strong>${t.slug==='red-flag'?'♥':'G'}</strong></span><b>${esc(t.name)}</b><span>${left>0?'Disponible dans '+formatCooldown(left):t.price===0?'Gratuit':Number(t.price).toLocaleString('fr-FR')+' 💰'}</span><span>${t.cards_per_pack} cartes · ${left>0?'En recharge':'Voir les probabilités'}</span></button>`}).join('');host.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>showBoosterDetails(b.dataset.b));await loadBoosterInventory();if(boosterTypes.length)showBoosterDetails(boosterTypes[0].slug)}
let boosterCooldowns={};
async function loadBoosterCooldowns(){boosterCooldowns={};if(!user)return;const ts=boosterTypes.filter(t=>t.cooldown_hours>0);if(!ts.length)return;const reasons=ts.flatMap(t=>['booster_purchase:'+t.slug,'booster:'+t.slug]);const {data,error}=await sb.from('ledger').select('reason,created_at').eq('user_id',user.id).in('reason',reasons).order('created_at',{ascending:false});if(error){console.warn('Cooldown des boosters indisponible',error.message);return}(data||[]).forEach(row=>{if(!boosterCooldowns[row.reason]||new Date(row.created_at)>new Date(boosterCooldowns[row.reason]))boosterCooldowns[row.reason]=row.created_at})}
function boosterCooldownRemaining(slug,hours){if(!hours)return 0;const dates=[boosterCooldowns['booster_purchase:'+slug],boosterCooldowns['booster:'+slug]].filter(Boolean).map(v=>new Date(v).getTime());if(!dates.length)return 0;return Math.max(0,Math.max(...dates)+Number(hours)*3600000-Date.now())}
function formatCooldown(ms){const total=Math.ceil(ms/60000),h=Math.floor(total/60),m=total%60;return h>0?`${h} h ${m} min`:`${m} min`}
async function loadBoosterInventory(){const host=$('gifted');if(!host||!user)return;const {data,error}=await sb.from('booster_inventory').select('quantity,paid_quantity,booster_types(slug,name)').eq('user_id',user.id);if(error){host.innerHTML=msg('Inventaire indisponible : '+error.message,1);return}boosterInventory=(data||[]).filter(x=>x.booster_types);renderBoosterInventory()}

slug,'paid')}

async function open5(slug,source='paid'){if(busy)return;busy=true;const buttons=[...document.querySelectorAll('[data-b],[data-open-gift],[data-open-paid],#buy-selected')];buttons.forEach(b=>b.disabled=true);const pk=$('pk');pk.innerHTML='<div class="sealed" style="grid-column:1/-1;justify-self:center"><div class="logo">GAYCHA<small>CLUB</small></div></div>';
const {data,error}=await sb.rpc('open_booster',{p_booster:slug,p_key:crypto.randomUUID(),p_use_inventory:source==='gift',p_use_paid:source==='paid'});

app.innerHTML=`<h1>Messages</h1><div class="rainbow-line"></div><div id="mq"></div>${th}<div class="box" style="max-width:none"><b>Nouveau message</b><div class="chat-compose"><input id="nu" placeholder="Pseudo du destinataire"><input id="nb" maxlength="1000" placeholder="Premier message…"><button class="btn" id="ns">Envoyer</button></div><p class="note">Le premier message peut déclencher une demande de contact.</p></div>
<h2>Conversations</h2><div class="conversation-list">${cv.length?'':msg('Aucune conversation.')}${cv.map(c=>`<button class="conversation-tile" data-c="${c.id}"><b>${esc(c.other)}</b><div class="note">${c.status==='pending'?'Demande en attente':c.status==='declined'?'Demande refusée':'Ouvrir la conversation'} ${c.unread?` · ${c.unread} non lu(s)`:''}</div></button>`).join('')}</div>
${bl.length?`<h2>Utilisateurs bloqués</h2>${bl.map(x=>`<div>${esc(x.username)} <button class="btn alt" data-unb="${x.blocked_id}">Débloquer</button></div>`).join('')}`:''}`;
const fail=e=>{$('mq').innerHTML=msg(e.message,1)};
$('ns').onclick=async()=>{const {error:e}=await sb.rpc('send_message',{p_recipient:$('nu').value.trim(),p_body:$('nb').value});e?fail(e):messages()};
if($('ms'))$('ms').onclick=async()=>{const body=$('mb').value.trim();if(!body)return;const {error:e}=await sb.rpc('send_message',{p_recipient:$('ms').dataset.to,p_body:body});e?fail(e):messages(openId)};
app.querySelectorAll('[data-c]').forEach(l=>l.onclick=ev=>{ev.preventDefault();messages(l.dataset.c)});
app.querySelectorAll('[data-rsp]').forEach(x=>x.onclick=async()=>{const {error:e}=await sb.rpc('respond_request',{p_conversation:x.dataset.cv,p_accept:x.dataset.rsp==='1'});e?fail(e):messages(openId)});
app.querySelectorAll('[data-blk]').forEach(x=>x.onclick=async()=>{if(!confirm('Bloquer '+x.dataset.blk+' ? Cette personne ne pourra plus vous écrire ni vous proposer d’échange.'))return;const {error:e}=await sb.rpc('block_user',{p_username:x.dataset.blk});e?fail(e):messages()});
app.querySelectorAll('[data-unb]').forEach(x=>x.onclick=async()=>{const {error:e}=await sb.rpc('unblock_user',{p_blocked:x.dataset.unb});e?fail(e):messages(openId)});
app.querySelectorAll('[data-rep]').forEach(x=>x.onclick=async ev=>{ev.preventDefault();const r=prompt('Pourquoi signalez-vous ce message ? (3 à 500 caractères)');if(!r)return;const {error:e}=await sb.rpc('report_message',{p_message:x.dataset.rep,p_reason:r});$('mq').innerHTML=e?msg(e.message,1):msg('Signalement envoyé à la modération.')})}

/* ===== Paramètres personnels ===== */
const settings=document.createElement('dialog');settings.setAttribute('aria-label','Paramètres personnels');document.body.appendChild(settings);
function openSettings(){
 if(!user)return;
 settings.innerHTML=`<button class="btn alt zx" id="settings-close">Fermer</button><h2 style="margin-top:0">Mon espace</h2><p>Personnalise ton profil et ton expérience Gaycha Club.</p><div class="rainbow-line"></div><div class="box" style="max-width:none;margin:0 0 14px"><h2 style="margin-top:0">Profil</h2><label>Pseudo (3 à 20 caractères : lettres, chiffres et _)</label><input id="settings-name" maxlength="20" value="${esc(profile?.username||'')}"><button class="btn" id="settings-save">Enregistrer le pseudo</button><div id="settings-msg"></div></div><div class="box" style="max-width:none;margin:0 0 14px"><h2 style="margin-top:0">Ambiance</h2><div class="setting-item"><label for="settings-rainbow">Intensité arc-en-ciel</label><select id="settings-rainbow"><option value="soft">Discrète</option><option value="bright">Paillettes & fierté 🌈</option><option value="max">Pride totale ✨</option></select></div><div class="setting-item"><label><input type="checkbox" id="settings-motion" style="width:auto"> Réduire les animations</label></div><button class="btn alt" id="settings-visual-save">Enregistrer mes préférences</button></div><div class="note"><b>Photo de profil</b><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:10px">${user.user_metadata?.avatar_url?`<img class="profile-avatar" style="width:76px;height:76px" src="${esc(user.user_metadata.avatar_url)}" alt="Photo actuelle">`:`<div class="leader-avatar" style="width:76px;height:76px;font-size:30px">${esc((profile?.username||'?').charAt(0).toUpperCase())}</div>`}<div style="flex:1;min-width:220px"><label for="settings-avatar">Image JPG, PNG ou WebP · 2 Mo maximum</label><input type="file" id="settings-avatar" accept="image/png,image/jpeg,image/webp"><button class="btn" id="settings-avatar-save">Mettre à jour la photo</button><div id="avatar-msg"></div></div></div><p class="note">Le stockage nécessite un bucket public « avatars » dans Supabase. Autres idées : badge de profil, confidentialité de la collection et notifications d’échange.</div><button class="btn alt" id="settings-out">Déconnexion</button>`;
 settings.showModal();
 $('settings-close').onclick=()=>settings.close();
 $('settings-out').onclick=async()=>{settings.close();await sb.auth.signOut();go('booster')};
 $('settings-name').pattern='[A-Za-z0-9_]{3,20}';
 $('settings-rainbow').value=localStorage.getItem('gaycha-rainbow')||'bright';
 $('settings-motion').checked=localStorage.getItem('gaycha-motion')==='1';
 $('settings-visual-save').onclick=()=>{localStorage.setItem('gaycha-rainbow',$('settings-rainbow').value);localStorage.setItem('gaycha-motion',$('settings-motion').checked?'1':'0');document.body.dataset.pride=$('settings-rainbow').value;document.body.classList.toggle('reduced-motion',$('settings-motion').checked);$('settings-msg').innerHTML=msg('Préférences enregistrées sur cet appareil.')};
 $('settings-avatar-save').onclick=async()=>{const file=$('settings-avatar').files?.[0];if(!file){$('avatar-msg').innerHTML=msg('Choisis d’abord une image.',1);return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>2*1024*1024){$('avatar-msg').innerHTML=msg('Format non pris en charge ou fichier supérieur à 2 Mo.',1);return}const path=user.id+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const {error:upError}=await sb.storage.from('avatars').upload(path,file,{upsert:true,contentType:file.type});if(upError){$('avatar-msg').innerHTML=msg('Envoi impossible : '+upError.message+' (vérifie que le bucket public « avatars » existe dans Supabase).',1);return}const {data:pub}=sb.storage.from('avatars').getPublicUrl(path);const {error:metaError}=await sb.auth.updateUser({data:{avatar_url:pub.publicUrl}});if(metaError){$('avatar-msg').innerHTML=msg(metaError.message,1);return}await refresh();$('avatar-msg').innerHTML=msg('Photo de profil mise à jour.');openSettings()};
 $('settings-save').onclick=async()=>{const name=$('settings-name').value.trim();if(!/^[A-Za-z0-9_]{3,20}$/.test(name)){$('settings-msg').innerHTML=msg('Le pseudo doit contenir 3 à 20 lettres, chiffres ou _.',1);return}const {data:exists,error:checkError}=await sb.from('profiles').select('id').eq('username',name).neq('id',user.id).maybeSingle();if(checkError){$('settings-msg').innerHTML=msg(checkError.message,1);return}if(exists){$('settings-msg').innerHTML=msg('Ce pseudo est déjà utilisé.',1);return}const {error}=await sb.from('profiles').update({username:name}).eq('id',user.id);if(error){$('settings-msg').innerHTML=msg(error.message,1);return}await refresh();$('settings-msg').innerHTML=msg('Pseudo mis à jour !')};
}
settings.addEventListener('click',e=>{if(e.target===settings)settings.close()});
const pride=localStorage.getItem('gaycha-rainbow')||'bright';document.body.dataset.pride=pride;if(localStorage.getItem('gaycha-motion')==='1')document.body.classList.add('reduced-motion');

/* ===== Vue en grand ===== */
const zoom=document.createElement('dialog');zoom.setAttribute('aria-label','Carte en grand');document.body.appendChild(zoom);
function openZoom(id){const c=cards.find(x=>x.id===id);if(!c)return;const r=RN[c.rarity];
zoom.innerHTML=`<button class="btn alt zx" id="zc">Fermer</button><div class="zw"><div class="zc" id="zt">${card(c)}<div class="glare"></div></div><div class="zi"><h2>${esc(c.name)}</h2><p><b>${esc(c.series?.name)}</b> · ${r[1]} ${r[0]} · N° ${String(c.number).padStart(3,'0')}</p>${c.spec?`<p><b>Spécialité :</b> ${esc(c.spec)}</p>`:''}${c.anecdote?`<p><b>Anecdote :</b> ${esc(c.anecdote)}</p>`:''}${c.bio?`<p>${esc(c.bio)}</p>`:''}<p class="note">Personnage fictif ou commentaire satirique : ce n’est pas une déclaration réelle.</p></div></div>`;
zoom.showModal();const t=$('zt');
if(!matchMedia('(prefers-reduced-motion:reduce)').matches){t.onpointermove=e=>{const b=t.getBoundingClientRect(),x=(e.clientX-b.left)/b.width,y=(e.clientY-b.top)/b.height;t.style.transform=`perspective(800px) rotateY(${(x-.5)*16}deg) rotateX(${(.5-y)*16}deg)`;t.style.setProperty('--mx',x*100+'%');t.style.setProperty('--my',y*100+'%')};t.onpointerleave=()=>{t.style.transform=''}}
$('zc').onclick=()=>zoom.close()}
zoom.addEventListener('click',e=>{if(e.target===zoom)zoom.close()});
document.addEventListener('click',e=>{const c=e.target.closest('.card[data-cid]');if(c&&!c.closest('dialog'))openZoom(c.dataset.cid)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const c=document.activeElement;if(c&&c.matches&&c.matches('.card[data-cid]')&&!c.closest('dialog'))openZoom(c.dataset.cid)}});

/* ===== Administration (les droits sont vérifiés par le serveur) ===== */
async function admin(tab){const R=profile?.role;if(!['admin','moderator','catalog_manager'].includes(R))return app.innerHTML=msg('Accès réservé au staff.',1);
tab=tab||'stats';const T={stats:'Stats',reports:'Signalements',users:'Comptes',cards:'Catalogue',boosters:'Boosters',audit:'Audit'};
const ok={stats:1,reports:R!=='catalog_manager',users:R!=='catalog_manager',cards:R!=='moderator',boosters:R==='admin',audit:R==='admin'};
const bar=`<div class="tabs">${Object.keys(T).filter(k=>ok[k]).map(k=>`<button class="btn${k===tab?'':' alt'}" data-t="${k}">${T[k]}</button>`).join('')}</div><div id="am"></div>`;
const fail=e=>msg(e.message,1);let body='';
if(tab==='stats'){const {data,error}=await sb.rpc('admin_stats');body=error?fail(error):`<div class="box" style="max-width:none">${Object.entries(data).map(([k,v])=>`<div>${esc(k.replace(/_/g,' '))} : <b>${esc(v)}</b></div>`).join('')}</div>`}
if(tab==='reports'){const {data,error}=await sb.rpc('admin_reports');body=error?fail(error):(data.length?'':msg('Aucun signalement.'))+data.map(r=>`<div class="box" style="max-width:none;margin:10px 0"><b>${esc(r.reported)}</b> signalé par ${esc(r.reporter)} · ${esc(r.status)}<br><i>« ${esc(r.body)} »</i><br>Motif : ${esc(r.reason)}<br>${r.status==='open'?`<button class="btn" data-rs="reviewed" data-r="${r.id}">Traité</button> <button class="btn alt" data-rs="dismissed" data-r="${r.id}">Rejeter</button> <button class="btn alt" data-su="${esc(r.reported)}">Suspendre l’auteur</button>`:''}</div>`).join('')}
if(tab==='users'){body=`<div class="box" style="max-width:none"><b>Suspendre / rétablir un compte</b><input id="au" placeholder="Pseudo"><input id="ar" placeholder="Motif (obligatoire)"><button class="btn" id="asu">Suspendre</button> <button class="btn alt" id="arl">Rétablir</button></div>${R==='admin'?`<div class="box" style="max-width:none"><b>Récompense administrative (1 à 1000 💰)</b><input id="gu" placeholder="Pseudo"><input id="ga" type="number" min="1" max="1000" placeholder="Montant"><input id="gr" value="Récompense administrative" minlength="5" placeholder="Motif (5 caractères min.)"><button class="btn" id="gb">Créditer</button></div>`:''}`}
let list=[];
if(tab==='cards'){const [s,c]=await Promise.all([sb.from('series').select('id,name').order('name'),sb.from('cards').select('id,series_id,number,name,rarity,spec,anecdote,bio,status,is_fictional,rights_checked').order('name')]);list=c.data||[];
const so=(s.data||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join(''),ro=Object.entries(RN).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join(''),st=['brouillon','revision','publie','archive'].map(x=>`<option>${x}</option>`).join('');
body=`<div class="box" style="max-width:none"><b id="cft">Nouvelle carte</b><input type="hidden" id="cid"><select id="cs">${so}</select><input id="cn" type="number" placeholder="Numéro dans la série"><input id="cname" placeholder="Nom"><select id="cr">${ro}</select><input id="csp" placeholder="Spécialité humoristique"><input id="can" placeholder="Anecdote"><textarea id="cb" placeholder="Bio satirique"></textarea><select id="cst">${st}</select><label><input type="checkbox" id="cf" checked style="width:auto"> Personnage fictif</label><br><label><input type="checkbox" id="crc" style="width:auto"> Droits vérifiés (obligatoire pour publier une personne réelle)</label><br><button class="btn" id="csv">Enregistrer</button> <button class="btn alt" id="cnew">Nouvelle</button></div><table><tr><th>Nom</th><th>Rareté</th><th>Statut</th><th></th></tr>${list.map(c=>`<tr><td>${esc(c.name)}</td><td>${RN[c.rarity][0]}</td><td>${esc(c.status)}</td><td><button class="btn alt" style="min-height:34px;padding:4px 10px" data-ed="${c.id}">Modifier</button></td></tr>`).join('')}</table>`}
let bs=[];
if(tab==='boosters'){const {data,error}=await sb.from('booster_types').select('*').order('price');bs=data||[];body=(error?fail(error):'')+`<div class="box" style="max-width:none"><h2 style="margin-top:0">Offrir un booster</h2><p>Distribution administrative, sans paiement.</p><div class="settings-grid"><div><label>Pseudo du joueur</label><input id="gbuser" placeholder="Pseudo exact"></div><div><label>Type de booster</label><select id="gbslug">${bs.map(x=>`<option value="${esc(x.slug)}">${esc(x.name)}</option>`).join('')}</select></div><div><label>Quantité (1 à 20)</label><input id="gbqty" type="number" min="1" max="20" value="1"></div><div><label>Motif</label><input id="gbreason" placeholder="Ex. compensation événement"></div></div><button class="btn" id="gbgrant">Offrir le booster</button><div id="gbmsg"></div><p class="note">La distribution nécessite une fonction sécurisée côté Supabase. Si elle n’est pas déployée, le message d’erreur le signalera.</p></div>`+bs.map(b=>`<div class="box" style="max-width:none;margin:12px 0"><b>${esc(b.name)}</b> (${esc(b.slug)})<br>${Object.keys(RN).map(k=>`<label>${RN[k][0]} %<input class="o-${b.slug}" data-k="${k}" type="number" step="0.1" min="0" value="${b.odds[k]??0}"></label>`).join('')}<label>Prix 💰<input id="p-${b.slug}" type="number" min="0" value="${b.price}"></label><label>Garantie : Rare+ après N cartes<input id="g-${b.slug}" type="number" min="1" value="${b.pity_threshold}"></label><label>Délai (heures)<input id="d-${b.slug}" type="number" min="0" value="${b.cooldown_hours}"></label><label><input type="checkbox" id="a-${b.slug}" ${b.active?'checked':''} style="width:auto"> Actif</label><br><button class="btn" data-sb="${b.slug}">Enregistrer</button></div>`).join('')}
if(tab==='audit'){const {data,error}=await sb.from('audit_log').select('*').order('id',{ascending:false}).limit(100);body=error?fail(error):`<table><tr><th>Date</th><th>Action</th><th>Détails</th></tr>${(data||[]).map(a=>`<tr><td>${new Date(a.created_at).toLocaleString('fr-FR')}</td><td>${esc(a.action)}</td><td><small>${esc(JSON.stringify(a.details))}</small></td></tr>`).join('')}</table>`}
app.innerHTML=`<h1>Administration</h1>${bar}${body}`;
const say=(e,t)=>{$('am').innerHTML=e?msg(e.message,1):msg(t)};
app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>admin(b.dataset.t));
app.querySelectorAll('[data-rs]').forEach(b=>b.onclick=async()=>{const {error}=await sb.rpc('admin_resolve_report',{p_report:b.dataset.r,p_status:b.dataset.rs});error?say(error):admin('reports')});
app.querySelectorAll('[data-su]').forEach(b=>b.onclick=async()=>{const r=prompt('Motif de la suspension de '+b.dataset.su+' ?');if(!r)return;const {error}=await sb.rpc('admin_set_suspension',{p_username:b.dataset.su,p_suspend:true,p_reason:r});say(error,'Compte suspendu.')});
const susp=v=>async()=>{const {error}=await sb.rpc('admin_set_suspension',{p_username:$('au').value.trim(),p_suspend:v,p_reason:$('ar').value});say(error,v?'Compte suspendu.':'Compte rétabli.')};
if($('asu')){$('asu').onclick=susp(true);$('arl').onclick=susp(false)}
if($('gb'))$('gb').onclick=async()=>{const username=$('gu').value.trim(),amount=+$('ga').value,reason=$('gr').value.trim()||'Récompense administrative';if(!username||!Number.isInteger(amount)||amount<1||amount>1000||reason.length<5){say({message:'Indique un pseudo, un montant de 1 à 1000 et un motif de 5 caractères minimum.'});return}const {error}=await sb.rpc('admin_grant_coins',{p_username:username,p_amount:amount,p_reason:reason});if(error)say({message:error.message==='unknown user'?'Pseudo introuvable. Vérifie l’orthographe exacte.':error.message});else say(null,'Monnaie créditée.')};
if($('csv')){$('csv').onclick=async()=>{const d={series_id:$('cs').value,number:+$('cn').value,name:$('cname').value,rarity:$('cr').value,spec:$('csp').value,anecdote:$('can').value,bio:$('cb').value,status:$('cst').value,is_fictional:$('cf').checked,rights_checked:$('crc').checked};
const {error}=await sb.rpc('admin_upsert_card',{p_id:$('cid').value||null,p_data:d});if(error)say(error);else{cards=[];await loadCards();admin('cards')}};
$('cnew').onclick=()=>admin('cards');
app.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{const c=list.find(x=>x.id===b.dataset.ed);$('cft').textContent='Modifier : '+c.name;$('cid').value=c.id;$('cs').value=c.series_id;$('cn').value=c.number;$('cname').value=c.name;$('cr').value=c.rarity;$('csp').value=c.spec||'';$('can').value=c.anecdote||'';$('cb').value=c.bio||'';$('cst').value=c.status;$('cf').checked=c.is_fictional;$('crc').checked=c.rights_checked;scrollTo(0,0)})}
app.querySelectorAll('[data-sb]').forEach(b=>b.onclick=async()=>{const s=b.dataset.sb,o={};document.querySelectorAll('.o-'+s).forEach(i=>o[i.dataset.k]=+i.value);
const {error}=await sb.rpc('admin_set_booster',{p_slug:s,p_odds:o,p_price:+$('p-'+s).value,p_pity:+$('g-'+s).value,p_cooldown:+$('d-'+s).value,p_active:$('a-'+s).checked});say(error,'Booster mis à jour.')});
if($('gbgrant'))$('gbgrant').onclick=async()=>{const b=$('gbgrant'),username=$('gbuser').value.trim(),slug=$('gbslug').value,qty=+$('gbqty').value,reason=$('gbreason').value.trim();if(!username||!reason||qty<1||qty>20){$('gbmsg').innerHTML=msg('Indique un pseudo, un motif et une quantité de 1 à 20.',1);return}b.disabled=true;const {error}=await sb.rpc('admin_grant_booster',{p_username:username,p_slug:slug,p_quantity:qty,p_reason:reason});b.disabled=false;$('gbmsg').innerHTML=error?msg(error.message==='unknown user'?'Pseudo introuvable. Vérifie le pseudo exact.':error.message,1):msg('Booster(s) distribué(s).');};}
go('booster');
</script></body></html>
