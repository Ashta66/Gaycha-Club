<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAYCHA CLUB — Phase 2</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:dark;--bg:#101010;--ch:#1D1D20;--gold:#D6B46A;--cream:#F4EBDD;--mut:#a9a39a;--rb:linear-gradient(90deg,#FF477E,#FF8A00,#FFDA45,#8CCF35,#00A9A5,#3867FF,#C9A7FF)}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 85% -10%,#D6B46A22,transparent 60%),radial-gradient(700px 500px at -10% 35%,#FF477E14,transparent 60%),radial-gradient(600px 400px at 60% 110%,#00A9A514,transparent 60%),var(--bg);background-attachment:fixed;color:var(--cream);font:16px/1.5 Fraunces,Georgia,serif}
h1,h2,.logo{font-family:Anton,Impact,sans-serif;font-weight:400;margin:0;letter-spacing:.02em}
h1{font-size:clamp(36px,6vw,60px);line-height:1.05}h2{font-size:30px;margin:26px 0 8px}
main>h1::after,.rbar{content:"";display:block;height:4px;width:110px;margin-top:8px;border-radius:2px;background:var(--rb)}
button{font:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:10;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 20px 15px;background:#1D1D20ee;backdrop-filter:blur(8px)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rb);background-size:200% 100%;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:200% 0}}
.logo{font-size:28px;color:var(--gold);line-height:1;text-shadow:0 0 18px #D6B46A44}.logo small{font:600 10px Fraunces;letter-spacing:.5em;display:block;color:var(--cream)}.logo-home{border:0;background:transparent;padding:0;cursor:pointer;text-align:left;flex:0 0 auto}.logo-home:hover{filter:brightness(1.18)}
header nav{display:flex;gap:6px;flex-wrap:wrap}header nav .btn{padding:8px 14px;min-height:40px;font-size:14px}
header .me{margin-left:auto;color:var(--mut);font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
main{max-width:1100px;margin:0 auto;padding:30px 20px 60px}
.hero{padding:14px 0 10px}.hero p{color:var(--mut);margin:8px 0 12px}
.btn{background:linear-gradient(180deg,#e8cb86,#D6B46A);color:#101010;border:0;border-radius:8px;padding:12px 20px;font-weight:600;min-height:46px;transition:transform .15s,box-shadow .15s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 20px #D6B46A44}
.btn.alt{background:#ffffff08;color:var(--cream);border:1px solid #D6B46A99}
.btn.alt:hover:not(:disabled){border:1px solid transparent;background:linear-gradient(#1D1D20,#1D1D20) padding-box,var(--rb) border-box;box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
input,select,textarea{background:#101010;color:var(--cream);border:1px solid #4a4233;border-radius:8px;padding:10px 12px;min-height:44px;font:inherit;width:100%;margin:6px 0}
.box{position:relative;overflow:hidden;max-width:420px;background:#1D1D20;border:1px solid #3a3326;border-radius:12px;padding:22px;margin:20px auto}
.box::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--rb);opacity:.9}
.note{background:var(--ch);border-left:4px solid #FF477E;padding:12px 16px;border-radius:0 8px 8px 0;color:var(--mut);margin:14px 0}
.err{border-color:#ff5555;color:#ffb4b4}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.section-shortcuts{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 20px;padding:0 0 14px;border-bottom:1px solid #ffffff18}.section-shortcuts .btn{min-height:36px;padding:7px 12px;font-size:13px;border-radius:999px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #333;text-align:left;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px;margin-top:18px}
/* ===== Cartes ===== */
.card{--s1:#FF477E;--s2:#c4204f;--r:#8a95a3;position:relative;aspect-ratio:5/7;border-radius:14px;background:#0b0b0c;border:3px solid var(--r);padding:6px;display:flex;flex-direction:column;overflow:hidden;color:#fff;width:100%;container-type:inline-size;cursor:pointer;text-align:left;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px) scale(1.02)}
.band{background:linear-gradient(90deg,var(--s1),var(--s2));color:#101010;font-family:Anton,sans-serif;font-size:max(9px,6.2cqw);letter-spacing:.12em;padding:.8cqw 2.6cqw;border-radius:4px;display:flex;justify-content:space-between}
.art{position:relative;overflow:hidden;flex:1;margin:6px 0;border-radius:6px;background:radial-gradient(circle at 50% 35%,var(--s1) 0,transparent 58%),linear-gradient(160deg,#26262b,#0b0b0c);display:grid;place-items:center}
.art::before{content:"";position:absolute;inset:0;background:radial-gradient(#ffffff26 1px,transparent 1.6px) 0 0/8px 8px;mix-blend-mode:overlay}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.card-illustration{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#ffffff18,transparent 38%),linear-gradient(145deg,#ffffff08,transparent 45%);overflow:hidden}.card-illustration::before,.card-illustration::after{content:"";position:absolute;width:68%;aspect-ratio:1;border:1px solid #ffffff28;border-radius:50%;transform:rotate(-24deg)}.card-illustration::after{width:88%;border-color:var(--s1);opacity:.55;transform:rotate(35deg) scaleY(.45)}.card-illustration span{position:relative;z-index:1;font-size:27cqw;filter:drop-shadow(0 8px 10px #0009);transform:rotate(-7deg)}.card-illustration i{z-index:2;left:0;right:0;text-align:center;letter-spacing:.35em;font-size:max(6px,3.4cqw);opacity:.7}.art:has(img) b,.art:has(img) i{display:none}.art:has(img)::before{z-index:1;background:linear-gradient(180deg,#0001 50%,#0009);mix-blend-mode:normal}.art b{font-family:Anton,sans-serif;font-weight:400;font-size:40cqw;line-height:1;background:linear-gradient(180deg,#fff,#ffffffaa);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #0009)}
.art i{position:absolute;bottom:4px;left:6px;font-style:normal;font-size:max(7px,4cqw);opacity:.55}
.nm{font-family:Anton,sans-serif;font-size:max(11px,9cqw);letter-spacing:.03em}
.spec{font-size:max(8.5px,5.4cqw);line-height:1.25;color:#d8d2c8}
.meta{display:flex;justify-content:space-between;font-size:max(8.5px,5.2cqw);margin-top:2px}.rar{color:var(--r);font-weight:600}
.x{position:absolute;top:8.5cqw;right:2cqw;background:var(--gold);color:#101010;border-radius:10px;font:600 max(10px,5cqw) Fraunces;padding:1px 8px;z-index:2}
.r-peu_commun{--r:#2fa57a;background-image:repeating-linear-gradient(45deg,#ffffff06 0 6px,transparent 6px 12px)}
.r-rare{--r:#3867FF;box-shadow:0 0 16px #3867FF66,inset 0 0 0 1px #9bb0ff}
.r-epique{--r:#e03bd0;box-shadow:0 0 20px #e03bd088}
.r-legendaire{--r:#D6B46A;box-shadow:0 0 24px #D6B46A99,inset 0 0 0 2px #7a5f22}
.r-secrete{--r:#fff;border-color:transparent;background:linear-gradient(#0b0b0c,#0b0b0c) padding-box,conic-gradient(from var(--a),#ff477e,#ffda45,#8ccf35,#00a9a5,#3867ff,#c9a7ff,#ff477e) border-box;animation:spin 6s linear infinite;box-shadow:0 0 22px #c9a7ff55}
@keyframes spin{to{--a:360deg}}
.r-epique::after,.r-legendaire::after,.r-secrete::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,#ffffff40 48%,transparent 60%);background-size:250% 100%;background-position:150% 0;animation:sh 3.5s infinite}
.r-secrete::after{background-image:linear-gradient(115deg,#ff477e44,#ffda4444,#00a9a544,#3867ff44,#c9a7ff44,transparent);animation-direction:alternate;animation-duration:2.5s}
@keyframes sh{to{background-position:-50% 0}}
/* Ouverture de booster */
.fl{aspect-ratio:5/7;perspective:900px}.fi{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s}.fl.on .fi{transform:rotateY(180deg)}
.fb,.ff{position:absolute;inset:0;backface-visibility:hidden}.ff{transform:rotateY(180deg)}.ff .card{height:100%}.fl .card:hover{transform:none}
.fl.hi.on{animation:pop .9s}@keyframes pop{30%{filter:brightness(2) drop-shadow(0 0 26px #FFDA45);transform:scale(1.08)}}
.back{display:grid;place-items:center;border:3px solid var(--gold);background:repeating-conic-gradient(#ff477e18 0 15deg,#3867ff18 0 30deg),#0b0b0c}
.sealed{width:200px;aspect-ratio:5/8;margin:20px auto;background:linear-gradient(160deg,#2a2418,#0b0b0c);border:3px solid var(--gold);border-radius:10px;display:grid;place-content:center;text-align:center;animation:shk .5s 2;box-shadow:0 0 30px #D6B46A55}
@keyframes shk{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
/* Vue en grand */
dialog{position:relative;background:var(--ch);color:var(--cream);border:0;border-radius:16px;padding:26px;max-width:860px;width:94vw}
dialog::backdrop{background:#000d;backdrop-filter:blur(4px)}
dialog::before{content:"";position:absolute;inset:0;border-radius:16px;padding:2px;background:var(--rb);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.zw{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:28px;align-items:center}
@media(max-width:640px){.zw{grid-template-columns:1fr}.zc{max-width:300px;margin:0 auto}}
.zc{position:relative;transition:transform .12s;will-change:transform}.zc .card:hover{transform:none}
.glare{position:absolute;inset:0;border-radius:14px;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,25%),#ffffff55,transparent 45%);mix-blend-mode:overlay}
.zx{position:absolute;top:12px;right:12px;z-index:2;min-height:40px;padding:6px 14px}
.zi h2{margin-top:0}
@media(prefers-reduced-motion:reduce){header::after,.r-secrete,.r-epique::after,.r-legendaire::after,.r-secrete::after,.sealed,.fl.hi.on{animation:none}.fi,.card,.btn,.zc{transition:none}.card:hover{transform:none}}

.cards-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px}.admin-view-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:20px 0 8px}.admin-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin:12px 0 24px}.admin-card-tile{cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:10px;gap:10px}.admin-card-real{width:100%;max-width:245px}.admin-card-real .card{cursor:pointer;box-shadow:0 12px 24px #0008}.admin-card-info{width:100%;align-self:stretch}.admin-image-preview{margin:10px 0;padding:8px;border:1px solid #d6b46a55;border-radius:12px;display:flex;gap:12px;align-items:center;background:#111}.admin-image-preview img{width:90px;height:120px;object-fit:cover;border-radius:8px}.admin-image-preview span{font-size:12px;color:var(--mut)}.admin-card-preview-card{width:100%;max-width:340px;margin:0 auto}.admin-card-preview-card .card{cursor:default;box-shadow:0 18px 38px #0009}.admin-card-preview-card .card:hover{transform:none}.admin-card-tile:focus-within,.admin-card-tile:hover{outline:2px solid #d6b46a88;outline-offset:2px}.admin-card-art img{cursor:zoom-in}.admin-card-large-preview{width:100%;max-width:360px;aspect-ratio:3/4;object-fit:cover;border-radius:14px;border:1px solid #d6b46a88;background:#101014}.admin-edit-layout{display:grid;grid-template-columns:minmax(220px,340px) minmax(0,1fr);gap:22px;align-items:start}.admin-edit-layout .box{max-width:none!important;margin:0!important}.admin-edit-layout .admin-edit-preview{position:sticky;top:16px;text-align:center}.admin-edit-preview h3{margin:0 0 12px}.admin-edit-preview .note{overflow-wrap:anywhere}@media(max-width:700px){.admin-edit-layout{grid-template-columns:1fr}.admin-edit-layout .admin-edit-preview{position:static}.admin-card-large-preview{max-width:100%;max-height:55vh}}.admin-card-tile{overflow:hidden;border:1px solid #d6b46a55;border-radius:13px;background:#151518;box-shadow:0 8px 20px #0004}.admin-card-art{height:190px;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#d6b46a22,transparent 60%),#0b0b0c}.admin-card-art img{width:100%;height:100%;object-fit:cover;display:block}.admin-card-placeholder{font-size:64px;color:#d6b46a}.admin-card-info{display:grid;gap:6px;padding:12px}.admin-card-info>span{font-size:12px;color:var(--mut)}.admin-status{display:inline-block!important;width:max-content;border:1px solid #d6b46a55;border-radius:999px;padding:3px 8px;color:#f0d28d!important}.admin-card-info .btn{margin-top:4px}.admin-card-list[hidden]{display:none}
@media(max-width:560px){.cards-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
body::before{content:"";position:fixed;z-index:-1;inset:0;pointer-events:none;background:linear-gradient(125deg,#ff477e08,#ff8a0005,#ffda4508,#8ccf3505,#00a9a508,#3867ff08,#c9a7ff08);background-size:250% 250%;animation:pride-drift 22s ease infinite}
@keyframes pride-drift{50%{background-position:100% 100%}}
body:not([data-pride])::before{background:linear-gradient(135deg,#d6b46a12,transparent 48%,#c9a7ff08);background-size:100% 100%;animation:none}
.rainbow-line{height:4px;border-radius:99px;background:var(--rb);margin:12px 0 18px;box-shadow:0 0 18px #c9a7ff25}
.trade-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.trade-side{padding:14px;border:1px solid #ffffff20;border-radius:14px;background:linear-gradient(145deg,#ffffff08,#ffffff02);min-width:0}
.trade-side.give{border-top:3px solid #00a9a5}.trade-side.get{border-top:3px solid #ff477e}
.trade-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:10px}
.trade-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin:12px 0}
.trade-tools{display:grid;grid-template-columns:minmax(130px,2fr) repeat(2,minmax(110px,1fr));gap:8px;margin:12px 0}.trade-tools input,.trade-tools select{width:100%;min-width:0;background:#101010;color:#F4EBDD;border:1px solid #ffffff2a;border-radius:8px;padding:9px}.trade-pagination{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0}.trade-pagination button{padding:7px 12px}.trade-count{font-size:12px;color:var(--mut);text-align:center}.trade-empty{padding:16px;border:1px dashed #ffffff2a;border-radius:10px;color:var(--mut);text-align:center}@media(max-width:650px){.trade-tools{grid-template-columns:1fr 1fr}.trade-tools input{grid-column:1/-1}.trade-picker{grid-template-columns:repeat(2,minmax(0,1fr))}}.trade-card-option{background:transparent;border:1px solid #ffffff1c;border-radius:10px;padding:5px;cursor:pointer;text-align:left;min-width:0}.trade-card-option .card{width:100%;margin:0}.trade-card-option.selected{border:2px solid #00a9a5;box-shadow:0 0 16px #00a9a544}.trade-side.get .trade-card-option.selected{border-color:#ff477e;box-shadow:0 0 16px #ff477e44}.trade-card-option:not(.selected){opacity:.82}.trade-card-option:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.booster-choice.cooldown{filter:grayscale(1);opacity:.48;border-color:#555;cursor:not-allowed;box-shadow:none}.booster-choice.cooldown:hover{transform:none;box-shadow:none}
.mission-card{max-width:none;margin:12px 0;border:1px solid #ffffff1c;background:linear-gradient(135deg,#1d1d20,#211923);transition:border-color .2s,transform .2s}
.mission-card.done{border-color:#35d39a88;background:linear-gradient(120deg,#102e27,#1d1d20 70%);box-shadow:inset 4px 0 #35d39a,0 0 20px #35d39a12}
.mission-card.ready{border-color:#d6b46a99;box-shadow:inset 4px 0 #d6b46a}
.mission-top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.mission-status{font:600 12px Fraunces;border-radius:999px;padding:5px 9px;background:#ffffff12;color:var(--mut)}
.done .mission-status{background:#35d39a20;color:#6ef0b9}.ready .mission-status{background:#d6b46a20;color:#f0d28d}
.progress-track{height:9px;background:#ffffff12;border-radius:99px;overflow:hidden;margin:12px 0 5px}
.progress-fill{height:100%;width:var(--progress);background:var(--rb);border-radius:99px;transition:width .5s}
.done .progress-fill{background:linear-gradient(90deg,#168b63,#4be3a9)}
.leaderboard-list{display:grid;gap:10px;margin-top:20px}
.leader-row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:14px 16px;border:1px solid #ffffff18;border-radius:14px;background:#ffffff06}
.leader-row.top-1{background:linear-gradient(100deg,#d6b46a24,#ff477e10,#ffffff05);border-color:#d6b46a88}
.leader-row.top-2{border-color:#c6d4e688}.leader-row.top-3{border-color:#c58c6588}
.leader-rank{font:30px Anton,sans-serif;text-align:center;color:#d6b46a}
.leader-avatar{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--rb);color:#101010;font:20px Anton,sans-serif;margin-right:10px;vertical-align:middle}
.leader-metrics{display:flex;gap:8px;flex-wrap:wrap;color:var(--mut);font-size:13px}
.profile-trigger{border:1px solid #ffffff22;background:#ffffff08;color:var(--cream);border-radius:999px;padding:8px 12px;cursor:pointer}
.profile-trigger:hover{border-color:#ff477e;box-shadow:0 0 16px #ff477e33}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.setting-item{padding:12px;border:1px solid #ffffff18;border-radius:10px;background:#ffffff05}

body[data-pride="soft"]::before{opacity:.25}body[data-pride="max"]::before{opacity:1;animation-duration:7s}
body.reduced-motion *,body.reduced-motion *::before,body.reduced-motion *::after{animation:none!important;transition:none!important}

.chat-feed{background:#10101280;border-radius:14px;min-height:180px}

function applyLanguage(root=document.body){document.documentElement.lang=currentLanguage;const map=UI_TRANSLATIONS[currentLanguage]||{};const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),a=[];while(w.nextNode()){const n=w.currentNode;if(n.parentElement&&!n.parentElement.closest('script,style'))a.push(n)}const keys=Object.keys(map).sort((x,y)=>y.length-x.length);for(const n of a){if(n.__gaychaSource===undefined)n.__gaychaSource=n.nodeValue;let v=n.__gaychaSource;for(const k of keys)if(v.includes(k))v=v.split(k).join(map[k]);if(n.nodeValue!==v)n.nodeValue=v}root.querySelectorAll?.('input[placeholder],textarea[placeholder],button[aria-label],input[aria-label],select[aria-label]').forEach(el=>{for(const attr of ['placeholder','aria-label'])if(el.hasAttribute(attr)){const prop='__gaycha_'+attr;if(el[prop]===undefined)el[prop]=el.getAttribute(attr);let v=el[prop];for(const k of keys)if(v.includes(k))v=v.split(k).join(map[k]);el.setAttribute(attr,v)}})}

slug,'paid')}
async function buySelectedBooster(slug){const btn=$('buy-selected'),notice=$('booster-detail-msg');if(!btn||busy)return;btn.disabled=true;const {error}=await sb.rpc('buy_booster',{p_slug:slug,p_key:crypto.randomUUID()});btn.disabled=false;if(error){notice.innerHTML=msg(error.message==='cooldown active'?'Tu as déjà récupéré ce booster récemment. Réessaie plus tard.':error.message,1);return}await refresh();await loadBoosterInventory();showBoosterDetails(slug);const n=$('booster-notice');if(n)n.innerHTML=msg('Booster ajouté à ta réserve. Tu peux l’ouvrir quand tu veux.')}
async function open5(slug,source='paid'){if(busy)return;busy=true;const buttons=[...document.querySelectorAll('[data-b],[data-open-gift],[data-open-paid],#buy-selected')];buttons.forEach(b=>b.disabled=true);const pk=$('pk');pk.innerHTML='<div class="sealed" style="grid-column:1/-1;justify-self:center"><div class="logo">GAYCHA<small>CLUB</small></div></div>';

async function stats(){

 if(error)return app.innerHTML=msg(error.message,1);

 const owned=cards.filter(c=>cnt[c.id]),unique=owned.length,duplicates=inst.length-unique;
 const rarity=Object.keys(RN).map(k=>({name:RN[k][0],n:owned.filter(c=>c.rarity===k).length})).filter(x=>x.n);

 const valueMap={};for(const c of owned){const duplicatesN=Math.max(0,(cnt[c.id]||1)-1);valueMap[c.id]=duplicatesN}
 const bar=(arr,max)=>arr.map(x=>`<div class="stat-row"><span>${esc(x.name)}</span><div class="stat-track"><div class="stat-fill" style="width:${Math.max(2,100*x.n/Math.max(1,max))}%"></div></div><b>${x.n}</b></div>`).join('');
 app.innerHTML=`<h1>Mes statistiques</h1><p>Une vue détaillée de ta progression, basée sur les cartes réellement présentes dans ton inventaire.</p><div class="rainbow-line"></div>

 <div class="section-panel"><h2 style="margin-top:0">Séries les plus représentées</h2><div class="stat-bars">${bar(series.slice(0,12).map(x=>({name:x[0],n:x[1]})),Math.max(1,...series.map(x=>x[1])))||'Aucune série découverte.'}</div></div>
 <div class="section-panel"><h2 style="margin-top:0">Chronologie d’acquisition</h2>${Object.keys(timeline).length?`<div class="stat-bars">${bar(Object.entries(timeline).sort((a,b)=>a[0].localeCompare(b[0])).map(([name,n])=>({name,n})),Math.max(...Object.values(timeline)))}</div>`:'Aucune date d’acquisition enregistrée.'}</div>
 <div class="section-panel"><h2 style="margin-top:0">Valeur de collection</h2><p>La valeur marchande n’est pas estimée : le site ne dispose pas d’un cours fiable par carte. À la place, voici les indicateurs calculables.</p><div class="dashboard-grid"><div class="dash-tile">Doublons échangeables<strong>${duplicates}</strong><small>hors cartes verrouillées</small></div><div class="dash-tile">Rareté maximale<strong>${owned.length?esc(RN[[...owned].sort((a,b)=>Object.keys(RN).indexOf(b.rarity)-Object.keys(RN).indexOf(a.rarity))[0].rarity][0]):'—'}</strong><small>selon le catalogue</small></div></div></div>
 <div class="tabs"><button class="btn alt" data-go="collection">Retour à ma collection</button><button class="btn" data-go="dashboard">Tableau de bord</button></div>`;

 if(tab==='assistant'){body=`<div class="box ai-card-assistant" style="max-width:none"><h2 style="margin-top:0">✨ Assistant IA de cartes</h2><p>Décris une idée ou les changements souhaités. L’IA prépare un brouillon à relire ; aucune carte n’est publiée automatiquement.</p><label>Action</label><select id="ai-mode"><option value="create">Créer une nouvelle carte</option><option value="edit">Modifier une carte existante</option></select><label>Carte à modifier</label><select id="ai-existing"><option value="">Choisir une carte…</option>${list.map(c=>`<option value="${c.id}">${esc(c.name)} · ${esc(c.status)}</option>`).join('')}</select><label>Consigne créative</label><textarea id="ai-prompt" rows="4" maxlength="1800" placeholder="Décris les cartes à créer ou les modifications souhaitées…"></textarea><label>Ton selon la série</label><select id="ai-style"><option value="auto">Adapté à la série</option><option value="satire">Satire piquante</option><option value="absurde">Absurde</option><option value="pop">Pop culture / glamour</option><option value="retro">Rétro</option><option value="fantasy">Fantasy / épique</option></select><label>Nombre de cartes</label><select id="ai-count"><option value="1">1 carte</option><option value="10" selected>10 cartes</option></select><button class="btn" id="ai-generate">Générer les brouillons</button> <button class="btn alt" id="ai-clear">Effacer</button><button class="btn alt" id="ai-illustrate">Créer une illustration IA</button><p class="note">Les cartes générées restent en brouillon. Relecture et validation manuelles avant publication.</p><div id="ai-status" aria-live="polite"></div><div id="ai-batch"></div></div><div class="box" style="max-width:none"><h3>Historique des versions</h3><div id="ai-versions">Chargement…</div></div><div class="box" style="max-width:none"><h3>Validation avant publication</h3><p>Le passage en « revision » sert à la relecture. La publication nécessite une confirmation.</p><div id="ai-review">Chargement…</div></div>`+body}

if(tab==='venues'){
 const {data,error}=await sb.from('cards').select('id,name,number,status,image_path,rights_checked,series(name),venue_sources(card_id,venue_type,city,country,official_url,description_source_url,image_source_url,image_license,verification_status,last_verified_at,notes)').eq('is_fictional',false).order('name');
 const rows=(data||[]).map(c=>{const v=Array.isArray(c.venue_sources)?c.venue_sources[0]:c.venue_sources||{};const city=v.city||'Ville à renseigner';const country=v.country||'';const state=v.verification_status||'à vérifier';return `<details class="venue-admin-item" data-venue-search-row="${esc([c.name,city,country,c.series?.name||'',state,c.status||''].join(' ').toLowerCase())}" style="margin:7px 0;border:1px solid var(--line,#ddd);border-radius:10px;padding:0 12px"><summary style="cursor:pointer;display:flex;align-items:center;gap:8px;min-height:48px;list-style-position:inside"><strong style="flex:1">${esc(c.name)}</strong><span class="note">${esc(city)}${country?' · '+esc(country):''}</span><span class="note">${esc(state)}</span></summary><form class="venue-admin-form" data-venue-card="${c.id}" style="padding:12px 0"><p class="note">${esc(c.series?.name||'Série')} · carte ${esc(c.status)} · cette fiche ne sera pas publiée par ce formulaire</p><div class="settings-grid"><div><label>Type de lieu</label><select name="venue_type">${[['bar','Bar gay / LGBTQ+'],['discotheque','Discothèque gay / LGBTQ+'],['sauna','Sauna gay']].map(([k,l])=>`<option value="${k}" ${v.venue_type===k?'selected':''}>${l}</option>`).join('')}</select></div><div><label>Ville</label><input name="city" required value="${esc(v.city||'')}" placeholder="Ville"></div><div><label>Pays</label><input name="country" required value="${esc(v.country||'')}" placeholder="France / Espagne"></div><div><label>Site officiel</label><input name="official_url" type="url" value="${esc(v.official_url||'')}" placeholder="https://…"></div><div><label>Source de description</label><input name="description_source_url" type="url" value="${esc(v.description_source_url||'')}" placeholder="Page source vérifiée"></div><div><label>Source originale de la photo</label><input name="image_source_url" type="url" value="${esc(v.image_source_url||'')}" placeholder="URL de la photo originale"></div><div><label>Licence / autorisation image</label><input name="image_license" value="${esc(v.image_license||'à vérifier')}" placeholder="Autorisation, CC BY…"></div><div><label>État de vérification</label><select name="verification_status">${[['à vérifier','À vérifier'],['vérifié','Vérifié'],['fermé','Fermé'],['en attente de droits','En attente de droits']].map(([k,l])=>`<option value="${k}" ${(v.verification_status||'à vérifier')===k?'selected':''}>${l}</option>`).join('')}</select></div><div><label>Visuel de la carte (URL ou chemin Storage)</label><input name="image_path" value="${esc(c.image_path||'')}" placeholder="URL directe autorisée ou chemin Storage"></div></div><label>Notes éditoriales</label><textarea name="notes" rows="2" placeholder="Date de vérification, accord reçu, points à confirmer…">${esc(v.notes||'')}</textarea><label><input type="checkbox" name="rights_checked" ${c.rights_checked?'checked':''} style="width:auto"> Droits du visuel vérifiés</label><p class="note">Ne coche cette case qu'après confirmation réelle des droits. Les photos provenant d'un site officiel ne sont pas automatiquement libres de réutilisation.</p><button class="btn" type="submit">Enregistrer les sources</button> <span class="venue-save-status" aria-live="polite"></span></form></details>`}).join('');
 body=(error?fail(error):'')+`<div class="box" style="max-width:none;margin:8px 0;padding:12px"><label for="venue-admin-search">Rechercher un lieu</label><input id="venue-admin-search" type="search" placeholder="Nom, ville, pays, série ou état de vérification…" autocomplete="off"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px"><span id="venue-admin-count" class="note">${(data||[]).length} lieu(x)</span><button class="btn alt" type="button" id="venue-admin-collapse">Tout replier</button><button class="btn alt" type="button" id="venue-admin-expand">Tout déplier</button></div></div><p class="note">Les fiches restent en brouillon jusqu'à validation. Les résultats sont compacts : ouvre uniquement le lieu à modifier. Les modifications des sources n'entraînent pas la publication automatique d'une carte.</p><div id="venue-admin-list">${rows||msg('Aucune fiche de lieu trouvée.')}</div>`;
}

 const table=app.querySelector('table');if(table){table.id='admin-card-list';table.classList.add('admin-card-list');table.hidden=true;table.querySelectorAll('tr').forEach((tr,i)=>{if(i===0){const th=document.createElement('th');th.textContent='Visuel';tr.insertBefore(th,tr.firstChild)}else{const td=document.createElement('td');td.innerHTML=list[i-1]?.image_path?'<img src="'+esc(list[i-1].image_path)+'" alt="" style="width:42px;height:58px;object-fit:cover;border-radius:5px">':'—';tr.insertBefore(td,tr.firstChild)}});}
 const editor=app.querySelector('.box');if(editor){editor.after(controls,grid); }
 app.querySelectorAll('[data-admin-view]').forEach(b=>b.onclick=()=>{const showGrid=b.dataset.adminView==='grid';grid.hidden=!showGrid;if(table)table.hidden=showGrid;app.querySelectorAll('[data-admin-view]').forEach(x=>{x.classList.toggle('alt',x!==b)});});

 const openEditor=id=>{const c=list.find(x=>x.id===id);if(!c)return;const editor=app.querySelector('#cft')?.closest('.box');if(!editor)return;let holder=editor.closest('.admin-edit-layout');if(!holder){holder=document.createElement('section');holder.className='admin-edit-layout';const preview=document.createElement('div');preview.className='box admin-edit-preview';editor.before(holder);holder.append(preview,editor);editor.classList.add('admin-edit-form');editor.style.maxWidth='none';}const preview=holder.querySelector('.admin-edit-preview');preview.innerHTML='<h3>Aperçu de la carte</h3><div class="admin-card-preview-card">'+card(c,1)+'</div><p>'+esc(c.series?.name||'Série')+' · '+esc(c.status)+'</p>'+(c.venue_sources?.image_source_url?'<p><a href="'+esc(c.venue_sources.image_source_url)+'" target="_blank" rel="noopener">Source de l’image</a></p>':'')+'<p class="note">Clique sur Enregistrer pour appliquer les modifications.</p>';$('cft').textContent='Modifier : '+c.name;$('cid').value=c.id;$('cs').value=c.series_id;$('cn').value=c.number;$('cname').value=c.name;$('cr').value=c.rarity;$('csp').value=c.spec||'';$('can').value=c.anecdote||'';$('cb').value=c.bio||'';$('cst').value=c.status;$('cf').checked=c.is_fictional;$('crc').checked=c.rights_checked;$('csecret').checked=!!c.is_secret;$('cimg').value=c.image_path||'';updateCardImagePreview();scrollTo(0,0)};
 app.querySelectorAll('[data-open-card]').forEach(el=>{el.onclick=e=>{if(e.target.closest('[data-ed]'))return;openEditor(el.dataset.openCard)};el.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('[data-ed]')){e.preventDefault();openEditor(el.dataset.openCard)}}});
 app.querySelectorAll('[data-ed]').forEach(b=>b.onclick=e=>{e.stopPropagation();openEditor(b.dataset.ed)});
 $('cimg').oninput=updateCardImagePreview;$('cname').oninput=updateCardImagePreview;$('cn').oninput=updateCardImagePreview;$('cr').onchange=updateCardImagePreview;$('csp').oninput=updateCardImagePreview;
 $('cimgfile').onchange=async()=>{const file=$('cimgfile').files?.[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>5*1024*1024){app.insertAdjacentHTML('afterbegin',msg('Image refusée : PNG/JPEG/WebP, 5 Mo maximum.',1));$('cimgfile').value='';return}const path='cards/'+(user?.id||'admin')+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const {error}=await sb.storage.from('card-art').upload(path,file,{upsert:true,contentType:file.type});if(error){app.insertAdjacentHTML('afterbegin',msg('Envoi impossible : '+error.message,1));return}const {data}=sb.storage.from('card-art').getPublicUrl(path);$('cimg').value=data.publicUrl;updateCardImagePreview()};
 $('csv').onclick=async()=>{const button=$('csv');button.disabled=true;const data={series_id:$('cs').value,number:Number($('cn').value),name:$('cname').value.trim(),rarity:$('cr').value,spec:$('csp').value,anecdote:$('can').value,bio:$('cb').value,image_path:$('cimg').value.trim(),status:$('cst').value,is_fictional:$('cf').checked,rights_checked:$('crc').checked,is_secret:$('csecret').checked};const id=$('cid').value||null;if(!data.series_id||!Number.isInteger(data.number)||data.number<0||data.name.length<2){button.disabled=false;app.insertAdjacentHTML('afterbegin',msg('Renseigne une série, un numéro valide et un nom de 2 caractères minimum.',1));return}const {error}=await sb.rpc('admin_upsert_card',{p_id:id,p_data:data});button.disabled=false;if(error){app.insertAdjacentHTML('afterbegin',msg('Enregistrement impossible : '+error.message,1));return}await admin('cards');app.insertAdjacentHTML('afterbegin',msg('Carte enregistrée.'))};
