<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAYCHA CLUB — Phase 2</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:dark;--bg:#101010;--ch:#1D1D20;--gold:#D6B46A;--cream:#F4EBDD;--mut:#a9a39a;--rb:linear-gradient(90deg,#FF477E,#FF8A00,#FFDA45,#8CCF35,#00A9A5,#3867FF,#C9A7FF)}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 85% -10%,#D6B46A22,transparent 60%),radial-gradient(700px 500px at -10% 35%,#FF477E14,transparent 60%),radial-gradient(600px 400px at 60% 110%,#00A9A514,transparent 60%),var(--bg);background-attachment:fixed;color:var(--cream);font:16px/1.5 Fraunces,Georgia,serif}
h1,h2,.logo{font-family:Anton,Impact,sans-serif;font-weight:400;margin:0;letter-spacing:.02em}
h1{font-size:clamp(36px,6vw,60px);line-height:1.05}h2{font-size:30px;margin:26px 0 8px}
main>h1::after,.rbar{content:"";display:block;height:4px;width:110px;margin-top:8px;border-radius:2px;background:var(--rb)}
button{font:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:10;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 20px 15px;background:#1D1D20ee;backdrop-filter:blur(8px)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rb);background-size:200% 100%;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:200% 0}}
.logo{font-size:28px;color:var(--gold);line-height:1;text-shadow:0 0 18px #D6B46A44}.logo small{font:600 10px Fraunces;letter-spacing:.5em;display:block;color:var(--cream)}
header nav{display:flex;gap:6px;flex-wrap:wrap}header nav .btn{padding:8px 14px;min-height:40px;font-size:14px}
header .me{margin-left:auto;color:var(--mut);font-size:14px}
main{max-width:1100px;margin:0 auto;padding:30px 20px 60px}
.hero{padding:14px 0 10px}.hero p{color:var(--mut);margin:8px 0 12px}
.btn{background:linear-gradient(180deg,#e8cb86,#D6B46A);color:#101010;border:0;border-radius:8px;padding:12px 20px;font-weight:600;min-height:46px;transition:transform .15s,box-shadow .15s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 20px #D6B46A44}
.btn.alt{background:#ffffff08;color:var(--cream);border:1px solid #D6B46A99}
.btn.alt:hover:not(:disabled){border:1px solid transparent;background:linear-gradient(#1D1D20,#1D1D20) padding-box,var(--rb) border-box;box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
input,select,textarea{background:#101010;color:var(--cream);border:1px solid #4a4233;border-radius:8px;padding:10px 12px;min-height:44px;font:inherit;width:100%;margin:6px 0}
.box{position:relative;overflow:hidden;max-width:420px;background:#1D1D20;border:1px solid #3a3326;border-radius:12px;padding:22px;margin:20px auto}
.box::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--rb);opacity:.9}
.note{background:var(--ch);border-left:4px solid #FF477E;padding:12px 16px;border-radius:0 8px 8px 0;color:var(--mut);margin:14px 0}
.err{border-color:#ff5555;color:#ffb4b4}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #333;text-align:left;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px;margin-top:18px}
/* ===== Cartes ===== */
.card{--s1:#FF477E;--s2:#c4204f;--r:#8a95a3;position:relative;aspect-ratio:5/7;border-radius:14px;background:#0b0b0c;border:3px solid var(--r);padding:6px;display:flex;flex-direction:column;overflow:hidden;color:#fff;width:100%;container-type:inline-size;cursor:pointer;text-align:left;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px) scale(1.02)}
.band{background:linear-gradient(90deg,var(--s1),var(--s2));color:#101010;font-family:Anton,sans-serif;font-size:max(9px,6.2cqw);letter-spacing:.12em;padding:.8cqw 2.6cqw;border-radius:4px;display:flex;justify-content:space-between}
.art{position:relative;overflow:hidden;flex:1;margin:6px 0;border-radius:6px;background:radial-gradient(circle at 50% 35%,var(--s1) 0,transparent 58%),linear-gradient(160deg,#26262b,#0b0b0c);display:grid;place-items:center}
.art::before{content:"";position:absolute;inset:0;background:radial-gradient(#ffffff26 1px,transparent 1.6px) 0 0/8px 8px;mix-blend-mode:overlay}
.art b{font-family:Anton,sans-serif;font-weight:400;font-size:40cqw;line-height:1;background:linear-gradient(180deg,#fff,#ffffffaa);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #0009)}
.art i{position:absolute;bottom:4px;left:6px;font-style:normal;font-size:max(7px,4cqw);opacity:.55}
.nm{font-family:Anton,sans-serif;font-size:max(11px,9cqw);letter-spacing:.03em}
.spec{font-size:max(8.5px,5.4cqw);line-height:1.25;color:#d8d2c8}
.meta{display:flex;justify-content:space-between;font-size:max(8.5px,5.2cqw);margin-top:2px}.rar{color:var(--r);font-weight:600}
.x{position:absolute;top:8.5cqw;right:2cqw;background:var(--gold);color:#101010;border-radius:10px;font:600 max(10px,5cqw) Fraunces;padding:1px 8px;z-index:2}
.r-peu_commun{--r:#2fa57a;background-image:repeating-linear-gradient(45deg,#ffffff06 0 6px,transparent 6px 12px)}
.r-rare{--r:#3867FF;box-shadow:0 0 16px #3867FF66,inset 0 0 0 1px #9bb0ff}
.r-epique{--r:#e03bd0;box-shadow:0 0 20px #e03bd088}
.r-legendaire{--r:#D6B46A;box-shadow:0 0 24px #D6B46A99,inset 0 0 0 2px #7a5f22}
.r-secrete{--r:#fff;border-color:transparent;background:linear-gradient(#0b0b0c,#0b0b0c) padding-box,conic-gradient(from var(--a),#ff477e,#ffda45,#8ccf35,#00a9a5,#3867ff,#c9a7ff,#ff477e) border-box;animation:spin 6s linear infinite;box-shadow:0 0 22px #c9a7ff55}
@keyframes spin{to{--a:360deg}}
.r-epique::after,.r-legendaire::after,.r-secrete::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,#ffffff40 48%,transparent 60%);background-size:250% 100%;background-position:150% 0;animation:sh 3.5s infinite}
.r-secrete::after{background-image:linear-gradient(115deg,#ff477e44,#ffda4444,#00a9a544,#3867ff44,#c9a7ff44,transparent);animation-direction:alternate;animation-duration:2.5s}
@keyframes sh{to{background-position:-50% 0}}
/* Ouverture de booster */
.fl{aspect-ratio:5/7;perspective:900px}.fi{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s}.fl.on .fi{transform:rotateY(180deg)}
.fb,.ff{position:absolute;inset:0;backface-visibility:hidden}.ff{transform:rotateY(180deg)}.ff .card{height:100%}.fl .card:hover{transform:none}
.fl.hi.on{animation:pop .9s}@keyframes pop{30%{filter:brightness(2) drop-shadow(0 0 26px #FFDA45);transform:scale(1.08)}}
.back{display:grid;place-items:center;border:3px solid var(--gold);background:repeating-conic-gradient(#ff477e18 0 15deg,#3867ff18 0 30deg),#0b0b0c}
.sealed{width:200px;aspect-ratio:5/8;margin:20px auto;background:linear-gradient(160deg,#2a2418,#0b0b0c);border:3px solid var(--gold);border-radius:10px;display:grid;place-content:center;text-align:center;animation:shk .5s 2;box-shadow:0 0 30px #D6B46A55}
@keyframes shk{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
/* Vue en grand */
dialog{position:relative;background:var(--ch);color:var(--cream);border:0;border-radius:16px;padding:26px;max-width:860px;width:94vw}
dialog::backdrop{background:#000d;backdrop-filter:blur(4px)}
dialog::before{content:"";position:absolute;inset:0;border-radius:16px;padding:2px;background:var(--rb);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.zw{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:28px;align-items:center}
@media(max-width:640px){.zw{grid-template-columns:1fr}.zc{max-width:300px;margin:0 auto}}
.zc{position:relative;transition:transform .12s;will-change:transform}.zc .card:hover{transform:none}
.glare{position:absolute;inset:0;border-radius:14px;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,25%),#ffffff55,transparent 45%);mix-blend-mode:overlay}
.zx{position:absolute;top:12px;right:12px;z-index:2;min-height:40px;padding:6px 14px}
.zi h2{margin-top:0}
@media(prefers-reduced-motion:reduce){header::after,.r-secrete,.r-epique::after,.r-legendaire::after,.r-secrete::after,.sealed,.fl.hi.on{animation:none}.fi,.card,.btn,.zc{transition:none}.card:hover{transform:none}}

/* Phase 2 — tactile, editorial, less synthetic */
:root{--bg:#111014;--ch:#1d1a20;--cream:#f6eee5;--mut:#b8aeb6;--gold:#e8bf72;--pink:#e86b9b;--blue:#7886a8;--cyan:#a7d8cf}
main h1{letter-spacing:-.025em}
.hero{background:linear-gradient(115deg,#25202a,#17171d 72%);border-color:#ffffff19;box-shadow:0 14px 36px #0003}
.card{box-shadow:0 8px 18px #0005;transition:transform .18s,border-color .18s}
.card:hover{transform:translateY(-3px) rotate(-.25deg);box-shadow:0 12px 24px #0006;filter:none}
.r-epique,.r-legendaire,.r-secrete{animation:none}
.btn{box-shadow:none}
.btn:hover{box-shadow:0 4px 0 #0003;transform:translateY(-1px)}
.btn.alt{border-color:#6b5d65;background:#ffffff04}
header{background:#17151bea;box-shadow:0 5px 20px #0003}
.nav-more{display:contents}.nav-more-toggle{display:none}
.auth-box{max-width:480px;padding:clamp(22px,4vw,34px)}
.auth-box h2{margin:5px 0 4px}.auth-intro,.auth-footnote,.account-note{color:var(--mut)}
.auth-box label{display:block;margin-top:10px;color:var(--cream);font-weight:600;font-size:14px}
.auth-box label span{color:var(--mut);font-weight:400}
.auth-box input{margin:5px 0 0}
.auth-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:18px 0 16px;background:#f6eee5;color:#22202a}
.google-mark{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#fff;color:#4285f4;font:800 17px Arial,sans-serif}
.auth-divider{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:12px;margin:12px 0}
.auth-divider:before,.auth-divider:after{content:"";height:1px;background:#ffffff20;flex:1}
.auth-footnote,.account-note{font-size:12px;margin-top:16px}
.account-box{margin-top:18px}
.trade-estimate{padding:10px 12px;border-radius:10px;background:#ffffff08;color:var(--cream)!important;font-size:14px}
.trade-warning{padding:10px 12px;border-left:3px solid #e8bf72;background:#e8bf7212;color:#f3dba8!important;border-radius:0 8px 8px 0;font-size:14px}
@media(max-width:680px){
 body{padding-bottom:82px}
 header{position:relative;top:auto;padding:12px 14px;gap:10px}
 header .logo{font-size:25px}
 header .me{margin-left:auto;font-size:12px;max-width:58%;text-align:right}
 header nav{position:fixed;z-index:100;left:0;right:0;bottom:0;top:auto;width:100%;padding:8px 7px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;background:#17151bf5;border-top:1px solid #ffffff20;box-shadow:0 -8px 24px #0005;backdrop-filter:blur(16px)}
 header nav .btn{min-width:0;padding:8px 3px;font-size:11px;line-height:1.15;min-height:46px;border-radius:12px;white-space:normal}
 .nav-more{display:none;position:absolute;bottom:calc(100% + 8px);right:8px;left:auto;width:min(250px,calc(100vw - 16px));padding:8px;grid-template-columns:1fr;gap:5px;background:#211c25;border:1px solid #ffffff24;border-radius:16px;box-shadow:0 14px 40px #0008}
 .nav-more.is-open{display:grid}
 .nav-more .btn{width:100%;text-align:left;padding:10px 14px}
 .nav-more-toggle{display:block}
 main{padding:20px 13px 26px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .card{padding:6px;border-radius:13px}
 .card .band{font-size:9px;padding:4px 5px;letter-spacing:.04em}
 .card .nm{font-size:clamp(13px,3.6vw,17px)}
 .card .spec{font-size:10px}.card .meta{font-size:9px}
 .hero{padding:22px 18px;border-radius:18px}
 .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .auth-buttons{grid-template-columns:1fr}
 .trade-picks,.trade-coins,.review-columns{grid-template-columns:1fr}
}
@media(max-width:380px){header .me{font-size:11px;max-width:55%}header nav .btn{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body>
<header><div class="logo">GAYCHA<small>CLUB</small></div>
<nav aria-label="Navigation principale"><button class="btn alt nav-main" data-v="booster">Boosters</button><button class="btn alt nav-main" data-v="collection">Ma collection</button><button class="btn alt nav-main" data-v="trades">Échanges</button><button class="btn alt nav-main" data-v="market">Marché</button><button class="btn alt nav-more-toggle" id="navMoreToggle" type="button" aria-expanded="false" aria-controls="navMore">Plus <span aria-hidden="true">＋</span></button><div class="nav-more" id="navMore"><button class="btn alt" data-v="catalog">Catalogue</button><button class="btn alt" data-v="missions">Missions</button><button class="btn alt" data-v="leaderboard">Classement</button><button class="btn alt" data-v="messages">Messages</button><button class="btn alt" data-v="profile">Profil</button><button class="btn alt" data-v="admin" id="nadm" hidden>Admin</button></div></nav>
<div class="me" id="me"></div></header>
<main id="app" aria-live="polite"></main>
<script>
// ===== CONFIG : URL et clé PUBLIQUE uniquement. Jamais la clé service_role. =====
const SUPABASE_URL='https://tgnembausaanuazoelxw.supabase.co';
const SUPABASE_KEY='sb_publishable_xPvkIsb6dO0DVHXrf6Gs-g_wGrdewIx';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id),app=$('app');
const RN={commun:['Commun','●'],peu_commun:['Peu commun','⬢'],rare:['Rare','◆'],epique:['Épique','★'],legendaire:['Légendaire','♛'],secrete:['Secrète','◈']};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null,profile=null,cards=[],busy=false;
const msg=(t,e)=>`<div class="note ${e?'err':''}">${esc(t)}</div>`;
function card(c,n){const r=RN[c.rarity],s=c.series||{};
return `<div class="card r-${c.rarity}" data-cid="${esc(c.id)}" tabindex="0" role="button" aria-label="Agrandir ${esc(c.name)}" style="--s1:${esc(s.color_a)};--s2:${esc(s.color_b)}"><div class="band"><span>${esc((s.name||'').toUpperCase())}</span><span>${r[1]} ${r[0].toUpperCase()}</span></div>${n>1?`<span class="x">×${n}</span>`:''}<div class="art"><b>${esc(c.name.replace(/^(Le |La |L’|Madame |Diva du )/,'').charAt(0).toUpperCase())}</b><i>Illustration à venir</i></div><div class="nm">${esc(c.name)}</div><div class="spec">${esc(c.spec)}</div><div class="meta"><span class="rar">${r[1]} ${r[0]}</span><span>N° ${String(c.number).padStart(3,'0')}</span></div></div>`}
async function loadCards(){const {data,error}=await sb.from('cards').select('id,name,rarity,number,spec,anecdote,bio,series(name,color_a,color_b)').order('number');if(error)throw error;cards=data}
async function refresh(){const {data:{session}}=await sb.auth.getSession();user=session?.user||null;profile=null;
if(user){const {data}=await sb.from('profiles').select('username,balance,age_confirmed_at,role').eq('id',user.id).maybeSingle();profile=data}
$('nadm').hidden=!['admin','moderator','catalog_manager'].includes(profile?.role);
$('me').innerHTML=user?`${esc(profile?.username||user.email)} · ${profile?.balance??0} 💰 <button class="btn alt" id="out">Déconnexion</button>`:'';
if(user)$('out').onclick=async()=>{await sb.auth.signOut();go('catalog')}}
async function go(v){await refresh();try{if(!cards.length)await loadCards()}catch(e){app.innerHTML=msg('Impossible de charger le catalogue : '+e.message,1);return}
if(v!=='catalog'&&!user)return auth();
({catalog,collection,booster,missions,market,leaderboard,trades,messages,admin})[v]()}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const menu=$('navMore');if(menu)menu.classList.remove('is-open');const toggle=$('navMoreToggle');if(toggle)toggle.setAttribute('aria-expanded','false');go(b.dataset.v)});const navToggle=$('navMoreToggle');if(navToggle)navToggle.onclick=()=>{const menu=$('navMore');if(!menu)return;const open=menu.classList.toggle('is-open');navToggle.setAttribute('aria-expanded',String(open))};
function catalog(){app.innerHTML=`<div class="hero"><h1>Catalogue</h1><p>Touchez une carte pour l’admirer en grand.</p><div class="rbar"></div></div>${cards.length?'':msg('Aucune carte publiée. Vérifiez que phase2_seed.sql a été exécuté.')}<div class="grid">${cards.map(c=>card(c)).join('')}</div>`}
function auth(){app.innerHTML=`<div class="box auth-box"><div class="eyebrow">GAYCHA CLUB · Espace membre</div><h2>Ravi de te revoir</h2><p class="auth-intro">Retrouve ton album, ton solde et tes échanges.</p><button class="btn google-btn" id="googleAuth" type="button"><span class="google-mark" aria-hidden="true">G</span> Continuer avec Google</button><div class="auth-divider"><span>ou avec ton e-mail</span></div><label for="em">Adresse e-mail</label><input id="em" type="email" placeholder="toi@exemple.fr" autocomplete="email"><label for="pw">Mot de passe</label><input id="pw" type="password" placeholder="Mot de passe (8 caractères min.)" autocomplete="current-password"><label for="un">Pseudo <span>(à l’inscription)</span></label><input id="un" placeholder="3 à 20 lettres, chiffres ou _" autocomplete="nickname" maxlength="20"><div class="auth-buttons"><button class="btn" id="li" type="button">Se connecter</button><button class="btn alt" id="su" type="button">Créer un compte</button></div><div id="am" aria-live="polite"></div><p class="auth-footnote">Tes cartes et ton solde restent rattachés au compte avec lequel tu te connectes.</p></div>`;
const v=()=>[$('em').value.trim(),$('pw').value];
$('googleAuth').onclick=async()=>{const b=$('googleAuth');b.disabled=true;$('am').innerHTML=msg('Redirection vers Google…');const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin+window.location.pathname}});if(error){$('am').innerHTML=msg('Connexion Google impossible : '+error.message,1);b.disabled=false}};
$('li').onclick=async()=>{const[e,p]=v();if(!e||!p){$('am').innerHTML=msg('Saisis ton e-mail et ton mot de passe.',1);return}const {error}=await sb.auth.signInWithPassword({email:e,password:p});error?$('am').innerHTML=msg(error.message,1):go('collection')};
$('su').onclick=async()=>{const[e,p]=v(),username=$('un').value.trim();if(!e||!p||!username){$('am').innerHTML=msg('Renseigne l’e-mail, le mot de passe et le pseudo.',1);return}if(!/^[a-zA-Z0-9_]{3,20}$/.test(username)){$('am').innerHTML=msg('Le pseudo doit contenir de 3 à 20 lettres, chiffres ou tirets bas.',1);return}const {error}=await sb.auth.signUp({email:e,password:p,options:{data:{username}}});$('am').innerHTML=error?msg(error.message,1):msg('Compte créé. Confirme ton adresse via l’e-mail reçu, puis connecte-toi.')}}
async function ageGate(){app.innerHTML=`<div class="box"><h2>Réservé aux 18 ans et plus</h2><p>Ce site contient de l’humour adulte. Confirmez que vous avez 18 ans ou plus. Il s’agit d’une déclaration, pas d’une vérification d’identité.</p><button class="btn" id="ok">J’ai 18 ans ou plus</button><div id="am"></div></div>`;
$('ok').onclick=async()=>{const {error}=await sb.rpc('confirm_age');error?$('am').innerHTML=msg(error.message,1):go('booster')}}
async function collection(){app.innerHTML='<h1>Ma collection</h1><p>Chargement…</p>';
const {data,error}=await sb.from('card_instances').select('card_id,acquired_at').order('acquired_at',{ascending:false});
if(error)return app.innerHTML=msg(error.message,1);
const cnt={};data.forEach(d=>cnt[d.card_id]=(cnt[d.card_id]||0)+1);
const own=cards.filter(c=>cnt[c.id]);
app.innerHTML=`<h1>Ma collection</h1><p>${own.length} / ${cards.length} cartes découvertes</p>${own.length?'':msg('Votre album est vide. Ouvrez un booster.')}<div class="grid">${own.map(c=>`<div>${card(c,cnt[c.id])}${cnt[c.id]>1?`<button class="btn alt" style="width:100%;margin-top:6px" data-conv="${c.id}" data-n="${cnt[c.id]-1}">Convertir ${cnt[c.id]-1} doublon(s)</button>`:''}<button class="btn alt" style="width:100%;margin-top:6px" data-sell="${c.id}">Vendre</button></div>`).join('')}</div><div id="cm"></div>`;

let bs=[];
if(tab==='boosters'){const {data,error}=await sb.from('booster_types').select('*').order('price');bs=data||[];body=error?fail(error):bs.map(b=>`<div class="box" style="max-width:none;margin:12px 0"><b>${esc(b.name)}</b> (${esc(b.slug)})<br>${Object.keys(RN).map(k=>`<label>${RN[k][0]} %<input class="o-${b.slug}" data-k="${k}" type="number" step="0.1" min="0" value="${b.odds[k]??0}"></label>`).join('')}<label>Prix 💰<input id="p-${b.slug}" type="number" min="0" value="${b.price}"></label><label>Garantie : Rare+ après N cartes<input id="g-${b.slug}" type="number" min="1" value="${b.pity_threshold}"></label><label>Délai (heures)<input id="d-${b.slug}" type="number" min="0" value="${b.cooldown_hours}"></label><label><input type="checkbox" id="a-${b.slug}" ${b.active?'checked':''} style="width:auto"> Actif</label><br><button class="btn" data-sb="${b.slug}">Enregistrer</button></div>`).join('')}
if(tab==='audit'){const {data,error}=await sb.from('audit_log').select('*').order('id',{ascending:false}).limit(100);body=error?fail(error):`<table><tr><th>Date</th><th>Action</th><th>Détails</th></tr>${(data||[]).map(a=>`<tr><td>${new Date(a.created_at).toLocaleString('fr-FR')}</td><td>${esc(a.action)}</td><td><small>${esc(JSON.stringify(a.details))}</small></td></tr>`).join('')}</table>`}
app.innerHTML=`<h1>Administration</h1>${bar}${body}`;
const say=(e,t)=>{$('am').innerHTML=e?msg(e.message,1):msg(t)};
app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>admin(b.dataset.t));
app.querySelectorAll('[data-rs]').forEach(b=>b.onclick=async()=>{const {error}=await sb.rpc('admin_resolve_report',{p_report:b.dataset.r,p_status:b.dataset.rs});error?say(error):admin('reports')});
app.querySelectorAll('[data-su]').forEach(b=>b.onclick=async()=>{const r=prompt('Motif de la suspension de '+b.dataset.su+' ?');if(!r)return;const {error}=await sb.rpc('admin_set_suspension',{p_username:b.dataset.su,p_suspend:true,p_reason:r});say(error,'Compte suspendu.')});
const susp=v=>async()=>{const {error}=await sb.rpc('admin_set_suspension',{p_username:$('au').value.trim(),p_suspend:v,p_reason:$('ar').value});say(error,v?'Compte suspendu.':'Compte rétabli.')};
if($('asu')){$('asu').onclick=susp(true);$('arl').onclick=susp(false)}
if($('gb'))$('gb').onclick=async()=>{const {error}=await sb.rpc('admin_grant_coins',{p_username:$('gu').value.trim(),p_amount:+$('ga').value,p_reason:$('gr').value});say(error,'Monnaie créditée.')};
if($('csv')){$('csv').onclick=async()=>{const d={series_id:$('cs').value,number:+$('cn').value,name:$('cname').value,rarity:$('cr').value,spec:$('csp').value,anecdote:$('can').value,bio:$('cb').value,status:$('cst').value,is_fictional:$('cf').checked,rights_checked:$('crc').checked};
const {error}=await sb.rpc('admin_upsert_card',{p_id:$('cid').value||null,p_data:d});if(error)say(error);else{cards=[];await loadCards();admin('cards')}};
$('cnew').onclick=()=>admin('cards');
app.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{const c=list.find(x=>x.id===b.dataset.ed);$('cft').textContent='Modifier : '+c.name;$('cid').value=c.id;$('cs').value=c.series_id;$('cn').value=c.number;$('cname').value=c.name;$('cr').value=c.rarity;$('csp').value=c.spec||'';$('can').value=c.anecdote||'';$('cb').value=c.bio||'';$('cst').value=c.status;$('cf').checked=c.is_fictional;$('crc').checked=c.rights_checked;scrollTo(0,0)})}
app.querySelectorAll('[data-sb]').forEach(b=>b.onclick=async()=>{const s=b.dataset.sb,o={};document.querySelectorAll('.o-'+s).forEach(i=>o[i.dataset.k]=+i.value);
const {error}=await sb.rpc('admin_set_booster',{p_slug:s,p_odds:o,p_price:+$('p-'+s).value,p_pity:+$('g-'+s).value,p_cooldown:+$('d-'+s).value,p_active:$('a-'+s).checked});say(error,'Booster mis à jour.')})}
go('catalog');
</script></body></html>
