<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAYCHA CLUB — Collection & communauté</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:dark;--bg:#101010;--ch:#1D1D20;--gold:#D6B46A;--cream:#F4EBDD;--mut:#a9a39a;--rb:linear-gradient(90deg,#FF477E,#FF8A00,#FFDA45,#8CCF35,#00A9A5,#3867FF,#C9A7FF)}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 85% -10%,#D6B46A22,transparent 60%),radial-gradient(700px 500px at -10% 35%,#FF477E14,transparent 60%),radial-gradient(600px 400px at 60% 110%,#00A9A514,transparent 60%),var(--bg);background-attachment:fixed;color:var(--cream);font:16px/1.5 Fraunces,Georgia,serif}
h1,h2,.logo{font-family:Anton,Impact,sans-serif;font-weight:400;margin:0;letter-spacing:.02em}
h1{font-size:clamp(36px,6vw,60px);line-height:1.05}h2{font-size:30px;margin:26px 0 8px}
main>h1::after,.rbar{content:"";display:block;height:4px;width:110px;margin-top:8px;border-radius:2px;background:var(--rb)}
button{font:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:10;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 20px 15px;background:#1D1D20ee;backdrop-filter:blur(8px)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rb);background-size:200% 100%;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:200% 0}}
.logo{font-size:28px;color:var(--gold);line-height:1;text-shadow:0 0 18px #D6B46A44}.logo small{font:600 10px Fraunces;letter-spacing:.5em;display:block;color:var(--cream)}.logo-home{border:0;background:transparent;padding:0;cursor:pointer;text-align:left;flex:0 0 auto}.logo-home:hover{filter:brightness(1.18)}.site-brand-logo{display:block;width:auto;max-width:min(190px,28vw);height:auto;max-height:48px;object-fit:contain}.logo-home:has(.site-brand-logo){display:flex;align-items:center;min-height:44px}
header nav{display:flex;gap:6px;flex-wrap:wrap}header nav .btn{padding:8px 14px;min-height:40px;font-size:14px}
header .me{margin-left:auto;color:var(--mut);font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
main{max-width:1100px;margin:0 auto;padding:30px 20px 60px}
.hero{padding:14px 0 10px}.hero p{color:var(--mut);margin:8px 0 12px}
.btn{background:linear-gradient(180deg,#e8cb86,#D6B46A);color:#101010;border:0;border-radius:8px;padding:12px 20px;font-weight:600;min-height:46px;transition:transform .15s,box-shadow .15s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 20px #D6B46A44}
.btn.alt{background:#ffffff08;color:var(--cream);border:1px solid #D6B46A99}
.btn.alt:hover:not(:disabled){border:1px solid transparent;background:linear-gradient(#1D1D20,#1D1D20) padding-box,var(--rb) border-box;box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
input,select,textarea{background:#101010;color:var(--cream);border:1px solid #4a4233;border-radius:8px;padding:10px 12px;min-height:44px;font:inherit;width:100%;margin:6px 0}
.box{position:relative;overflow:hidden;max-width:420px;background:#1D1D20;border:1px solid #3a3326;border-radius:12px;padding:22px;margin:20px auto}
.box::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--rb);opacity:.9}
.note{background:var(--ch);border-left:4px solid #FF477E;padding:12px 16px;border-radius:0 8px 8px 0;color:var(--mut);margin:14px 0}
.err{border-color:#ff5555;color:#ffb4b4}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.section-shortcuts{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 20px;padding:0 0 14px;border-bottom:1px solid #ffffff18}.section-shortcuts .btn{min-height:36px;padding:7px 12px;font-size:13px;border-radius:999px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #333;text-align:left;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px;margin-top:18px}
/* ===== Cartes ===== */
.card{--s1:#FF477E;--s2:#c4204f;--r:#8a95a3;position:relative;aspect-ratio:5/7;border-radius:14px;background:#0b0b0c;border:3px solid var(--r);padding:6px;display:flex;flex-direction:column;overflow:hidden;color:#fff;width:100%;container-type:inline-size;cursor:pointer;text-align:left;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px) scale(1.02)}
.band{background:linear-gradient(90deg,var(--s1),var(--s2));color:#101010;font-family:Anton,sans-serif;font-size:max(9px,6.2cqw);letter-spacing:.12em;padding:.8cqw 2.6cqw;border-radius:4px;display:flex;justify-content:space-between}
.art{position:relative;overflow:hidden;flex:1;margin:6px 0;border-radius:6px;background:radial-gradient(circle at 50% 35%,var(--s1) 0,transparent 58%),linear-gradient(160deg,#26262b,#0b0b0c);display:grid;place-items:center}
.art::before{content:"";position:absolute;inset:0;background:radial-gradient(#ffffff26 1px,transparent 1.6px) 0 0/8px 8px;mix-blend-mode:overlay}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.card-illustration{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#ffffff18,transparent 38%),linear-gradient(145deg,#ffffff08,transparent 45%);overflow:hidden}.card-illustration::before,.card-illustration::after{content:"";position:absolute;width:68%;aspect-ratio:1;border:1px solid #ffffff28;border-radius:50%;transform:rotate(-24deg)}.card-illustration::after{width:88%;border-color:var(--s1);opacity:.55;transform:rotate(35deg) scaleY(.45)}.card-illustration span{position:relative;z-index:1;font-size:27cqw;filter:drop-shadow(0 8px 10px #0009);transform:rotate(-7deg)}.card-illustration i{z-index:2;left:0;right:0;text-align:center;letter-spacing:.35em;font-size:max(6px,3.4cqw);opacity:.7}.art:has(img) b,.art:has(img) i{display:none}.art:has(img)::before{z-index:1;background:linear-gradient(180deg,#0001 50%,#0009);mix-blend-mode:normal}.art b{font-family:Anton,sans-serif;font-weight:400;font-size:40cqw;line-height:1;background:linear-gradient(180deg,#fff,#ffffffaa);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #0009)}
.art i{position:absolute;bottom:4px;left:6px;font-style:normal;font-size:max(7px,4cqw);opacity:.55}
 .card-illustration.venue-art{background:radial-gradient(ellipse at 50% 28%,color-mix(in srgb,var(--s1) 72%,white 8%),transparent 52%),linear-gradient(145deg,#17151f,#08080b 76%);isolation:isolate}
 .venue-art::before{width:78%;aspect-ratio:1;border:1px solid color-mix(in srgb,var(--s1) 65%,white 12%);border-radius:8% 50% 8% 50%;transform:rotate(22deg);opacity:.9}
 .venue-art::after{width:95%;height:40%;aspect-ratio:auto;border:1px solid #ffffff38;border-radius:50%;transform:rotate(-18deg);bottom:12%;top:auto}
 .venue-art .venue-mark{position:absolute;top:10%;left:10%;font-family:Anton,sans-serif;font-size:clamp(9px,5cqw,15px);letter-spacing:.22em;opacity:.85}
 .venue-art .venue-city{position:absolute;bottom:13%;left:0;right:0;text-align:center;font-size:clamp(7px,4cqw,12px);letter-spacing:.16em;text-transform:uppercase;opacity:.82}
 .venue-art .venue-icon{font-size:30cqw;filter:drop-shadow(0 8px 10px #0009);transform:none}
.venue-art{background:radial-gradient(ellipse at 50% 34%,color-mix(in srgb,var(--s1) 60%,white 4%),transparent 48%),linear-gradient(155deg,#24202d,#09090d 76%)!important}
.venue-art .venue-scene{position:absolute;left:15%;right:15%;top:27%;height:43%;display:grid;place-items:center;overflow:hidden;border:1px solid #ffffff50;border-radius:10px 10px 3px 3px;background:linear-gradient(180deg,#ffffff12,#0008);box-shadow:0 12px 24px #0008,inset 0 0 24px #ffffff0b}
.venue-art .venue-scene::before,.venue-art .venue-scene::after{content:"";position:absolute;inset:8% 12%;border:1px solid #ffffff25;border-radius:3px}
.venue-art .venue-scene::after{inset:0 50%;border-width:0 1px;border-radius:0}
.venue-art .venue-glow{position:absolute;inset:-20%;background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--s1) 65%,white 15%),transparent 55%);opacity:.65}
.venue-art .venue-line{position:absolute;bottom:10%;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,var(--s1),#fff,var(--s2),transparent);box-shadow:0 0 14px var(--s1)}
.venue-art .venue-icon{position:relative;z-index:2;font-size:30cqw;line-height:1;filter:drop-shadow(0 6px 9px #000b)}
.venue-art .venue-mark{top:9%;font-size:clamp(11px,6cqw,19px);text-shadow:0 2px 8px #000}
.venue-art .venue-kind{z-index:3;top:8%;right:7%;font-weight:700;backdrop-filter:blur(4px)}
.venue-art .venue-city{bottom:14%;font-weight:600;text-shadow:0 2px 8px #000}
.venue-art.venue-club .venue-scene{border-color:color-mix(in srgb,var(--s1) 75%,white);box-shadow:0 0 18px color-mix(in srgb,var(--s1) 40%,transparent),0 12px 24px #0008}
.venue-art.venue-club .venue-glow{background:radial-gradient(ellipse at 25% 30%,#3867ff99,transparent 40%),radial-gradient(ellipse at 75% 65%,#ff477e99,transparent 40%),radial-gradient(ellipse at 50% 50%,var(--s1),transparent 55%)}
.venue-art.venue-club .venue-line{height:4px;box-shadow:0 0 18px var(--s1)}
.venue-art.venue-sauna .venue-scene{border-radius:18px 18px 5px 5px;background:repeating-linear-gradient(90deg,#ffffff0a 0 9px,#0002 9px 13px),linear-gradient(180deg,#ffffff10,#0008)}
.venue-art.venue-sauna .venue-glow{background:radial-gradient(ellipse at 50% 45%,#ffca7a99,transparent 58%)}
.venue-art.venue-sauna .venue-line{background:linear-gradient(90deg,transparent,#f4c78c,transparent);box-shadow:0 0 14px #f4c78c}
 .venue-art .venue-kind{position:absolute;top:3%;right:5%;font-size:clamp(7px,3.2cqw,10px);letter-spacing:.12em;border:1px solid #ffffff55;border-radius:99px;padding:3px 5px;background:#0005}
.nm{font-family:Anton,sans-serif;font-size:max(11px,9cqw);letter-spacing:.03em}
.spec{font-size:max(8.5px,5.4cqw);line-height:1.25;color:#d8d2c8}
.meta{display:flex;justify-content:space-between;font-size:max(8.5px,5.2cqw);margin-top:2px}.rar{color:var(--r);font-weight:600}
.x{position:absolute;top:8.5cqw;right:2cqw;background:var(--gold);color:#101010;border-radius:10px;font:600 max(10px,5cqw) Fraunces;padding:1px 8px;z-index:2}
.r-peu_commun{--r:#2fa57a;background-image:repeating-linear-gradient(45deg,#ffffff06 0 6px,transparent 6px 12px)}
.r-rare{--r:#3867FF;box-shadow:0 0 16px #3867FF66,inset 0 0 0 1px #9bb0ff}
.r-epique{--r:#e03bd0;box-shadow:0 0 20px #e03bd088}
.r-legendaire{--r:#D6B46A;box-shadow:0 0 24px #D6B46A99,inset 0 0 0 2px #7a5f22}
.r-secrete{--r:#fff;border-color:transparent;background:linear-gradient(#0b0b0c,#0b0b0c) padding-box,conic-gradient(from var(--a),#ff477e,#ffda45,#8ccf35,#00a9a5,#3867ff,#c9a7ff,#ff477e) border-box;animation:spin 6s linear infinite;box-shadow:0 0 22px #c9a7ff55}
@keyframes spin{to{--a:360deg}}
.r-epique::after,.r-legendaire::after,.r-secrete::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,#ffffff40 48%,transparent 60%);background-size:250% 100%;background-position:150% 0;animation:sh 3.5s infinite}
.r-secrete::after{background-image:linear-gradient(115deg,#ff477e44,#ffda4444,#00a9a544,#3867ff44,#c9a7ff44,transparent);animation-direction:alternate;animation-duration:2.5s}
@keyframes sh{to{background-position:-50% 0}}
/* Ouverture de booster */
.fl{aspect-ratio:5/7;perspective:900px}.fi{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s}.fl.on .fi{transform:rotateY(180deg)}
.fb,.ff{position:absolute;inset:0;backface-visibility:hidden}.ff{transform:rotateY(180deg)}.ff .card{height:100%}.fl .card:hover{transform:none}
.fl.hi.on{animation:pop .9s}@keyframes pop{30%{filter:brightness(2) drop-shadow(0 0 26px #FFDA45);transform:scale(1.08)}}
.back{display:grid;place-items:center;border:3px solid var(--gold);background:repeating-conic-gradient(#ff477e18 0 15deg,#3867ff18 0 30deg),#0b0b0c}
.sealed{width:200px;aspect-ratio:5/8;margin:20px auto;background:linear-gradient(160deg,#2a2418,#0b0b0c);border:3px solid var(--gold);border-radius:10px;display:grid;place-content:center;text-align:center;animation:shk .5s 2;box-shadow:0 0 30px #D6B46A55}
@keyframes shk{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
/* Vue en grand */
dialog{position:relative;background:var(--ch);color:var(--cream);border:0;border-radius:16px;padding:26px;max-width:860px;width:94vw}
dialog::backdrop{background:#000d;backdrop-filter:blur(4px)}
dialog::before{content:"";position:absolute;inset:0;border-radius:16px;padding:2px;background:var(--rb);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.zw{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:28px;align-items:center}
@media(max-width:640px){.zw{grid-template-columns:1fr}.zc{max-width:300px;margin:0 auto}}
.zc{position:relative;transition:transform .12s;will-change:transform}.zc .card:hover{transform:none}
.glare{position:absolute;inset:0;border-radius:14px;pointer-events:none;background:radial-gradient(circle at var(--mx,50%) var(--my,25%),#ffffff55,transparent 45%);mix-blend-mode:overlay}
.zx{position:absolute;top:12px;right:12px;z-index:2;min-height:40px;padding:6px 14px}
.zi h2{margin-top:0}
@media(prefers-reduced-motion:reduce){header::after,.r-secrete,.r-epique::after,.r-legendaire::after,.r-secrete::after,.sealed,.fl.hi.on{animation:none}.fi,.card,.btn,.zc{transition:none}.card:hover{transform:none}}

.cards-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px}.catalogue-filters{display:grid;grid-template-columns:minmax(180px,2fr) repeat(4,minmax(130px,1fr)) auto auto;gap:10px;margin:18px 0 8px;align-items:center}.catalogue-filters input,.catalogue-filters select{width:100%;min-width:0}.catalogue-count{color:var(--mut);font-size:.92rem;margin:8px 0 16px}.catalogue-item{min-width:0}.catalogue-meta{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;color:var(--mut);font-size:.82rem;margin:8px 0 4px}.catalogue-compact{display:flex;flex-direction:column;gap:8px}.catalogue-compact .catalogue-item{display:grid;grid-template-columns:110px minmax(0,1fr);align-items:center;gap:16px;padding:10px 14px;border:1px solid #d6b46a30;border-radius:14px;background:#ffffff04}.catalogue-compact .card{width:100%;max-width:110px;min-width:0}.catalogue-compact .card .art{aspect-ratio:3/4}.catalogue-compact .catalogue-meta{justify-content:flex-start}.catalogue-compact .catalogue-item .card .info{padding:6px}.catalogue-compact .catalogue-item .card .name{font-size:.86rem}@media(max-width:950px){.catalogue-filters{grid-template-columns:repeat(2,minmax(0,1fr))}.catalogue-filters input{grid-column:1/-1}}@media(max-width:420px){.catalogue-filters{grid-template-columns:1fr}.catalogue-compact .catalogue-item{grid-template-columns:88px minmax(0,1fr);gap:10px}.catalogue-compact .card{max-width:88px}}.admin-view-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:20px 0 8px}.admin-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin:12px 0 24px}.admin-card-tile{cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:10px;gap:10px}.admin-card-real{width:100%;max-width:245px}.admin-card-real .card{cursor:pointer;box-shadow:0 12px 24px #0008}.admin-card-info{width:100%;align-self:stretch}.admin-image-preview{margin:10px 0;padding:8px;border:1px solid #d6b46a55;border-radius:12px;display:flex;gap:12px;align-items:center;background:#111}.admin-image-preview img{width:90px;height:120px;object-fit:cover;border-radius:8px}.admin-image-preview span{font-size:12px;color:var(--mut)}.admin-card-preview-card{width:100%;max-width:340px;margin:0 auto}.admin-card-preview-card .card{cursor:default;box-shadow:0 18px 38px #0009}.admin-card-preview-card .card:hover{transform:none}.admin-card-tile:focus-within,.admin-card-tile:hover{outline:2px solid #d6b46a88;outline-offset:2px}.admin-card-art img{cursor:zoom-in}.admin-card-large-preview{width:100%;max-width:360px;aspect-ratio:3/4;object-fit:cover;border-radius:14px;border:1px solid #d6b46a88;background:#101014}.admin-edit-layout{display:grid;grid-template-columns:minmax(220px,340px) minmax(0,1fr);gap:22px;align-items:start}.admin-edit-layout .box{max-width:none!important;margin:0!important}.admin-edit-layout .admin-edit-preview{position:sticky;top:16px;text-align:center}.admin-edit-preview h3{margin:0 0 12px}.admin-edit-preview .note{overflow-wrap:anywhere}@media(max-width:700px){.admin-edit-layout{grid-template-columns:1fr}.admin-edit-layout .admin-edit-preview{position:static}.admin-card-large-preview{max-width:100%;max-height:55vh}}.admin-card-tile{overflow:hidden;border:1px solid #d6b46a55;border-radius:13px;background:#151518;box-shadow:0 8px 20px #0004}.admin-card-art{height:190px;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#d6b46a22,transparent 60%),#0b0b0c}.admin-card-art img{width:100%;height:100%;object-fit:cover;display:block}.admin-card-placeholder{font-size:64px;color:#d6b46a}.admin-card-info{display:grid;gap:6px;padding:12px}.admin-card-info>span{font-size:12px;color:var(--mut)}.admin-status{display:inline-block!important;width:max-content;border:1px solid #d6b46a55;border-radius:999px;padding:3px 8px;color:#f0d28d!important}.admin-card-info .btn{margin-top:4px}.admin-card-list[hidden]{display:none}
@media(max-width:560px){.cards-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
body::before{content:"";position:fixed;z-index:-1;inset:0;pointer-events:none;background:linear-gradient(125deg,#ff477e08,#ff8a0005,#ffda4508,#8ccf3505,#00a9a508,#3867ff08,#c9a7ff08);background-size:250% 250%;animation:pride-drift 22s ease infinite}
@keyframes pride-drift{50%{background-position:100% 100%}}
body:not([data-pride])::before{background:linear-gradient(135deg,#d6b46a12,transparent 48%,#c9a7ff08);background-size:100% 100%;animation:none}
.rainbow-line{height:4px;border-radius:99px;background:var(--rb);margin:12px 0 18px;box-shadow:0 0 18px #c9a7ff25}
.trade-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.trade-side{padding:14px;border:1px solid #ffffff20;border-radius:14px;background:linear-gradient(145deg,#ffffff08,#ffffff02);min-width:0}
.trade-side.give{border-top:3px solid #00a9a5}.trade-side.get{border-top:3px solid #ff477e}
.trade-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:10px}
.trade-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin:12px 0}
.trade-tools{display:grid;grid-template-columns:minmax(130px,2fr) repeat(2,minmax(110px,1fr));gap:8px;margin:12px 0}.trade-tools input,.trade-tools select{width:100%;min-width:0;background:#101010;color:#F4EBDD;border:1px solid #ffffff2a;border-radius:8px;padding:9px}.trade-pagination{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0}.trade-pagination button{padding:7px 12px}.trade-count{font-size:12px;color:var(--mut);text-align:center}.trade-empty{padding:16px;border:1px dashed #ffffff2a;border-radius:10px;color:var(--mut);text-align:center}@media(max-width:650px){.trade-tools{grid-template-columns:1fr 1fr}.trade-tools input{grid-column:1/-1}.trade-picker{grid-template-columns:repeat(2,minmax(0,1fr))}}.trade-card-option{position:relative;background:transparent;border:1px solid #ffffff1c;border-radius:10px;padding:5px;cursor:pointer;text-align:left;min-width:0}.trade-card-option .card{width:100%;margin:0}.trade-card-option.selected{border:2px solid #00a9a5;box-shadow:0 0 16px #00a9a544}.trade-side.get .trade-card-option.selected{border-color:#ff477e;box-shadow:0 0 16px #ff477e44}.trade-card-option:not(.selected){opacity:.82}.trade-card-option:focus-visible{outline:2px solid var(--gold);outline-offset:2px}.trade-copy-badge{position:absolute;top:8px;left:8px;z-index:4;padding:4px 7px;border-radius:999px;background:#111e;color:#f5d58b;border:1px solid #d6b46a99;font-size:10px;font-weight:700;pointer-events:none;box-shadow:0 2px 8px #0008}.trade-card-option:disabled{opacity:.3;cursor:not-allowed;filter:grayscale(1)}

/* ===== Design system pass 2 : dashboard, collection, admin and responsive polish ===== */
:root{--gc-gold:#d6b46a;--gc-gold-soft:#f0dca7;--gc-panel:rgba(255,255,255,.035);--gc-line:rgba(214,180,106,.22)}

.dashboard-welcome-mark span{font-family:Anton,sans-serif;font-size:74px;line-height:.95;color:var(--gc-gold-soft);text-shadow:0 0 28px #d6b46a40}

.dashboard-grid{align-items:stretch;gap:14px;margin:18px 0 22px}
.dash-tile{position:relative;overflow:hidden;min-width:0;border:1px solid var(--gc-line);border-radius:17px;background:linear-gradient(145deg,#ffffff08,#ffffff02);padding:18px;box-shadow:0 10px 26px #0002}

.section-panel{margin:16px 0;padding:clamp(16px,2.5vw,24px);border:1px solid var(--gc-line);background:var(--gc-panel);border-radius:18px}

.dashboard-shortcuts .tabs{display:flex;flex-wrap:wrap;gap:9px}

.booster-choice.cooldown .booster-pack{filter:saturate(.55);opacity:.8}
.booster-choice .booster-pack{transition:transform .25s,filter .25s}
.booster-choice:hover .booster-pack{transform:rotate(0) scale(1.035)}
.booster-inventory-panel .booster-choices{margin-bottom:0}
.booster-opening-results{scroll-margin-top:90px}

.opening-stage{display:flex;align-items:center;justify-content:center;gap:clamp(18px,5vw,44px);min-height:250px;padding:24px;border:1px solid #d6b46a55;border-radius:20px;background:radial-gradient(ellipse at 50% 0%,#d6b46a20,transparent 60%),linear-gradient(145deg,#201b25,#101012);text-align:center}
.opening-pack{position:relative;width:104px;height:148px;display:grid;place-content:center;gap:3px;flex:0 0 auto;overflow:hidden;border:2px solid #f1d58f;border-radius:13px;background:linear-gradient(145deg,#f4d88e,#a65d9a 38%,#263f82 75%,#111);box-shadow:0 0 28px #d6b46a44,inset 0 0 0 4px #ffffff22;transform:rotate(-7deg);animation:opening-float 1.8s ease-in-out infinite}
.opening-pack:before{content:"";position:absolute;inset:-60% -20%;background:linear-gradient(110deg,transparent 40%,#ffffff88 49%,transparent 58%);transform:translateX(-80%);animation:pack-shine 1.2s linear infinite}
.opening-pack:after{content:"";position:absolute;top:50%;left:-10%;right:-10%;height:2px;background:#fff4c4;box-shadow:0 0 20px #fff,0 0 35px #ff80b8;opacity:0;transform:rotate(-15deg) scaleX(0);transform-origin:center}
.opening-pack span,.opening-pack strong{position:relative;z-index:1;color:#fff;text-shadow:0 2px 8px #000;font-family:Anton,sans-serif}
.opening-pack span{font-size:20px;letter-spacing:.08em}.opening-pack strong{font-size:12px;letter-spacing:.4em}
.opening-pack.is-opening{animation:opening-burst .8s ease-in forwards}
.opening-pack.is-opening:after{animation:opening-tear .7s ease-out forwards}
.opening-copy{max-width:360px}
.opening-copy h2{margin:5px 0;font-size:clamp(22px,3vw,30px)}
.opening-copy p{margin:0;color:var(--mut);font-size:13px}
.opening-progress{height:5px;max-width:280px;margin:14px auto 0;overflow:hidden;border-radius:99px;background:#ffffff1b}
.opening-progress span{display:block;width:35%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#d6b46a,#f5e5b2,#b5a4ff,#ff80b8);animation:opening-progress 1.25s ease-in-out infinite}
@keyframes opening-float{50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes opening-burst{0%{transform:scale(1) rotate(-7deg);filter:brightness(1)}55%{transform:scale(1.18) rotate(5deg);filter:brightness(2.3)}100%{transform:scale(.75) rotate(12deg);opacity:0;filter:brightness(2)}}
@keyframes opening-tear{35%{opacity:1;transform:rotate(-15deg) scaleX(1)}100%{opacity:0;transform:rotate(-15deg) scaleX(1.6)}}
@keyframes opening-progress{50%{transform:translateX(180%)}}
.booster-reveal{padding:clamp(14px,2.5vw,22px);border:1px solid #d6b46a55;border-radius:20px;background:radial-gradient(ellipse at 50% 0%,#d6b46a16,transparent 58%),#111114}
.booster-reveal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.booster-reveal-head h2{margin:0}

.booster-reveal-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 0}
.booster-reveal-status{color:var(--gold);font-size:13px;font-weight:700}
.booster-reveal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,155px),1fr));align-items:start;gap:clamp(10px,2vw,18px)}
.booster-reveal-grid .fl{min-width:0;width:100%;max-width:235px;justify-self:center;scroll-margin-top:100px}
.booster-reveal-grid .fl .card{height:100%}
.booster-reveal-grid .back{position:absolute}
.booster-reveal-grid .ff{display:flex;align-items:stretch;justify-content:center}
.reveal-tag{position:absolute;z-index:5;left:5px;right:5px;bottom:6px;padding:5px 4px;border:1px solid #ffffff55;border-radius:7px;background:#101014eF;color:#ffe7a2;text-align:center;font:700 10px/1.2 Arial,sans-serif;letter-spacing:.03em;pointer-events:none}
.reveal-tag.duplicate{color:#d7d9e5}
.booster-summary{margin-top:20px;padding:18px;border:1px solid #d6b46a66;border-radius:16px;background:linear-gradient(130deg,#d6b46a12,#b5a4ff0a,#ff80b808)}
.booster-summary[hidden]{display:none}
.booster-summary h3{margin:0 0 12px;font-family:Anton,sans-serif;font-weight:400;font-size:24px}
.booster-summary-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.booster-summary-stats>div{padding:12px;border:1px solid #ffffff16;border-radius:12px;background:#ffffff05}
.booster-summary-stats strong{display:block;color:#ffe7a2;font-size:25px;font-variant-numeric:tabular-nums}
.booster-summary-stats span{display:block;color:var(--mut);font-size:11px}
.booster-rarity-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.booster-rarity-list span{padding:5px 9px;border:1px solid #ffffff1c;border-radius:999px;background:#ffffff08;font-size:11px}
.booster-summary-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}
.collection-card-item.is-missing{border-style:dashed;border-color:#aeb1c344;background:linear-gradient(145deg,#ffffff04,#ffffff01)}
.collection-card-item.is-missing .card{filter:grayscale(.92) saturate(.5);opacity:.62}
.collection-missing-label{display:block;margin:7px auto 0;padding:5px 9px;border:1px dashed #aeb1c366;border-radius:999px;color:#c8c5cf;text-align:center;font-size:11px}
.dashboard-discoveries{overflow:hidden}
.dashboard-discovery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,150px));gap:12px;align-items:start}
.dashboard-discovery-card{min-width:0}

.collection-tools{grid-template-columns:minmax(150px,2fr) repeat(5,minmax(105px,1fr))}
@media(max-width:760px){

}

@media(prefers-reduced-motion:reduce){

 .opening-pack.is-opening{animation:none!important;opacity:0}
 .opening-pack.is-opening:after{animation:none!important}

 .booster-choice:hover{transform:none!important}

/* ===== LOT 1 — GAYCHA CLUB / système visuel global ===== */
:root{
 --gc-ink:#0b0b10;
 --gc-surface:#14141b;
 --gc-surface-raised:#1b1a23;
 --gc-border:rgba(226,211,177,.14);
 --gc-border-strong:rgba(226,193,109,.42);
 --gc-gold:#e4c477;
 --gc-gold-light:#f8e8b8;
 --gc-lilac:#b9a4f4;
 --gc-pink:#f18ab9;
 --gc-mint:#83d9c3;
 --gc-text:#f4f0e8;
 --gc-muted:#aaa6b2;
 --gc-shadow:0 18px 48px rgba(0,0,0,.34);
 --gc-radius:18px;
}
html{scroll-behavior:smooth;scroll-padding-top:100px}
body{
 background-color:var(--gc-ink);
 background-image:
  radial-gradient(ellipse at 8% -8%,rgba(178,115,176,.13),transparent 34%),
  radial-gradient(ellipse at 96% 8%,rgba(218,181,103,.11),transparent 28%),
  radial-gradient(ellipse at 55% 110%,rgba(91,119,188,.09),transparent 38%);
 color:var(--gc-text);
 font-family:"DM Sans",Arial,sans-serif;
 letter-spacing:.005em;
}
h1,h2,h3,h4,.logo{font-family:"Space Grotesk",Arial,sans-serif;letter-spacing:-.035em}
h1{font-size:clamp(2rem,4.5vw,3.35rem);font-weight:700;line-height:1.04}
h2{font-size:clamp(1.35rem,2.4vw,1.9rem);font-weight:650;line-height:1.15}
h3{font-family:"Space Grotesk",Arial,sans-serif;font-weight:650;letter-spacing:-.02em}
p{line-height:1.65}
main{max-width:1240px;padding:clamp(18px,3vw,34px) clamp(14px,2.5vw,28px) 72px}
main>h1::after,.rbar{height:3px;width:76px;margin-top:14px;border-radius:99px;background:linear-gradient(90deg,var(--gc-gold),var(--gc-lilac),var(--gc-pink))}
header{
 min-height:72px;padding:12px clamp(14px,2.5vw,30px);
 gap:clamp(12px,1.8vw,24px);
 background:rgba(13,12,18,.88);
 border-bottom:1px solid rgba(255,255,255,.055);
 backdrop-filter:blur(20px) saturate(145%);
}
header::after{height:1px;opacity:.7;background:linear-gradient(90deg,transparent,var(--gc-gold),var(--gc-lilac),var(--gc-pink),transparent)}
.logo{font-size:25px;font-weight:700;color:var(--gc-gold-light);text-shadow:0 0 24px rgba(228,196,119,.2)}

.btn{

 transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,filter .18s ease;

.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 26px rgba(214,180,106,.2);filter:brightness(1.04)}

.btn.alt:hover:not(:disabled){border-color:rgba(228,196,119,.62);background:rgba(228,196,119,.08);box-shadow:0 7px 20px rgba(0,0,0,.16)}
input,select,textarea{

input:hover,select:hover,textarea:hover{border-color:rgba(228,196,119,.38)}
input:focus,select:focus,textarea:focus{border-color:var(--gc-gold);box-shadow:0 0 0 3px rgba(228,196,119,.12);outline:0}
.box,.section-panel,.collection-progress-panel,.collection-library-panel,.booster-section,.booster-inventory-panel{
 border:1px solid var(--gc-border);border-radius:var(--gc-radius);

.box{padding:clamp(16px,2.3vw,24px)}

 box-shadow:var(--gc-shadow),inset 0 1px rgba(255,255,255,.07)!important;

.dashboard-welcome h1,.collection-hero h1,.admin-hero h1{font-size:clamp(2rem,4vw,3rem);letter-spacing:-.055em}

.eyebrow{font-family:"DM Sans",sans-serif;font-size:10px;font-weight:800;letter-spacing:.18em}
.dashboard-free-booster{

 margin:16px 0 20px;padding:clamp(18px,2.6vw,26px);

 if(cards.some(c=>!venueMeta(c).venue_type))categoryValues.push('__other__');
 categoryValues.sort((a,b)=>categoryLabel(a).localeCompare(categoryLabel(b),'fr'));

 '<select id="cat-rarity" aria-label="Filtrer par rareté"><option value="">Toutes les raretés</option>'+Object.entries(RN).map(([k,v])=>'<option value="'+esc(k)+'">'+esc(v[0]||k)+'</option>').join('')+'</select>'+
 '<button class="btn alt" id="cat-layout" type="button" aria-pressed="false">☷ Liste compacte</button>'+

 '<p id="cat-count" class="catalogue-count" aria-live="polite" role="status"></p><div id="cat-results" class="grid cards-grid"></div><div id="cat-empty"></div>';
 const results=$('cat-results'),count=$('cat-count'),search=$('cat-search'),city=$('cat-city'),type=$('cat-type'),series=$('cat-series'),rarity=$('cat-rarity'),layout=$('cat-layout');
 let compact=false;
 const draw=()=>{

  const grid=$('booster-reveal-grid'),status=$('reveal-status'),summary=$('booster-summary'),revealButton=$('reveal-all');

  const finish=()=>{
   if(finished)return;
   finished=true;
   if(status)status.textContent=entries.length+" / "+entries.length+" cartes révélées";
   if(summary)summary.hidden=false;
   if(revealButton)revealButton.disabled=true;

  };
  const revealAll=()=>{
   timers.forEach(clearTimeout);
   grid?.querySelectorAll('.fl').forEach(el=>el.classList.add('on'));
   finish();
  };
  revealButton.onclick=revealAll;
  if(reducedMotion)revealAll();

   const el=grid?.children[i];
   if(el)el.classList.add('on');

   if(i===entries.length-1)finish();
  },450+i*650)));
  pk.scrollIntoView({behavior:reducedMotion?'auto':'smooth',block:'start'});
  await revealPromise;
  await refresh();
  await loadBoosterInventory();
  showBoosterDetails(slug);

  const openAgain=$('booster-open-again');

   else{openAgain.textContent='Choisir un autre booster';openAgain.onclick=()=>document.getElementById('booster-list-section')?.scrollIntoView({behavior:'smooth',block:'start'})}
  }
  $('booster-to-collection')?.addEventListener('click',()=>go('collection'));
 }catch(e){
  if(pk?.isConnected)pk.innerHTML=msg('Ouverture impossible : '+(e.message||'erreur inconnue'),1);
 }finally{
  busy=false;
  buttons.forEach(b=>b.disabled=false);
 }
}

 else{

  <section class="admin-audit-distributions"><div class="admin-section-caption"><strong>Distributions administratives</strong><span>Crédits et boosters offerts aux comptes, avec bénéficiaire, motif et responsable.</span></div><div class="admin-audit-table-wrap"><table class="admin-audit-table"><thead><tr><th>Date</th><th>Type</th><th>Bénéficiaire</th><th>Quantité</th><th>Motif</th><th>Administrateur</th></tr></thead><tbody id="audit-distribution-results"></tbody></table></div><p class="muted">Cette vue reprend les événements de distribution enregistrés dans le journal d’audit.</p></section>

 $('cimgfile').onchange=async()=>{const file=$('cimgfile').files?.[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>5*1024*1024){app.insertAdjacentHTML('afterbegin',msg('Image refusée : PNG/JPEG/WebP, 5 Mo maximum.',1));$('cimgfile').value='';return}const path='cards/'+(user?.id||'admin')+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const {error}=await sb.storage.from('card-art').upload(path,file,{upsert:true,contentType:file.type});if(error){app.insertAdjacentHTML('afterbegin',msg('Envoi impossible : '+error.message,1));return}const {data}=sb.storage.from('card-art').getPublicUrl(path);$('cimg').value=data.publicUrl;updateCardImagePreview()};
 $('csv').onclick=async()=>{const button=$('csv');button.disabled=true;const data={series_id:$('cs').value,number:Number($('cn').value),name:$('cname').value.trim(),rarity:$('cr').value,spec:$('csp').value,anecdote:$('can').value,bio:$('cb').value,image_path:$('cimg').value.trim(),status:$('cst').value,is_fictional:$('cf').checked,rights_checked:$('crc').checked,is_secret:$('csecret').checked};const id=$('cid').value||null;if(!data.series_id||!Number.isInteger(data.number)||data.number<0||data.name.length<2){button.disabled=false;app.insertAdjacentHTML('afterbegin',msg('Renseigne une série, un numéro valide et un nom de 2 caractères minimum.',1));return}const previous=list.find(c=>c.id===id);if(data.status==='publie'&&previous?.status!=='publie'&&!confirm('Publier « '+data.name+' » maintenant ? La carte deviendra visible aux joueurs.')){button.disabled=false;return}const {error}=await sb.rpc('admin_upsert_card',{p_id:id,p_data:data});button.disabled=false;if(error){app.insertAdjacentHTML('afterbegin',msg('Enregistrement impossible : '+error.message,1));return}await admin('cards');app.insertAdjacentHTML('afterbegin',msg('Carte enregistrée.'))};
 $('cnew').onclick=()=>{['cid','cname','csp','can','cb','cimg'].forEach(id=>$(id).value='');$('cn').value='';$('cst').value='brouillon';$('cf').checked=true;$('crc').checked=false;$('csecret').checked=false;$('cft').textContent='Nouvelle carte';$('cimgfile').value='';updateCardImagePreview();scrollTo(0,0)};
}
app.querySelectorAll('[data-sb]').forEach(b=>b.onclick=async()=>{const s=b.dataset.sb,o={};document.querySelectorAll('.o-'+s).forEach(i=>o[i.dataset.k]=+i.value);if(o.secrete!==0){app.insertAdjacentHTML('afterbegin',msg('Les cartes secrètes se débloquent via les défis et ne peuvent pas être tirées dans les boosters.',1));return}
const {error}=await sb.rpc('admin_upsert_booster',{p_slug:s,p_name:$('n-'+s).value.trim(),p_cards_per_pack:+$('c-'+s).value,p_odds:o,p_price:+$('p-'+s).value,p_pity:30,p_cooldown:+$('d-'+s).value,p_active:$('a-'+s).checked});say(error,'Booster mis à jour.')});
if($('gbgrant'))$('gbgrant').onclick=async()=>{const b=$('gbgrant'),username=$('gbuser').value.trim(),slug=$('gbslug').value,qty=+$('gbqty').value,reason=$('gbreason').value.trim();if(!username||!reason||qty<1||qty>20){$('gbmsg').innerHTML=msg('Indique un pseudo, un motif et une quantité de 1 à 20.',1);return}b.disabled=true;const {error}=await sb.rpc('admin_grant_booster',{p_username:username,p_slug:slug,p_quantity:qty,p_reason:reason});b.disabled=false;$('gbmsg').innerHTML=error?msg(error.message==='unknown user'?'Pseudo introuvable. Vérifie le pseudo exact.':error.message,1):msg('Booster(s) distribué(s).');};}
go('dashboard');loadSiteBranding();
</script></body></html>
