<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAYCHA CLUB — Phase 2</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:dark;--bg:#101010;--ch:#1D1D20;--gold:#D6B46A;--cream:#F4EBDD;--mut:#a9a39a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.5 Fraunces,Georgia,serif}
h1,h2,.logo{font-family:Anton,Impact,sans-serif;font-weight:400;margin:0}
button{font:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:var(--ch);border-bottom:1px solid #3a3326}
.logo{font-size:26px;color:var(--gold);line-height:1}.logo small{font:600 10px Fraunces;letter-spacing:.5em;display:block;color:var(--cream)}
header nav{display:flex;gap:6px}header .me{margin-left:auto;color:var(--mut);font-size:14px}
main{max-width:1100px;margin:0 auto;padding:30px 20px}
.btn{background:var(--gold);color:#101010;border:0;border-radius:6px;padding:12px 20px;font-weight:600;min-height:46px}
.btn.alt{background:none;color:var(--cream);border:1px solid var(--gold)}.btn:disabled{opacity:.5;cursor:default}
input{background:var(--ch);color:var(--cream);border:1px solid #4a4233;border-radius:6px;padding:10px 12px;min-height:44px;font:inherit;width:100%;margin:6px 0}
.box{max-width:420px;background:var(--ch);border-radius:12px;padding:22px;margin:20px auto}
.note{background:var(--ch);border-left:4px solid #FF477E;padding:12px 16px;border-radius:0 8px 8px 0;color:var(--mut);margin:14px 0}
.err{border-color:#ff5555;color:#ffb4b4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;margin-top:18px}
.card{--s1:#FF477E;--s2:#c4204f;--r:#8a95a3;position:relative;aspect-ratio:5/7;border-radius:12px;background:#0b0b0c;border:3px solid var(--r);padding:6px;display:flex;flex-direction:column;overflow:hidden;color:#fff;width:100%}
.band{background:linear-gradient(90deg,var(--s1),var(--s2));color:#101010;font:11px Anton;letter-spacing:.12em;padding:4px 8px;border-radius:4px;display:flex;justify-content:space-between}
.art{flex:1;margin:6px 0;border-radius:6px;background:radial-gradient(circle at 50% 35%,var(--s1) 0,transparent 55%),linear-gradient(160deg,#26262b,#0b0b0c);display:grid;place-items:center}
.art b{font:clamp(34px,7vw,60px) Anton}.nm{font:15px Anton}.spec{font-size:10px;line-height:1.25;color:#d8d2c8}
.meta{display:flex;justify-content:space-between;font-size:10px;margin-top:2px}.rar{color:var(--r);font-weight:600}
.x{position:absolute;top:30px;right:6px;background:var(--gold);color:#101010;border-radius:10px;font:600 11px Fraunces;padding:1px 8px}
.r-peu_commun{--r:#2fa57a}.r-rare{--r:#3867FF;box-shadow:0 0 14px #3867FF66}.r-epique{--r:#e03bd0;box-shadow:0 0 18px #e03bd088}
.r-legendaire{--r:#D6B46A;box-shadow:0 0 22px #D6B46A88}
.r-secrete{border-color:transparent;background:linear-gradient(#0b0b0c,#0b0b0c) padding-box,conic-gradient(#ff477e,#ffda45,#8ccf35,#00a9a5,#3867ff,#c9a7ff,#ff477e) border-box}
.fl{aspect-ratio:5/7;perspective:900px}.fi{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s}.fl.on .fi{transform:rotateY(180deg)}
.fb,.ff{position:absolute;inset:0;backface-visibility:hidden}.ff{transform:rotateY(180deg)}.ff .card{height:100%}
.back{display:grid;place-items:center;border:3px solid var(--gold);background:#0b0b0c}
.sealed{width:200px;aspect-ratio:5/8;margin:20px auto;background:linear-gradient(160deg,#2a2418,#0b0b0c);border:3px solid var(--gold);border-radius:10px;display:grid;place-content:center;text-align:center;animation:shk .5s 2}
@keyframes shk{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@media(prefers-reduced-motion:reduce){.sealed{animation:none}.fi{transition:none}}

/* === GAYCHA CLUB PREMIUM REDESIGN === */
:root{--bg:#090910;--ch:#171722;--gold:#f6c86d;--cream:#fff5f7;--mut:#b6b1c5;--pink:#ff4fa3;--blue:#6b7cff;--cyan:#54e7df;--rainbow:linear-gradient(115deg,#ff477e,#ffb84d,#f8ed66,#5ee58c,#54d9e9,#8c7bff,#ff477e)}
html{scroll-behavior:smooth}body{background:radial-gradient(ellipse at 12% -10%,#42204c 0,transparent 38%),radial-gradient(ellipse at 100% 15%,#17234a 0,transparent 34%),var(--bg);min-height:100vh}
header{position:sticky;top:0;z-index:20;background:#11111beF;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff1b;box-shadow:0 12px 40px #0004}
.logo{font-size:30px;text-shadow:0 0 22px #ff4fa355;letter-spacing:.03em}
header nav{gap:7px;flex-wrap:wrap}header nav .btn{font-size:13px;padding:9px 13px;min-height:38px;border-radius:999px;transition:transform .2s,border-color .2s}header nav .btn:hover{transform:translateY(-2px);border-color:var(--pink)}header nav .btn.active{background:var(--rainbow);border-color:transparent;color:#15121b}
main{max-width:1440px;padding:34px clamp(14px,3vw,42px) 70px}main h1{font-size:clamp(32px,4vw,52px);background:var(--rainbow);background-size:250% 100%;background-clip:text;-webkit-background-clip:text;color:transparent;animation:gaychaRainbow 9s linear infinite}main h2{font-size:clamp(23px,2.5vw,31px)}
.btn{background:var(--rainbow);background-size:220% 100%;color:#16121b;border:0;border-radius:10px;font-weight:700;box-shadow:0 5px 18px #ff4fa322;transition:transform .2s,box-shadow .2s}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px #ff4fa344}.btn.alt{background:#ffffff08;color:var(--cream);border:1px solid #ffffff2b;box-shadow:none}.btn.alt:hover{border-color:var(--pink);background:#ff4fa311}
.box{background:linear-gradient(145deg,#ffffff0d,#ffffff04);border:1px solid #ffffff17;border-radius:18px;box-shadow:0 16px 45px #0003}
.grid{grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:clamp(12px,1.7vw,24px)}.cards-grid{grid-template-columns:repeat(var(--card-cols,4),minmax(0,1fr));align-items:start}
.card{isolation:isolate;border:2px solid var(--r);border-radius:16px;padding:8px;box-shadow:0 12px 30px #0007;cursor:zoom-in;transition:transform .28s,box-shadow .28s,filter .28s}
.card:before{content:"";position:absolute;inset:-50%;z-index:3;pointer-events:none;background:linear-gradient(115deg,transparent 34%,#ffffff08 42%,#ffffff65 49%,#ffffff12 55%,transparent 64%);transform:translateX(-90%) rotate(12deg);transition:transform .8s;mix-blend-mode:screen}
.card:hover{transform:translateY(-7px) scale(1.018);box-shadow:0 18px 42px #0009,0 0 24px color-mix(in srgb,var(--r) 45%,transparent);filter:saturate(1.1)}.card:hover:before{transform:translateX(90%) rotate(12deg)}
.card .nm{font-size:clamp(15px,1.25vw,20px);line-height:1.12;margin:3px 0 4px}.card .spec{font-size:12px}.card .meta{font-size:11px}
.r-peu_commun{--r:#36e2a0}.r-rare{--r:#7187ff;box-shadow:0 0 18px #3867FF66}.r-epique{--r:#ff52dc;box-shadow:0 0 24px #e03bd088;animation:epicGlow 3.5s ease-in-out infinite}.r-legendaire{--r:#ffd56e;box-shadow:0 0 30px #D6B46A88;animation:legendGlow 3s ease-in-out infinite}.r-secrete{box-shadow:0 0 28px #ff4fa355;animation:secretGlow 2.8s ease-in-out infinite}
.hero-panel{position:relative;overflow:hidden;padding:clamp(22px,4vw,46px);margin:0 0 28px;border:1px solid #ffffff20;border-radius:24px;background:radial-gradient(circle at 90% 15%,#ff4fa333,transparent 28%),radial-gradient(circle at 10% 100%,#6b7cff30,transparent 34%),linear-gradient(135deg,#20172d,#10101b 65%);box-shadow:0 24px 70px #0004}.hero-panel h1{max-width:780px}.hero-panel p{max-width:700px;color:#d2c9dc}
.eyebrow{font:12px Anton;letter-spacing:.18em;color:var(--cyan);text-transform:uppercase}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0;padding:14px;border:1px solid #ffffff19;border-radius:16px;background:#ffffff07}.toolbar input,.toolbar select{flex:1;min-width:145px;width:auto;margin:0}.toolbar select{background:#171722;color:var(--cream);border:1px solid #ffffff2b;border-radius:9px;padding:11px;min-height:44px;font:inherit}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.stat{padding:18px;border:1px solid #ffffff1c;border-radius:15px;background:linear-gradient(145deg,#ffffff0d,#ffffff03)}.stat strong{display:block;font:30px Anton;color:var(--gold)}.progress-track{height:9px;background:#ffffff16;border-radius:99px;overflow:hidden}.progress-track span{display:block;height:100%;border-radius:99px;background:var(--rainbow);transition:width .5s}
.card-modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:22px;background:#05050bdc;backdrop-filter:blur(14px)}.card-modal.open{display:flex;animation:gaychaFade .2s ease}.modal-content{display:grid;grid-template-columns:minmax(220px,340px) minmax(220px,360px);gap:26px;align-items:center;max-width:800px;width:100%;max-height:90vh;overflow:auto;padding:24px;border:1px solid #ffffff25;border-radius:24px;background:linear-gradient(145deg,#211a2c,#101019);box-shadow:0 30px 100px #0009}.modal-card .card{cursor:default;width:100%}.modal-info p{color:var(--mut)}.modal-close{position:absolute;top:18px;right:20px;border-radius:50%;width:46px;height:46px;font-size:26px}.rarity-pill{display:inline-block;padding:5px 12px;border:1px solid var(--gold);border-radius:99px;color:var(--gold);margin:8px 0}
.card .art img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.card .art.has-image{background:#15151c}.card .art.has-image b{display:none}
@keyframes gaychaRainbow{to{background-position:250% 0}}@keyframes epicGlow{50%{box-shadow:0 0 34px #e03bd0aa}}@keyframes legendGlow{50%{box-shadow:0 0 42px #ffd56ecc}}@keyframes secretGlow{50%{box-shadow:0 0 42px #ff4fa388,0 0 68px #6b7cff44}}@keyframes gaychaFade{from{opacity:0}to{opacity:1}}
@media(max-width:1000px){.cards-grid{grid-template-columns:repeat(min(var(--card-cols,3),3),minmax(0,1fr))}header{position:relative}}
@media(max-width:680px){.cards-grid,.grid{grid-template-columns:repeat(min(var(--card-cols,2),2),minmax(0,1fr));gap:11px}header{padding:12px;gap:12px}header nav{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:5px}header nav .btn{flex:0 0 auto}.logo{font-size:25px}main{padding:22px 12px 50px}.modal-content{grid-template-columns:minmax(0,1fr);max-width:390px;padding:16px;gap:14px}.modal-card{max-width:220px;margin:auto}.hero-panel{padding:22px}.toolbar{padding:10px}.toolbar input,.toolbar select{min-width:100%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
/* Booster reveal polish */.fl{filter:drop-shadow(0 12px 24px #0007)}.fl.on .card{animation:gaychaReveal .65s cubic-bezier(.15,.9,.25,1) both}.sealed{box-shadow:0 0 35px #ffd56e33,0 0 0 8px #ffffff05;position:relative}.sealed:before{content:"";position:absolute;inset:-5px;border-radius:14px;background:var(--rainbow);z-index:-1;opacity:.7;filter:blur(10px)}@keyframes gaychaReveal{0%{transform:translateY(22px) scale(.78);opacity:0}70%{transform:translateY(-5px) scale(1.03);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
/* Accessibility and responsive card sizing */
.card[role="button"]:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
.card-modal .modal-content{position:relative}
.toolbar select:focus-visible,.toolbar input:focus-visible{outline-color:var(--cyan)}
@media(max-width:420px){.cards-grid,.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:5px;border-radius:12px}.card .band{font-size:9px;letter-spacing:.06em;padding:4px}.card .spec{font-size:10px}.card .nm{font-size:14px}.card .meta{font-size:9px}.toolbar select{font-size:14px}}

/* Booster cards are always visible before opening; CSS-only art avoids broken external images. */
.booster-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin:24px 0 28px}
.booster-pack{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:9px;min-height:360px;padding:22px 18px 20px;overflow:hidden;color:#fff7fb;text-align:center;border:1px solid #ffffff38;border-radius:24px;background:radial-gradient(ellipse at 50% 35%,#a12e73 0,transparent 43%),linear-gradient(145deg,#2b1736,#11111c 72%);box-shadow:0 20px 48px #0006;cursor:pointer;transition:transform .22s,border-color .22s,box-shadow .22s}
.booster-pack:before{content:"";position:absolute;inset:8px;border:1px solid #ffffff26;border-radius:17px;pointer-events:none}
.booster-pack:after{content:"";position:absolute;inset:-80% -40%;pointer-events:none;background:linear-gradient(115deg,transparent 43%,#ffffff19 49%,transparent 55%);transform:translateX(-55%) rotate(14deg);transition:transform .7s}
.booster-pack:hover{transform:translateY(-5px) scale(1.01);border-color:#ff75c0;box-shadow:0 24px 55px #ff4fa322,0 0 0 1px #ffffff0c}
.booster-pack:hover:after{transform:translateX(55%) rotate(14deg)}
.pack-redflag{background:radial-gradient(ellipse at 50% 36%,#ff365d88 0,transparent 45%),linear-gradient(145deg,#3c111f,#11111c 72%);border-color:#ff526c66}
.pack-top{font:12px Anton;letter-spacing:.18em;color:#fff4fb}
.pack-art{position:relative;display:grid;place-items:center;width:min(210px,75%);aspect-ratio:1/1.05;margin:4px 0 2px;border:2px solid #ffffff9c;border-radius:18px;background:linear-gradient(135deg,#ffffff2a,#ffffff03 38%,#0004),var(--rainbow);box-shadow:inset 0 0 0 5px #10101999,0 10px 32px #0007;transform:rotate(-2deg)}
.pack-art:before{content:"";position:absolute;inset:12px;border:1px solid #ffffff9c;border-radius:12px}
.pack-art b{font:clamp(58px,9vw,94px) Anton;color:#fff;text-shadow:0 5px 18px #0009}
.pack-art i,.pack-art em{position:absolute;color:#fff;font-style:normal;text-shadow:0 0 15px #fff}
.pack-art i{right:18px;top:16px;font-size:28px}.pack-art em{left:20px;bottom:15px;font-size:25px}
.pack-redflag .pack-art{background:linear-gradient(135deg,#ff9eac,#ff294f 50%,#4a102b);transform:rotate(2deg)}
.pack-name{font:clamp(18px,2vw,25px) Anton;letter-spacing:.06em}
.pack-desc{color:#d9cede;font-size:14px}
.pack-cta{margin-top:auto;padding:10px 15px;border-radius:99px;background:#ffffff12;border:1px solid #ffffff38;font-weight:700}
.booster-result-title{margin-top:22px}
.booster-results{min-height:180px;align-items:start}
.booster-empty{grid-column:1/-1;display:grid;justify-items:center;align-content:center;min-height:180px;padding:25px;border:1px dashed #ffffff2c;border-radius:18px;background:#ffffff04;text-align:center;color:var(--mut)}
.booster-empty span{font-size:36px;color:var(--gold)}.booster-empty b{color:var(--cream);font-size:18px}.booster-empty p{margin:4px 0}
.trade-compose label{display:block;color:#e9ddea;font-weight:600;margin:12px 0 4px}
.trade-compose input,.trade-compose select{background:#11111b;color:var(--cream);border:1px solid #ffffff2a;border-radius:10px;padding:11px;font:inherit;width:100%;min-height:44px}
.trade-picks,.trade-coins,.review-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.trade-picks select{min-height:170px}.trade-picks small{display:block;color:var(--mut);margin-top:5px}
.trade-coins{margin:8px 0 18px}
.trade-review{padding:16px;margin:16px 0;border:1px solid #ffffff23;border-radius:14px;background:linear-gradient(135deg,#ffffff0a,#ffffff03)}
.trade-review p{color:var(--mut);overflow-wrap:anywhere}.review-columns>div{padding:10px;border-radius:10px;background:#ffffff07}.review-columns p{font-size:14px}.trade-review-foot{font-size:13px;margin-bottom:0}
@media(max-width:620px){.booster-options{grid-template-columns:1fr;gap:14px}.booster-pack{min-height:330px}.pack-art{width:170px}.trade-picks,.trade-coins,.review-columns{grid-template-columns:1fr}.trade-picks select{min-height:130px}}

.nav-count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;margin-left:4px;border-radius:99px;background:var(--pink);color:#fff;font:700 11px/1 Fraunces;box-shadow:0 0 12px #ff4fa355}

/* Phase 2: a more tactile, editorial finish — less glow, more character. */
:root{--bg:#111014;--ch:#1d1a20;--cream:#f6eee5;--mut:#b8aeb6;--gold:#e8bf72;--pink:#e86b9b;--blue:#7886a8;--cyan:#a7d8cf}
main h1{background:none;color:var(--cream);animation:none;letter-spacing:-.025em}
.hero-panel{background:linear-gradient(115deg,#25202a,#17171d 72%);border-color:#ffffff19;box-shadow:0 14px 36px #0003}
.hero-panel:after{content:"";position:absolute;right:-20px;bottom:-44px;width:150px;height:150px;border:1px solid #e8bf7233;border-radius:47% 53% 62% 38%;transform:rotate(-18deg);pointer-events:none}
.card{box-shadow:0 8px 18px #0005;transition:transform .18s,border-color .18s}
.card:before{opacity:.35}
.card:hover{transform:translateY(-3px) rotate(-.25deg);box-shadow:0 12px 24px #0006;filter:none}
.r-epique,.r-legendaire,.r-secrete{animation:none}
.r-rare,.r-epique,.r-legendaire,.r-secrete{box-shadow:0 0 0 1px color-mix(in srgb,var(--r) 45%,transparent)}
.btn{background:var(--gold);box-shadow:none;color:#1a1516}
.btn:hover{box-shadow:0 4px 0 #0003;transform:translateY(-1px)}
.btn.alt{border-color:#6b5d65;background:#ffffff04}
header{background:#17151bea;box-shadow:0 5px 20px #0003}
header nav .btn{font-size:13px}
.nav-more{display:contents}
.nav-more-toggle{display:none}
.auth-box{max-width:480px;padding:clamp(22px,4vw,34px)}
.auth-box h2{margin:5px 0 4px}
.auth-intro,.auth-footnote,.account-note{color:var(--mut)}
.auth-box label{display:block;margin-top:10px;color:var(--cream);font-weight:600;font-size:14px}
.auth-box label span{color:var(--mut);font-weight:400}
.auth-box input{margin:5px 0 0}
.auth-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:18px 0 16px;background:#f6eee5;color:#22202a}
.google-mark{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#fff;color:#4285f4;font:800 17px Arial,sans-serif}
.auth-divider{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:12px;margin:12px 0}
.auth-divider:before,.auth-divider:after{content:"";height:1px;background:#ffffff20;flex:1}
.auth-footnote,.account-note{font-size:12px;margin-top:16px}
.account-box{margin-top:18px}
@media(max-width:680px){
 body{padding-bottom:82px}
 header{position:relative;top:auto;padding:12px 14px;gap:10px}
 header .logo{font-size:25px}
 header .me{margin-left:auto;font-size:12px;max-width:58%;text-align:right}
 header nav{position:fixed;z-index:100;left:0;right:0;bottom:0;top:auto;width:100%;padding:8px 7px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;background:#17151bf5;border-top:1px solid #ffffff20;box-shadow:0 -8px 24px #0005;backdrop-filter:blur(16px)}
 header nav .btn{min-width:0;padding:8px 3px;font-size:11px;line-height:1.15;min-height:46px;border-radius:12px;white-space:normal}
 .nav-more{display:none;position:absolute;bottom:calc(100% + 8px);right:8px;left:auto;width:min(250px,calc(100vw - 16px));padding:8px;grid-template-columns:1fr;gap:5px;background:#211c25;border:1px solid #ffffff24;border-radius:16px;box-shadow:0 14px 40px #0008}
 .nav-more.is-open{display:grid}
 .nav-more .btn{width:100%;text-align:left;justify-content:flex-start;padding:10px 14px}
 .nav-more-toggle{display:block}
 main{padding:20px 13px 26px}
 .grid,.cards-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .card{padding:6px;border-radius:13px}
 .card .band{font-size:9px;padding:4px 5px;letter-spacing:.04em}
 .card .nm{font-size:clamp(13px,3.6vw,17px)}
 .card .spec{font-size:10px}
 .card .meta{font-size:9px}
 .hero-panel{padding:22px 18px;border-radius:18px}
 .hero-panel:after{width:95px;height:95px;right:-15px;bottom:-32px}
 .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .auth-buttons{grid-template-columns:1fr}
 .booster-options{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .booster-pack{min-height:270px;padding:15px 9px;border-radius:18px}
 .pack-art{width:min(145px,88%)}
 .pack-name{font-size:16px}
 .pack-desc{font-size:12px}
 .pack-cta{font-size:12px;padding:8px 10px}
}
@media(max-width:380px){
 header .me{font-size:11px;max-width:55%}
 header nav .btn{font-size:10px}
 .booster-pack{min-height:245px}
 .pack-art{width:118px}
}
@media(prefers-reduced-motion:reduce){

async function missions(){if(profile&&!profile.age_confirmed_at)return ageGate();

if(error)return app.innerHTML=msg(error.message,1);

app.querySelectorAll('[data-l]').forEach(b=>b.onclick=async()=>{const own=b.dataset.own==='1';if(!own&&!confirm('Acheter cette carte pour '+b.dataset.p+' 💰 ?'))return;b.disabled=true;const {error:e}=own?await sb.rpc('cancel_listing',{p_listing:b.dataset.l}):await sb.rpc('buy_listing',{p_listing:b.dataset.l,p_key:crypto.randomUUID()});await refresh();if(e){b.disabled=false;$('mk').innerHTML=msg(e.message,1)}else market()})}

async function trades(){if(profile&&!profile.age_confirmed_at)return ageGate();await sb.rpc('expire_offers');
const [a,b,c,d]=await Promise.all([sb.from('trades_view').select('*').order('created_at',{ascending:false}),sb.from('trade_items_view').select('*'),sb.from('card_instances').select('id,card_id').eq('locked',false),sb.from('market_view').select('card_id,price')]);
if(a.error)return app.innerHTML=msg(a.error.message,1);
const T=a.data||[],I=b.data||[],by={},prices={};const instanceCard={};(c.data||[]).forEach(m=>{(by[m.card_id]=by[m.card_id]||[]).push(m.id);instanceCard[m.id]=m.card_id});
(d.data||[]).forEach(m=>{const p=Number(m.price);if(Number.isFinite(p)&&p>0)(prices[m.card_id]=prices[m.card_id]||[]).push(p)});
const indicative=id=>prices[id]?.length?' · ~'+Math.round(prices[id].reduce((n,p)=>n+p,0)/prices[id].length)+' 💰':'';
const opt=(v,c)=>`<option value="${v}" data-card="${c.id}">${esc(c.name)} (${RN[c.rarity][0]})${esc(indicative(c.id))}</option>`;
const its=(id,s)=>I.filter(i=>i.offer_id===id&&i.side===s).map(i=>esc(i.name)).join(', ')||'aucune carte';
const SL={pending:'en attente',accepted:'acceptée',declined:'refusée',cancelled:'annulée',expired:'expirée'};
const incoming=T.filter(t=>t.status==='pending'&&t.proposer_id!==user.id).length;
app.innerHTML=`<div class="hero-panel"><div class="eyebrow">Échanges entre collectionneurs</div><h1>À toi de jouer.</h1><p>Propose un échange équilibré, repère les cartes manquantes et confirme toujours le récapitulatif avant l’envoi.</p><div class="stat-grid"><div class="stat"><span class="eyebrow">Offres reçues en attente</span><strong>${incoming}</strong></div><div class="stat"><span class="eyebrow">Offres dans l’historique</span><strong>${T.length}</strong></div><div class="stat"><span class="eyebrow">Doublons disponibles</span><strong>${Object.values(by).reduce((n,ids)=>n+Math.max(0,ids.length-1),0)}</strong></div></div></div>
<div class="box trade-compose" style="max-width:none"><h2>Nouvelle proposition</h2><p class="trade-help">Choisis un joueur, les cartes proposées et les cartes souhaitées. Sélectionne plusieurs cartes avec Ctrl (Windows) ou Cmd (Mac).</p><label for="tu">Pseudo du destinataire</label><input id="tu" placeholder="Pseudo du joueur"><div class="trade-picks"><div><label for="tg">Je donne</label><select id="tg" multiple size="6">${cards.filter(x=>by[x.id]).map(x=>opt(by[x.id][0],x)).join('')}</select><small>Seuls tes exemplaires disponibles sont proposés.</small></div><div><label for="tw">Je demande</label><select id="tw" multiple size="6">${cards.map(x=>opt(x.id,x)).join('')}</select><small>Tu peux demander plusieurs cartes.</small></div></div><div class="trade-coins"><div><label for="t1">Mon ajout en 💰</label><input id="t1" type="number" min="0" max="1000000" value="0"></div><div><label for="t2">Mon souhait en 💰</label><input id="t2" type="number" min="0" max="1000000" value="0"></div></div><div id="tradeReview" class="trade-review"><b>Récapitulatif de la proposition</b><p>Sélectionne les cartes pour préparer ton offre.</p></div><button class="btn" id="tp">Vérifier et proposer l’échange</button><div id="tm"></div></div>
<h2 style="margin-top:28px">Historique et offres</h2>${T.length?'':msg('Aucun échange pour le moment.')}${T.map(t=>{const mine=t.proposer_id===user.id;return `<div class="box" style="max-width:none;margin:12px 0"><b>${mine?'Vous → '+esc(t.recipient):esc(t.proposer)+' → vous'}</b> · ${SL[t.status]}<br>${mine?'Vous donnez':esc(t.proposer)+' donne'} : ${its(t.id,'give')}${t.offer_coins?' + '+t.offer_coins+' 💰':''}<br>${mine?'Vous demandez':esc(t.proposer)+' demande'} : ${its(t.id,'get')}${t.request_coins?' + '+t.request_coins+' 💰':''}<br><small>Expire le ${new Date(t.expires_at).toLocaleString('fr-FR')}</small><br>${t.status==='pending'?(mine?`<button class="btn alt" data-x="cancel" data-t="${t.id}">Annuler</button>`:`<button class="btn" data-x="accept" data-t="${t.id}">Accepter</button> <button class="btn alt" data-x="decline" data-t="${t.id}">Refuser</button>`):''}</div>`}).join('')}`;
const sel=id=>[...$(id).selectedOptions].map(o=>o.value);
const labels=id=>[...$(id).selectedOptions].map(o=>o.textContent.trim());
const estimate=()=>{const a=[...$('tg').selectedOptions],b=[...$('tw').selectedOptions];let giveValue=0,getValue=0,missing=0;const value=o=>{const vals=prices[o.dataset.card]||[];if(!vals.length){missing++;return 0}return vals.reduce((n,p)=>n+p,0)/vals.length};a.forEach(o=>giveValue+=value(o));b.forEach(o=>getValue+=value(o));const offerCoins=Math.max(0,Number($('t1').value)||0),requestCoins=Math.max(0,Number($('t2').value)||0);return{giveValue:giveValue+offerCoins,getValue:getValue+requestCoins,missing,delta:(giveValue+offerCoins)-(getValue+requestCoins)}};
const review=()=>{const give=labels('tg'),get=labels('tw'),giveCoins=Math.max(0,Number($('t1').value)||0),getCoins=Math.max(0,Number($('t2').value)||0),e=estimate(),complete=e.missing===0,diff=Math.abs(e.delta),base=Math.max(e.giveValue,e.getValue,1),warning=complete&&diff>Math.max(50,base*.3);const valueText=complete?'Valeur indicative : '+Math.round(e.giveValue).toLocaleString('fr-FR')+' 💰 contre '+Math.round(e.getValue).toLocaleString('fr-FR')+' 💰 ('+(e.delta>0?'+':'')+Math.round(e.delta).toLocaleString('fr-FR')+' 💰 de différence).': 'Estimation partielle : '+e.missing+' sélection(s) sans prix de marché exploitable.';$('tradeReview').innerHTML='<b>Récapitulatif de la proposition</b><div class="review-columns"><div><span class="eyebrow">Tu proposes</span><p>'+esc(give.join(' · ')||'Aucune carte sélectionnée')+'</p><b>'+giveCoins.toLocaleString('fr-FR')+' 💰</b></div><div><span class="eyebrow">Tu demandes</span><p>'+esc(get.join(' · ')||'Aucune carte sélectionnée')+'</p><b>'+getCoins.toLocaleString('fr-FR')+' 💰</b></div></div><p class="trade-estimate">'+esc(valueText)+'</p>'+(warning?'<p class="trade-warning">⚠️ Écart estimé important. Vérifie bien les cartes et les sommes avant de proposer.</p>':'')+'<p class="trade-review-foot">Les prix sont indicatifs, basés sur les annonces du marché, et ne garantissent pas une valeur réelle. L’échange ne sera effectué qu’après acceptation du destinataire.</p>'};
['tg','tw','t1','t2','tu'].forEach(id=>$(id).addEventListener('change',review));review();
$('tp').onclick=async()=>{const recipient=$('tu').value.trim(),give=sel('tg'),get=sel('tw'),offerCoins=Number($('t1').value)||0,requestCoins=Number($('t2').value)||0;
if(!recipient){$('tm').innerHTML=msg('Indique le pseudo du destinataire.',1);return}
if(!give.length&&!offerCoins){$('tm').innerHTML=msg('Sélectionne au moins une carte ou une somme à proposer.',1);return}
if(!get.length&&!requestCoins){$('tm').innerHTML=msg('Sélectionne au moins une carte ou une somme à demander.',1);return}
if(offerCoins<0||requestCoins<0||offerCoins>1000000||requestCoins>1000000){$('tm').innerHTML=msg('Les sommes doivent être comprises entre 0 et 1 000 000 💰.',1);return}
const e=estimate();const sameCard=[...$('tg').selectedOptions].some(o=>[...$('tw').selectedOptions].some(w=>w.dataset.card===o.dataset.card));if(sameCard){$('tm').innerHTML=msg('Tu proposes et demandes la même carte dans cet échange. Retire-la d’un des deux côtés pour éviter une offre incohérente.',1);return}const summary='Destinataire : '+recipient+'\n\nTu proposes : '+(labels('tg').join(', ')||'aucune carte')+' + '+offerCoins+' 💰\nTu demandes : '+(labels('tw').join(', ')||'aucune carte')+' + '+requestCoins+' 💰\n\n'+(e.missing===0?'Valeur indicative : '+Math.round(e.giveValue)+' 💰 contre '+Math.round(e.getValue)+' 💰.':'Attention : estimation incomplète, prix manquants pour '+e.missing+' sélection(s).')+'\n\nEnvoyer cette proposition ?'
if(!confirm(summary))return;$('tp').disabled=true;$('tm').innerHTML=msg('Envoi de la proposition…');
const {error}=await sb.rpc('propose_trade',{p_recipient:recipient,p_give:give,p_get:get,p_offer_coins:offerCoins,p_request_coins:requestCoins});
if(error){$('tm').innerHTML=msg(error.message,1);$('tp').disabled=false}else trades()};
app.querySelectorAll('[data-x]').forEach(bt=>bt.onclick=async()=>{const k=bt.dataset.x,id=bt.dataset.t;
if(k==='accept'&&!confirm('Confirmer cet échange ? Il sera définitif.'))return;bt.disabled=true;
const {error}=k==='accept'?await sb.rpc('accept_trade',{p_offer:id,p_key:crypto.randomUUID()}):await sb.rpc('close_trade',{p_offer:id,p_as:k});
await refresh();if(error){bt.disabled=false;$('tm').innerHTML=msg(error.message,1)}else trades()})}
async function messages(openId){if(profile&&!profile.age_confirmed_at)return ageGate();
const [a,b]=await Promise.all([sb.from('conversations_view').select('*').order('last_at',{ascending:false,nullsFirst:false}),sb.from('blocked_view').select('*')]);
if(a.error)return app.innerHTML=msg(a.error.message,1);
const cv=a.data||[],bl=b.data||[];let th='';
if(openId){const c=cv.find(x=>x.id===openId);
if(c){const {data:ms}=await sb.from('messages').select('id,sender_id,body,created_at').eq('conversation_id',openId).order('created_at');
await sb.rpc('mark_read',{p_conversation:openId});
const ask=c.status==='pending'&&c.requested_by!==user.id;
th=`<div class="box" style="max-width:none"><b>${esc(c.other)}</b> <button class="btn alt" data-blk="${esc(c.other)}">Bloquer</button>
${ask?`<div class="note">${esc(c.other)} souhaite vous écrire. <button class="btn" data-rsp="1" data-cv="${c.id}">Accepter</button> <button class="btn alt" data-rsp="0" data-cv="${c.id}">Refuser</button></div>`:''}
${c.status==='pending'&&!ask?'<div class="note">En attente de l’acceptation du destinataire.</div>':''}
<div>${(ms||[]).map(m=>`<p style="${m.sender_id===user.id?'text-align:right':''}">${esc(m.body)}<br><small>${new Date(m.created_at).toLocaleString('fr-FR')}${m.sender_id!==user.id?` · <a href="#" data-rep="${m.id}" style="color:#D6B46A">Signaler</a>`:''}</small></p>`).join('')}</div>
<input id="mb" maxlength="1000" placeholder="Votre message"><button class="btn" id="ms" data-to="${esc(c.other)}">Envoyer</button></div>`}}
app.innerHTML=`<h1>Messages</h1><div id="mq"></div>${th}<div class="box" style="max-width:none"><b>Nouveau message</b><input id="nu" placeholder="Pseudo du destinataire"><input id="nb" maxlength="1000" placeholder="Premier message (une demande de contact sera envoyée)"><button class="btn" id="ns">Envoyer</button></div>
<h2>Conversations</h2>${cv.length?'':msg('Aucune conversation.')}${cv.map(c=>`<div class="box" style="max-width:none;margin:10px 0"><a href="#" data-c="${c.id}" style="color:#D6B46A"><b>${esc(c.other)}</b></a> ${c.status==='pending'?'(demande en attente)':c.status==='declined'?'(refusée)':''}${c.unread?` · ${c.unread} non lu(s)`:''}</div>`).join('')}
${bl.length?`<h2>Utilisateurs bloqués</h2>${bl.map(x=>`<div>${esc(x.username)} <button class="btn alt" data-unb="${x.blocked_id}">Débloquer</button></div>`).join('')}`:''}`;
const fail=e=>{$('mq').innerHTML=msg(e.message,1)};
$('ns').onclick=async()=>{const {error:e}=await sb.rpc('send_message',{p_recipient:$('nu').value.trim(),p_body:$('nb').value});e?fail(e):messages()};
if($('ms'))$('ms').onclick=async()=>{const {error:e}=await sb.rpc('send_message',{p_recipient:$('ms').dataset.to,p_body:$('mb').value});e?fail(e):messages(openId)};
app.querySelectorAll('[data-c]').forEach(l=>l.onclick=ev=>{ev.preventDefault();messages(l.dataset.c)});
app.querySelectorAll('[data-rsp]').forEach(x=>x.onclick=async()=>{const {error:e}=await sb.rpc('respond_request',{p_conversation:x.dataset.cv,p_accept:x.dataset.rsp==='1'});e?fail(e):messages(openId)});
app.querySelectorAll('[data-blk]').forEach(x=>x.onclick=async()=>{if(!confirm('Bloquer '+x.dataset.blk+' ? Cette personne ne pourra plus vous écrire ni vous proposer d’échange.'))return;const {error:e}=await sb.rpc('block_user',{p_username:x.dataset.blk});e?fail(e):messages()});
app.querySelectorAll('[data-unb]').forEach(x=>x.onclick=async()=>{const {error:e}=await sb.rpc('unblock_user',{p_blocked:x.dataset.unb});e?fail(e):messages(openId)});
app.querySelectorAll('[data-rep]').forEach(x=>x.onclick=async ev=>{ev.preventDefault();const r=prompt('Pourquoi signalez-vous ce message ? (3 à 500 caractères)');if(!r)return;const {error:e}=await sb.rpc('report_message',{p_message:x.dataset.rep,p_reason:r});$('mq').innerHTML=e?msg(e.message,1):msg('Signalement envoyé à la modération.')})}

/* === GAYCHA CLUB: catalogue enrichi, album et profil === */
const CARD_ART = {}; // Ajouter ici les illustrations : CARD_ART["ID_DE_CARTE"] = "https://.../image.webp"
function card(c,n){const r=RN[c.rarity]||RN.commun,s=c.series||{},title=String(c.name||'Carte'),img=c.image_url||CARD_ART[c.id]||CARD_ART[title]||'';return `<div class="card r-${c.rarity||'commun'}" data-card-id="${esc(c.id||'')}" data-card-name="${esc(title)}" role="button" tabindex="0" aria-label="Voir ${esc(title)} en grand" style="--s1:${esc(s.color_a||'#ff477e')};--s2:${esc(s.color_b||'#6b7cff')}"><div class="band"><span>${esc((s.name||'GAYCHA CLUB').toUpperCase())}</span><span>${r[1]} ${r[0].toUpperCase()}</span></div>${n>1?`<span class="x">×${n}</span>`:''}<div class="art ${img?'has-image':''}">${img?`<img src="${esc(img)}" alt="Illustration de ${esc(title)}" loading="lazy" onerror="this.remove();this.parentElement.classList.remove('has-image')">`:''}<b>${esc(title.replace(/^(Le |La |L’|Madame |Diva du )/,'').charAt(0).toUpperCase())}</b></div><div class="nm">${esc(title)}</div><div class="spec">${esc(c.spec||'Carte de collection')}</div><div class="meta"><span class="rar">${r[1]} ${r[0]}</span><span>N° ${String(c.number??'—').padStart(3,'0')}</span></div></div>`}
async function go(v){await refresh();try{if(!cards.length)await loadCards()}catch(e){app.innerHTML=msg('Impossible de charger le catalogue : '+e.message,1);return}document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===v));if(v!=='catalog'&&!user)return auth();({catalog,collection,booster,missions,market,leaderboard,trades,messages,profile:profilePage})[v]()}
function attachCardModal(){app.querySelectorAll('.cards-grid .card').forEach(el=>{if(el.dataset.modalReady)return;el.dataset.modalReady='1';const open=ev=>{if(ev.target.closest('button,a,select,input'))return;const c=cards.find(x=>x.id===el.dataset.cardId)||cards.find(x=>x.name===el.dataset.cardName);if(c)showCardModal(c)};el.addEventListener('click',open);el.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();open(ev)}})})}
function showCardModal(c){let modal=document.getElementById('cardModal');if(!modal){modal=document.createElement('div');modal.id='cardModal';modal.className='card-modal';modal.innerHTML='<button class="btn alt modal-close" aria-label="Fermer">×</button><div class="modal-content"><div class="modal-card"></div><div class="modal-info"></div></div>';document.body.appendChild(modal);modal.addEventListener('click',e=>{if(e.target===modal||e.target.closest('.modal-close'))modal.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')})}const r=RN[c.rarity]||RN.commun,s=c.series||{};modal.querySelector('.modal-card').innerHTML=card(c);modal.querySelector('.modal-info').innerHTML='<div class="eyebrow">Carte de collection · N° '+String(c.number??'—').padStart(3,'0')+'</div><h2>'+esc(c.name)+'</h2><span class="rarity-pill">'+r[1]+' '+r[0]+'</span><p>'+esc(c.spec||'Une carte de la collection GAYCHA CLUB.')+'</p><p><b>Série :</b> '+esc(s.name||'GAYCHA CLUB')+'</p><p class="eyebrow">Collectionne-les toutes</p><p>Chaque carte peut recevoir sa propre illustration. Clique en dehors de la carte ou sur × pour fermer.</p>';modal.classList.add('open')}
function cardTools(){return '<div class="toolbar"><input id="cardSearch" type="search" placeholder="Rechercher une carte…"><select id="rarityFilter" aria-label="Filtrer par rareté"><option value="">Toutes les raretés</option>'+Object.entries(RN).map(([k,v])=>'<option value="'+k+'">'+v[0]+'</option>').join('')+'</select><select id="seriesFilter" aria-label="Filtrer par série"><option value="">Toutes les séries</option>'+[...new Set(cards.map(c=>c.series?.name).filter(Boolean))].sort().map(s=>'<option value="'+esc(s)+'">'+esc(s)+'</option>').join('')+'</select><select id="sortCards" aria-label="Trier les cartes"><option value="number">Trier : numéro</option><option value="name">Nom A → Z</option><option value="rarity">Rareté</option></select><select id="cardSize" aria-label="Nombre de cartes par ligne"><option value="2">Cartes très grandes</option><option value="3">Cartes grandes</option><option value="4" selected>Grille équilibrée</option><option value="5">Plus de cartes</option></select><select id="ownedFilter" aria-label="Filtrer les cartes"><option value="all">Toutes les cartes</option><option value="owned">Possédées</option><option value="missing">Manquantes</option></select><button class="btn alt" id="resetFilters" type="button">Réinitialiser</button></div><p id="filterCount" class="eyebrow" aria-live="polite"></p>'}
function bindCardFilters(mode,counts={}){const grid=app.querySelector('.cards-grid');if(!grid)return;const apply=()=>{const q=($('cardSearch').value||'').trim().toLocaleLowerCase('fr'),rarity=$('rarityFilter').value,series=$('seriesFilter').value,sort=$('sortCards').value,owned=$('ownedFilter').value;let list=cards.filter(c=>(!q||c.name.toLocaleLowerCase('fr').includes(q)||String(c.spec||'').toLocaleLowerCase('fr').includes(q))&&(!rarity||c.rarity===rarity)&&(!series||c.series?.name===series)&&(owned==='all'||(owned==='owned'?!!counts[c.id]:!counts[c.id])));if(sort==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'fr'));else if(sort==='rarity')list.sort((a,b)=>Object.keys(RN).indexOf(b.rarity)-Object.keys(RN).indexOf(a.rarity));else list.sort((a,b)=>(a.number||0)-(b.number||0));grid.innerHTML=list.map(c=>mode==='collection'?'<div>'+card(c,counts[c.id]||1)+(counts[c.id]?((counts[c.id]>1?'<button class="btn alt" style="width:100%;margin-top:6px" data-conv="'+c.id+'" data-n="'+(counts[c.id]-1)+'">Convertir '+(counts[c.id]-1)+' doublon(s)</button>':'')+'<button class="btn alt" style="width:100%;margin-top:6px" data-sell="'+c.id+'">Vendre</button>'):'<div class="eyebrow" style="text-align:center;margin-top:8px">À découvrir</div>')+'</div>':card(c)).join('')||msg('Aucune carte ne correspond à ces filtres.');$('filterCount').textContent=list.length+' carte(s) affichée(s)';attachCardModal();if(mode==='collection')bindCollectionActions()};['cardSearch','rarityFilter','seriesFilter','sortCards','ownedFilter'].forEach(id=>$(id).addEventListener(id==='cardSearch'?'input':'change',apply));$('cardSize').addEventListener('change',()=>grid.style.setProperty('--card-cols',$('cardSize').value));$('resetFilters').onclick=()=>{['cardSearch','rarityFilter','seriesFilter'].forEach(id=>$(id).value='');$('sortCards').value='number';$('cardSize').value='4';grid.style.setProperty('--card-cols','4');$('ownedFilter').value='all';apply()};grid.style.setProperty('--card-cols',$('cardSize').value);apply()}
function bindCollectionActions(){app.querySelectorAll('[data-conv]').forEach(b=>{if(b.dataset.bound)return;b.dataset.bound='1';b.onclick=async()=>{b.disabled=true;const {data:g,error:e}=await sb.rpc('convert_duplicates',{p_card:b.dataset.conv,p_qty:+b.dataset.n,p_key:crypto.randomUUID()});if(e){if($('cm'))$('cm').innerHTML=msg(e.message,1);b.disabled=false;return}await refresh();collection()}});app.querySelectorAll('[data-sell]').forEach(b=>{if(b.dataset.bound)return;b.dataset.bound='1';b.onclick=async()=>{const pr=prompt('Prix de vente en 💰 (1 à 1 000 000) ?');if(!pr)return;const {data:ins}=await sb.from('card_instances').select('id').eq('card_id',b.dataset.sell).eq('locked',false).order('acquired_at',{ascending:false}).limit(1);if(!ins?.length){if($('cm'))$('cm').innerHTML=msg('Aucun exemplaire disponible (déjà en vente ?).',1);return}const {error:e}=await sb.rpc('list_card',{p_instance:ins[0].id,p_price:parseInt(pr,10)});if(e){if($('cm'))$('cm').innerHTML=msg(e.message,1)}else market()}})}
function catalog(){app.innerHTML='<div class="hero-panel"><div class="eyebrow">Collection de cartes · édition premium</div><h1>Bienvenue au GAYCHA CLUB</h1><p>Des cartes à découvrir, des raretés à chasser et un album à compléter. Chaque tirage peut cacher une pépite.</p><button class="btn" id="catalogBoost">Ouvrir un booster</button></div><h2>Le catalogue</h2><p>Explore les cartes et clique sur l’une d’elles pour la voir en grand.</p>'+cardTools()+'<div class="grid cards-grid"></div>';bindCardFilters('catalog');$('catalogBoost').onclick=()=>go('booster')}
async function collection(){app.innerHTML='<h1>Mon album</h1><p>Chargement de tes cartes…</p>';const {data,error}=await sb.from('card_instances').select('card_id,acquired_at').order('acquired_at',{ascending:false});if(error)return app.innerHTML=msg(error.message,1);const cnt={};(data||[]).forEach(d=>cnt[d.card_id]=(cnt[d.card_id]||0)+1);const unique=Object.keys(cnt).length,pct=cards.length?Math.round(unique/cards.length*100):0;app.innerHTML='<div class="hero-panel"><div class="eyebrow">Ton album personnel</div><h1>Chaque carte compte.</h1><p>Retrouve tes découvertes, repère les manquantes et échange tes doublons pour faire grandir ta collection.</p><div class="stat-grid"><div class="stat"><span class="eyebrow">Complété</span><strong>'+pct+' %</strong></div><div class="stat"><span class="eyebrow">Cartes uniques</span><strong>'+unique+' / '+cards.length+'</strong></div><div class="stat"><span class="eyebrow">Doublons</span><strong>'+Object.values(cnt).reduce((a,n)=>a+Math.max(0,n-1),0)+'</strong></div></div><div class="progress-track" style="margin-top:18px"><span style="width:'+pct+'%"></span></div></div><h2>Mon album de cartes</h2><p>Filtre les cartes possédées ou celles qu’il te reste à trouver.</p>'+cardTools()+'<div class="grid cards-grid"></div><div id="cm"></div>';bindCardFilters('collection',cnt);bindCollectionActions()}
function profilePage(){if(!user)return auth();const balance=Number(profile?.balance||0),username=profile?.username||user.email?.split('@')[0]||'Membre';app.innerHTML='<div class="hero-panel"><div class="eyebrow">Espace membre</div><h1>Ton univers GAYCHA</h1><p>Ta collection, ton style et tes prochaines cartes à découvrir.</p></div><div class="stat-grid"><div class="stat"><span class="eyebrow">Pseudo</span><strong style="font-size:22px">'+esc(username)+'</strong></div><div class="stat"><span class="eyebrow">Solde</span><strong>'+balance.toLocaleString('fr-FR')+' 💰</strong></div><div class="stat"><span class="eyebrow">Cartes découvertes</span><strong id="profileOwned">…</strong></div><div class="stat"><span class="eyebrow">Compte</span><strong style="font-size:22px">Actif</strong></div></div><div class="box" style="max-width:none"><h2>Progression de l’album</h2><p id="profileProgress">Calcul de la progression…</p><div class="progress-track"><span id="profileBar" style="width:0%"></span></div><p style="margin-top:18px"><button class="btn" id="goAlbum">Ouvrir mon album</button> <button class="btn alt" id="goBoosters">Découvrir des boosters</button></p></div><div class="box account-box" style="max-width:none"><h2>Connexion et sécurité</h2><p>Tu peux rattacher Google à cette session pour retrouver ton compte avec les deux méthodes de connexion.</p><button class="btn alt" id="linkGoogle" type="button">Lier mon compte Google</button><div id="linkGoogleMsg" aria-live="polite"></div><p class="account-note">Pour éviter de séparer ta collection et ton solde, connecte-toi d’abord à ton compte Gaycha existant, puis lance la liaison depuis ici.</p></div>';sb.from('card_instances').select('card_id').then(({data,error})=>{if(error)return;const n=new Set((data||[]).map(x=>x.card_id)).size,pct=cards.length?Math.round(n/cards.length*100):0;if($('profileOwned'))$('profileOwned').textContent=n+' / '+cards.length;if($('profileProgress'))$('profileProgress').textContent=pct+' % de la collection complétée';if($('profileBar'))$('profileBar').style.width=pct+'%'});$('goAlbum').onclick=()=>go('collection');$('goBoosters').onclick=()=>go('booster');$('linkGoogle').onclick=async()=>{const b=$('linkGoogle');b.disabled=true;$('linkGoogleMsg').innerHTML=msg('Préparation de la liaison Google…');const {error}=await sb.auth.linkIdentity({provider:'google',options:{redirectTo:window.location.origin+window.location.pathname}});if(error){$('linkGoogleMsg').innerHTML=msg('Liaison Google impossible : '+error.message,1);b.disabled=false}}}

go('catalog');
</script></body></html>
